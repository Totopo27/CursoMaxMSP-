<svg viewBox="0 0 940 320" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">INTEROPERABILIDAD MULTIMEDIA · TELEMETRÍA POR RED</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG B.2 · PROTOCOLO OSC (OPEN SOUND CONTROL) SOBRE UDP</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- PANEL IZQUIERDO: MAX/MSP (EMISOR DE CONTROL) -->
  <g transform="translate(25, 45)">
    <rect width="360" height="250" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="360" height="24" rx="6" fill="#27272a" />
    <rect y="19" width="360" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">1. EMISOR DE CONTROL · MAX/MSP</text>

    <!-- METRO / ENVELOPES -->
    <g transform="translate(16, 36)">
      <rect width="328" height="45" rx="4" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="10" y="18" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">GENERADORES TEMPORALES</text>
      <text x="10" y="34" fill="#f4f4f5" font-size="10" font-weight="600">[metro] / [snapshot~] / Envolventes</text>
    </g>

    <!-- ARROW -->
    <path d="M 180 81 L 180 98" stroke="#71717a" stroke-width="1.2" fill="none" marker-end="url(#arr-neutral)" />

    <!-- PAK FORMAT -->
    <g transform="translate(16, 100)">
      <rect width="328" height="50" rx="4" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="10" y="18" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">FORMATEO DE MENSAJE</text>
      <text x="10" y="36" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10" font-weight="600">[pak /sintetizador/filtro 440. 0.8]</text>
    </g>

    <!-- ARROW -->
    <path d="M 180 150 L 180 168" stroke="#eb6c36" stroke-width="1.3" fill="none" marker-end="url(#arr-accent)" />

    <!-- UDPSEND OBJECT (FOCAL) -->
    <g transform="translate(16, 170)">
      <rect width="328" height="55" rx="4" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
      <text x="10" y="18" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">CLIENTE UDP SOCKET</text>
      <text x="10" y="38" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">[udpsend 127.0.0.1 9000]</text>
    </g>
  </g>

  <!-- CANAL DE TRANSMISIÓN CENTRAL: UDP PACKETS (ZERO LATENCY) -->
  <g transform="translate(405, 120)">
    <rect width="130" height="95" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="65" y="24" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="middle">UDP SOCKET</text>
    <text x="65" y="44" fill="#fed7aa" font-size="9" text-anchor="middle">Puerto 9000</text>
    <text x="65" y="60" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">OSC Packet / Bundle</text>
    <text x="65" y="78" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">Latencia &lt; 0.5 ms</text>
  </g>

  <!-- CONNECTORS ACROSS -->
  <path d="M 370 197 L 405 197" stroke="#eb6c36" stroke-width="1.5" fill="none" marker-end="url(#arr-accent)" />
  <path d="M 535 197 L 555 197" stroke="#eb6c36" stroke-width="1.5" fill="none" marker-end="url(#arr-accent)" />

  <!-- PANEL DERECHO: TOUCHDESIGNER (RECEPTOR Y RENDER GPU) -->
  <g transform="translate(555, 45)">
    <rect width="360" height="250" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="360" height="24" rx="6" fill="#27272a" />
    <rect y="19" width="360" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">2. RECEPTOR GRÁFICO · TOUCHDESIGNER</text>

    <!-- OSC IN CHOP (FOCAL) -->
    <g transform="translate(16, 40)">
      <rect width="328" height="55" rx="4" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
      <text x="10" y="18" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">NODO RECEPTOR DE SEÑAL</text>
      <text x="10" y="38" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">OSC In CHOP (Port: 9000)</text>
    </g>

    <!-- ARROW -->
    <path d="M 180 95 L 180 115" stroke="#eb6c36" stroke-width="1.3" fill="none" marker-end="url(#arr-accent)" />

    <!-- GPU DESTINATIONS -->
    <g transform="translate(16, 118)">
      <rect width="328" height="105" rx="4" fill="#141417" stroke="#27272a" stroke-width="1" />
      <text x="10" y="20" fill="#f4f4f5" font-size="10.5" font-weight="600">Transformación Gráfica en GPU (SOP / TOP / MAT)</text>
      <text x="10" y="38" fill="#fed7aa" font-size="9">• Modulación de posición (tx, ty, tz) de mallas 3D.</text>
      <text x="10" y="54" fill="#a1a1aa" font-size="9">• Parámetros de color en shaders GLSL (r, g, b, alpha).</text>
      <text x="10" y="70" fill="#a1a1aa" font-size="9">• Disparo de iluminación escénica Art-Net / DMX 512.</text>
      <text x="10" y="90" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">Sincronización a 60 fps sin bloqueo del Audio Thread</text>
    </g>
  </g>
</svg>
