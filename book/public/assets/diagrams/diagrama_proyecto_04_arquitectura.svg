      <rect width="195" height="42" rx="4" fill="#141417" stroke="#27272a" stroke-width="1" />
      <text x="10" y="17" fill="#71717a" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Voz 8 (Core 3 · Pool)</text>
