      <text x="10" y="17" fill="#71717a" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Voz 7 (Core 2 · Pool)</text>
      <text x="10" y="32" fill="#71717a" font-size="8.5">thispoly~ (mute / bypass)</text>
