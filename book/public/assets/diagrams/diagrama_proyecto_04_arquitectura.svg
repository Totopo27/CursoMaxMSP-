  <!-- CONECTORES DUALES L / R HACIA ATENUADOR -->
  <path d="M 370 236 L 370 254" stroke="#71717a" stroke-width="1.3" fill="none" marker-end="url(#arr-neutral)" />
  <path d="M 570 236 L 570 254" stroke="#71717a" stroke-width="1.3" fill="none" marker-end="url(#arr-neutral)" />
  <text x="355" y="248" fill="#71717a" font-family="ui-monospace, monospace" font-size="8" text-anchor="end">Left Sum</text>
  <text x="585" y="248" fill="#71717a" font-family="ui-monospace, monospace" font-size="8" text-anchor="start">Right Sum</text>

