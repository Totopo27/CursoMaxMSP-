  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 4.3 · ARQUITECTURA PARALELA MULTI-CORE (@PARALLEL 1)</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- CONTROL SUPERIOR: MIDI EVENT -->
