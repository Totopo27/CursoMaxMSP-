<svg viewBox="0 0 940 320" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">MEMORIA Y TIPADO EN EL C SDK · CYCLING '74</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 1.2 · DISPOSICIÓN BINARIA DEL STRUCT T_ATOM</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- CONTENEDOR PRINCIPAL: BLOQUE DE MEMORIA DE 16 BYTES (CON ALINEACIÓN DE COMPILADOR) -->
  <g transform="translate(25, 45)">
    <rect width="890" height="150" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="890" height="24" rx="6" fill="#27272a" />
    <rect y="19" width="890" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">BLOQUE DE MEMORIA CONTIGUA EN STACK / HEAP (STRUCT T_ATOM)</text>

    <!-- CAMPO 1: a_type (short: 2 bytes) + padding (6 bytes en 64-bit ABI) -->
    <g transform="translate(20, 36)">
      <rect width="250" height="95" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
      <rect width="250" height="20" rx="5" fill="rgba(235, 108, 54, 0.18)" />
      <rect y="15" width="250" height="5" fill="rgba(235, 108, 54, 0.18)" />
      <text x="10" y="14" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">a_type (short: 2 BYTES)</text>
      <text x="10" y="40" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">Identificador de Tipo</text>
      <text x="10" y="58" fill="#fed7aa" font-size="9.5">A_LONG, A_FLOAT, A_SYM, A_OBJ</text>
      <text x="10" y="74" fill="#ea580c" font-family="ui-monospace, monospace" font-size="8.5">Tag dinámico evaluado por el kernel</text>
      <text x="10" y="87" fill="#71717a" font-size="8">+ 6 bytes de padding (alineación x86-64)</text>
    </g>

    <!-- CAMPO 2: a_w (union: 8 bytes) - FOCAL ACCENT -->
    <g transform="translate(290, 36)">
      <rect width="580" height="95" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
      <rect width="580" height="20" rx="5" fill="rgba(235, 108, 54, 0.18)" />
      <rect y="15" width="580" height="5" fill="rgba(235, 108, 54, 0.18)" />
      <text x="10" y="14" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">union word a_w (8 BYTES COMPARTIDOS EN MEMORIA)</text>

      <!-- 4 MIEMBROS DE LA UNION EN COLUMNAS -->
      <g transform="translate(10, 26)">
        <rect width="130" height="60" rx="4" fill="#222226" stroke="#3f3f46" stroke-width="1" />
        <text x="8" y="15" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">w_long</text>
        <text x="8" y="30" fill="#a1a1aa" font-size="8.5">Entero con signo</text>
        <text x="8" y="44" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">int64_t (8B)</text>
      </g>

      <g transform="translate(150, 26)">
        <rect width="130" height="60" rx="4" fill="#222226" stroke="#3f3f46" stroke-width="1" />
        <text x="8" y="15" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">w_float</text>
        <text x="8" y="30" fill="#a1a1aa" font-size="8.5">Coma flotante</text>
        <text x="8" y="44" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">double (8B)</text>
      </g>

      <g transform="translate(290, 26)">
        <rect width="130" height="60" rx="4" fill="#222226" stroke="#3f3f46" stroke-width="1" />
        <text x="8" y="15" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">w_sym</text>
        <text x="8" y="30" fill="#a1a1aa" font-size="8.5">Puntero a Symbol</text>
        <text x="8" y="44" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">t_symbol* (8B)</text>
      </g>

      <g transform="translate(430, 26)">
        <rect width="130" height="60" rx="4" fill="#222226" stroke="#3f3f46" stroke-width="1" />
        <text x="8" y="15" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">w_obj</text>
        <text x="8" y="30" fill="#a1a1aa" font-size="8.5">Puntero a Objeto</text>
        <text x="8" y="44" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">t_object* (8B)</text>
      </g>
    </g>
  </g>

  <!-- PANEL INFERIOR: IMPACTO DE RENDIMIENTO EN CACHÉ L1/L2 -->
  <g transform="translate(25, 210)">
    <rect width="890" height="90" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="890" height="22" rx="6" fill="#27272a" />
    <rect y="17" width="890" height="5" fill="#27272a" />
    <text x="12" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">PRINCIPIO DE LOCALIDAD ESPACIAL · VECTOR DE ÁTOMOS (T_ATOM ARGV[])</text>

    <text x="16" y="42" fill="#f4f4f5" font-size="10.5" font-weight="600">Arreglo Contiguo en Memoria RAM sin Fragmentación</text>
    <text x="16" y="58" fill="#a1a1aa" font-size="9.5">Un mensaje compuesto por 64 átomos se carga en una sola línea de caché de CPU L1 (~64 bytes). Cero saltos de punteros indirectos.</text>
    <text x="16" y="74" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5">Rendimiento: Transmisión de listas completas en nanosegundos entre objetos nativos de Max.</text>
  </g>
</svg>
