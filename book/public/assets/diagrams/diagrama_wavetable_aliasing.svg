<svg viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">GENERACIÓN DE SEÑALES, TABLAS DE ONDA Y ANTI-ALIASING</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 3.2 · ACUMULADOR DE FASE &amp; PLEGAMIENTO DE NYQUIST</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- PANEL IZQUIERDO: ACUMULADOR DE FASE Y WAVETABLE (CYCLE~) -->
  <g transform="translate(25, 42)">
    <rect width="430" height="248" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
    <rect width="430" height="24" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="19" width="430" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="12" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="0.06em">LÓGICA DEL OSCILADOR · ACUMULADOR DE FASE</text>

    <!-- Acumulador de fase -->
    <rect x="15" y="42" width="400" height="60" rx="3" fill="#121318" stroke="#eb6c36" stroke-width="0.8" />
    <text x="25" y="60" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="9" font-weight="600">phase += (frecuencia / samplerate);</text>
    <text x="25" y="76" fill="#a1a1aa" font-size="8.5">Rampa normalizada continua de 0.0 a 1.0 (módulo 1.0)</text>
    <text x="25" y="90" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">Puntero de lectura O(1) hacia tabla estática en memoria</text>

    <!-- Visualización de tabla de onda precalculada -->
    <rect x="15" y="114" width="400" height="68" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <text x="25" y="130" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">Wavetable precalculada en RAM [512 muestras]</text>
    <!-- Forma senoidal simulada -->
    <path d="M 25 155 Q 75 130 125 155 T 225 155 T 325 155 T 405 155" fill="none" stroke="#eb6c36" stroke-width="1.8" />
    <circle cx="125" cy="155" r="3" fill="#f4f4f5" />
    <circle cx="175" cy="130" r="3" fill="#eb6c36" />
    <text x="25" y="174" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="7.5">Interpolación lineal entre índice entero y fracción</text>

    <text x="15" y="202" fill="#d4d4d8" font-size="9">Costo computacional: <tspan fill="#22c55e" font-weight="700">~0.01% CPU</tspan> frente a cálculo directo sin().</text>
    <text x="15" y="218" fill="#71717a" font-size="8">Objeto canónico: [cycle~ 440] · Señal pura sin armónicos espurios.</text>
  </g>

  <!-- PANEL DERECHO: EL ESPEJO DE NYQUIST Y ALIASING -->
  <g transform="translate(485, 42)">
    <rect width="430" height="248" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="430" height="24" rx="5" fill="#27272a" />
    <rect y="19" width="430" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#ef4444" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="0.06em">ESPECTRO DE FRECUENCIAS · PLEGAMIENTO (ALIASING)</text>

    <!-- Gráfico espectral con límite de Nyquist -->
    <rect x="15" y="42" width="400" height="135" rx="3" fill="#121318" stroke="#27272a" stroke-width="1" />
    
    <!-- Eje de frecuencias -->
    <line x1="30" y1="140" x2="385" y2="140" stroke="#52525b" stroke-width="1" />
    <text x="30" y="154" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">0 Hz</text>
    <text x="180" y="154" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">12 kHz</text>
    <text x="290" y="154" fill="#ef4444" font-family="ui-monospace, monospace" font-size="8" font-weight="700">Nyquist (24 kHz)</text>

    <!-- Barrera vertical de Nyquist -->
    <line x1="290" y1="52" x2="290" y2="140" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Armónicos válidos -->
    <line x1="60" y1="140" x2="60" y2="70" stroke="#22c55e" stroke-width="2" />
    <text x="60" y="65" fill="#22c55e" font-family="ui-monospace, monospace" font-size="7" text-anchor="middle">f0</text>

    <line x1="110" y1="140" x2="110" y2="85" stroke="#22c55e" stroke-width="2" />
    <text x="110" y="80" fill="#22c55e" font-family="ui-monospace, monospace" font-size="7" text-anchor="middle">2f0</text>

    <line x1="160" y1="140" x2="160" y2="98" stroke="#22c55e" stroke-width="2" />
    <text x="160" y="93" fill="#22c55e" font-family="ui-monospace, monospace" font-size="7" text-anchor="middle">3f0</text>

    <line x1="210" y1="140" x2="210" y2="108" stroke="#22c55e" stroke-width="2" />
    <text x="210" y="103" fill="#22c55e" font-family="ui-monospace, monospace" font-size="7" text-anchor="middle">4f0</text>

    <!-- Armónico que supera Nyquist y rebota -->
    <line x1="340" y1="140" x2="340" y2="118" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2" />
    <text x="340" y="112" fill="#ef4444" font-family="ui-monospace, monospace" font-size="7" text-anchor="middle">5f0 (27 kHz)</text>

    <path d="M 340 118 Q 315 70 240 118" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-neutral)" />
    <text x="240" y="112" fill="#ef4444" font-family="ui-monospace, monospace" font-size="7" text-anchor="middle">Aliasing (21 kHz)</text>

    <!-- Comparativa [phasor~] vs [saw~] -->
    <rect x="15" y="185" width="400" height="48" rx="3" fill="#201515" stroke="#7f1d1d" stroke-width="0.8" />
    <text x="25" y="201" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="8">[phasor~]: Rampa pura ingenua -> Produce aliasing masivo si se oye.</text>
    <text x="25" y="217" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="8">[saw~] / [rect~]: Algoritmos PolyBLEP con banda limitada anti-aliasing.</text>
  </g>
</svg>
