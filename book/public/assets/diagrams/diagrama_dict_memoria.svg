<svg viewBox="0 0 940 320" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">MODELO DE MEMORIA COMPARTIDA Y PASO POR REFERENCIA</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 2.1 · GESTIÓN DE POINTERS EN RAM Y SINTAXIS JSON</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- RECEPTÁCULO GLOBAL EN RAM (ACCENT FOCAL) -->
  <g transform="translate(325, 42)">
    <rect width="290" height="150" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="290" height="24" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="19" width="290" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="12" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="0.06em">REGISTRO GLOBAL DE MEMORIA C (RAM)</text>
    <text x="12" y="46" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="600">dictobj_findregistered("sintetizador")</text>
    
    <!-- Representación JSON interna -->
    <rect x="12" y="56" width="266" height="82" rx="3" fill="#121318" stroke="#eb6c36" stroke-width="0.8" />
    <text x="20" y="74" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5">"filter": {</text>
    <text x="32" y="89" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">  "cutoff": 1850.5,</text>
    <text x="32" y="104" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5">  "resonance": 0.72</text>
    <text x="20" y="119" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5">}, "preset": "Ambient Pad"</text>
    <text x="20" y="132" fill="#71717a" font-family="ui-monospace, monospace" font-size="7.5">Dirección en memoria: 0x7FFF52A180</text>
  </g>

  <!-- NODO IZQUIERDO: ESCRITOR / MUTADOR -->
  <g transform="translate(25, 42)">
    <rect width="265" height="150" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="265" height="24" rx="5" fill="#27272a" />
    <rect y="19" width="265" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="0.06em">ESCRITURA ATÓMICA · PRODUCTOR</text>
    
    <text x="12" y="46" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="600">[dict sintetizador]</text>
    <rect x="12" y="56" width="241" height="42" rx="3" fill="#121318" stroke="#27272a" stroke-width="1" />
    <text x="20" y="74" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="9">set filter::cutoff 2400.</text>
    <text x="20" y="90" fill="#71717a" font-size="8">Modifica el nodo del árbol sin duplicar</text>

    <text x="12" y="122" fill="#d4d4d8" font-size="9.5">Salida por cable: Símbolo "dictionary"</text>
    <text x="12" y="136" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">Puntero de 8 bytes (t_dictionary*)</text>
  </g>

  <!-- NODO DERECHO: LECTOR / ROUTE -->
  <g transform="translate(650, 42)">
    <rect width="265" height="150" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="265" height="24" rx="5" fill="#27272a" />
    <rect y="19" width="265" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="0.06em">CONSULTA SELECTIVA · CONSUMIDOR</text>
    
    <text x="12" y="46" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="600">[dict.route filter::cutoff]</text>
    <rect x="12" y="56" width="241" height="42" rx="3" fill="#121318" stroke="#27272a" stroke-width="1" />
    <text x="20" y="74" fill="#22c55e" font-family="ui-monospace, monospace" font-size="9">Salida: 2400. (Float)</text>
    <text x="20" y="90" fill="#71717a" font-size="8">Lectura de alta velocidad en O(1)</text>

    <text x="12" y="122" fill="#d4d4d8" font-size="9.5">Destino directo hacia [live.dial]</text>
    <text x="12" y="136" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">Cero clonación de cadenas en memoria</text>
  </g>

  <!-- CONECTORES ORTOGONALES DE PUNTEROS -->
  <path d="M 290 110 L 325 110" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arr-accent)" />
  <path d="M 615 110 L 650 110" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arr-accent)" />

  <!-- PANEL INFERIOR: CONTRASTE ARQUITECTÓNICO -->
  <g transform="translate(25, 210)">
    <rect width="890" height="92" rx="4" fill="#151518" stroke="#27272a" stroke-width="1" />
    <text x="20" y="24" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" font-weight="700">FUNDAMENTO DE RENDIMIENTO: PASO POR VALOR VS. PASO POR REFERENCIA</text>
    
    <text x="20" y="46" fill="#ef4444" font-family="ui-monospace, monospace" font-size="8.5">[x] Copia de JSON Completo (Paso por Valor):</text>
    <text x="320" y="46" fill="#a1a1aa" font-size="8.5">Serializar 100 KB de texto y clonarlos en cada cable colapsaría el Scheduler con recolección de basura.</text>
    
    <text x="20" y="68" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5">[✓] Paso por Referencia con [dict]:</text>
    <text x="320" y="68" fill="#e4e4e7" font-size="8.5">Max viaja por el cable con un único puntero C de 64 bits (8 bytes). Cero copias en memoria, tiempo constante.</text>

    <line x1="20" y1="54" x2="870" y2="54" stroke="#27272a" stroke-width="0.7" />
  </g>
</svg>
