<svg viewBox="0 0 940 280" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">RENDER PIPELINE OPENGL · ACCIÓN COORDINADA DE JIT.WORLD Y SHADERS JIT.GEN</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG A.4 · DEFORMACIÓN DE MALLAS 3D EN GPU CON [JIT.GL.MESH] A 60 FPS</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <g transform="translate(25, 45)">
    <rect width="890" height="215" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />

    <!-- RELOJ MAESTRO JIT.WORLD -->
    <g transform="translate(20, 65)">
      <rect width="145" height="75" rx="4" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
      <text x="72" y="26" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">[ jit.world ctx ]</text>
      <text x="72" y="44" fill="#f4f4f5" font-size="8.5" text-anchor="middle">@enable 1 @fps 60</text>
      <text x="72" y="60" fill="#22c55e" font-size="8" text-anchor="middle">bang sincronizado V-Sync</text>
    </g>

    <path d="M 165 102 L 205 102" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#arr-accent)" />

    <!-- MATRIZ ESPECTRAL DE PFFT~ -->
    <g transform="translate(210, 65)">
      <rect width="140" height="75" rx="4" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="70" y="26" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" text-anchor="middle">[ pfft~ matriz ]</text>
      <text x="70" y="44" fill="#a1a1aa" font-size="8" text-anchor="middle">Emite matriz flotante</text>
      <text x="70" y="60" fill="#71717a" font-size="8" text-anchor="middle">Amplitud de bins</text>
    </g>

    <path d="M 350 102 L 390 102" stroke="#71717a" stroke-width="1.6" marker-end="url(#arr-neutral)" />

    <!-- RE-ORIENTACIÓN [jit.dimmap] -->
    <g transform="translate(395, 65)">
      <rect width="135" height="75" rx="4" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="67" y="26" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">[ jit.dimmap ]</text>
      <text x="67" y="44" fill="#a1a1aa" font-size="8" text-anchor="middle">@invert 0 1</text>
      <text x="67" y="60" fill="#71717a" font-size="8" text-anchor="middle">Inversión espacial</text>
    </g>

    <path d="M 530 102 L 570 102" stroke="#71717a" stroke-width="1.6" marker-end="url(#arr-neutral)" />

    <!-- MAPEO DE VÉRTICES GPU [jit.gen] -->
    <g transform="translate(575, 60)">
      <rect width="140" height="85" rx="4" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
      <rect width="140" height="18" rx="4" fill="rgba(235, 108, 54, 0.18)" />
      <text x="8" y="13" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">SHADER GLSL EN GPU</text>
      <text x="70" y="40" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" text-anchor="middle">[ jit.gen ]</text>
      <text x="70" y="58" fill="#fed7aa" font-size="8" text-anchor="middle">vec(snorm.y, r*k, 0)</text>
      <text x="70" y="72" fill="#a7f3d0" font-size="7.5" text-anchor="middle">Cálculo de posición X,Y,Z</text>
    </g>

    <path d="M 715 102 L 755 102" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#arr-accent)" />

    <!-- MALLA 3D [jit.gl.mesh] -->
    <g transform="translate(760, 60)">
      <rect width="110" height="85" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.2" />
      <text x="55" y="24" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">[ jit.gl.mesh ]</text>
      <text x="55" y="42" fill="#a1a1aa" font-size="8" text-anchor="middle">@draw_mode</text>
      <text x="55" y="56" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">line_strip</text>
      <text x="55" y="74" fill="#22c55e" font-size="7.5" text-anchor="middle">Hardware VBO</text>
    </g>

    <!-- NOTA AL PIE -->
    <g transform="translate(20, 165)">
      <text x="0" y="20" fill="#a1a1aa" font-size="8.5">Renderizado directo en la tarjeta gráfica sin sobrecargar el hilo de audio ni la CPU principal.</text>
    </g>
  </g>
</svg>