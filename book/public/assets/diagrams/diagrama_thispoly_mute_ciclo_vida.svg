<svg viewBox="0 0 940 260" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-poly" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">CICLO DE VIDA POLIFÓNICO · EL PROTOCOLO MUTE Y EL OBJETO [THISPOLY~]</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 4.2B · OPTIMIZACIÓN DEL PERFORM64 EN REPOSO</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- PANEL IZQUIERDO: CIRCUITO DE CONTROL INTERNO DE VOZ -->
  <g transform="translate(25, 45)">
    <rect width="470" height="195" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1.2"/>
    <rect width="470" height="22" rx="5" fill="#27272a"/>
    <rect y="17" width="470" height="5" fill="#27272a"/>
    <text x="12" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">CIRCUITO AUTÓNOMO DENTRO DE CADA VOZ POLIFÓNICA</text>

    <!-- [adsr~] -->
    <g transform="translate(30, 35)">
      <rect width="210" height="34" rx="3" fill="#222226" stroke="#52525b" stroke-width="1.2"/>
      <circle cx="20" cy="34" r="2.5" fill="#f59e0b"/>
      <circle cx="190" cy="34" r="2.5" fill="#38bdf8"/>
      <text x="105" y="21" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">adsr~ 10. 150. 0.5 300.</text>
    </g>

    <!-- Outlet 1: Audio -->
    <line x1="50" y1="69" x2="50" y2="95" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="20" y="95" width="80" height="26" rx="3" fill="#1c1613" stroke="#eb6c36" stroke-width="1"/>
    <text x="60" y="112" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="middle">*~ audio</text>

    <!-- Outlet 3: Actividad (1/0) -->
    <line x1="220" y1="69" x2="220" y2="95" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="235" y="85" fill="#a1a1aa" font-size="7.5">3er outlet: 1 al sonar / 0 al callar</text>

    <!-- [!= 0.] -->
    <rect x="180" y="95" width="80" height="26" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
    <text x="220" y="112" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="middle">!= 0.</text>

    <!-- Cable a message -->
    <line x1="220" y1="121" x2="220" y2="135" stroke="#71717a" stroke-width="1.5"/>

    <!-- [message: mute $1, $1] -->
    <rect x="140" y="135" width="160" height="24" rx="3" fill="#222226" stroke="#38bdf8" stroke-width="1"/>
    <text x="220" y="151" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="middle">mute $1, $1</text>

    <!-- Cable a thispoly~ -->
    <line x1="220" y1="159" x2="220" y2="172" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#arr-poly)"/>

    <!-- [thispoly~] -->
    <rect x="140" y="172" width="160" height="26" rx="3" fill="#1c1613" stroke="#eb6c36" stroke-width="1.4"/>
    <text x="220" y="189" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" text-anchor="middle">thispoly~</text>
  </g>

  <!-- PANEL DERECHO: PROTOCOLO DE CONMUTACIÓN DSP -->
  <g transform="translate(515, 45)">
    <rect width="400" height="195" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2"/>
    <rect width="400" height="22" rx="5" fill="#222226"/>
    <rect y="17" width="400" height="5" fill="#222226"/>
    <text x="12" y="15" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">MÁQUINA DE ESTADOS Y CONSUMO DE CPU</text>

    <g transform="translate(15, 35)">
      <!-- Estado 1: ACTIVA -->
      <rect width="370" height="65" rx="3" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="12" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9" font-weight="700">ESTADO 1: VOZ ACTIVA (SONANDO)</text>
      <text x="12" y="36" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5">Mensaje despachado: mute 0 1</text>
      <text x="12" y="52" fill="#fed7aa" font-size="8">• Mute OFF / Busy ON: la voz computa en DSP y rechaza ser interrumpida.</text>

      <!-- Estado 2: MUTED -->
      <g transform="translate(0, 75)">
        <rect width="370" height="65" rx="3" fill="#142417" stroke="#22c55e" stroke-width="1.2"/>
        <text x="12" y="20" fill="#22c55e" font-family="ui-monospace, monospace" font-size="9" font-weight="700">ESTADO 2: VOZ EN REPOSO (SILENCIADA)</text>
        <text x="12" y="36" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5">Mensaje despachado: mute 1 0</text>
        <text x="12" y="52" fill="#a1a1aa" font-size="8">• Mute ON / Busy OFF: bucle perform64 desconectado. ¡0% CPU en reposo!</text>
      </g>
    </g>
  </g>
</svg>