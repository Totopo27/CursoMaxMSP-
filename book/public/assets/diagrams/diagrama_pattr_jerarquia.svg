<svg viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">SISTEMA DE PRESETS GLOBALES Y MORPHING CONTINUO</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 2.2 · PROTOCOLO PATTRSTORAGE &amp; BINDING BIDIRECCIONAL</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- NODO CENTRAL SUPERIOR: PATTRSTORAGE (ACCENT FOCAL) -->
  <g transform="translate(300, 42)">
    <rect width="340" height="96" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="340" height="24" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="19" width="340" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="12" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="0.06em">CEREBRO DE PRESETS Y MORPHING</text>
    
    <text x="12" y="46" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="700">[pattrstorage mi_banco @savemode 3]</text>
    <text x="12" y="64" fill="#fed7aa" font-size="9.5">Espacio N-dimensional · recall 1 2 0.45</text>
    <text x="12" y="80" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">Serialización universal JSON/XML · write / read</text>
  </g>

  <!-- NODO IZQUIERDO: AUTOPATTR -->
  <g transform="translate(25, 60)">
    <rect width="230" height="78" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="230" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="230" height="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">ESCANEO DINÁMICO</text>
    <text x="10" y="42" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">[autopattr @autoname 1]</text>
    <text x="10" y="60" fill="#a1a1aa" font-size="8.5">Vincula toda UI con scripting name</text>
  </g>

  <!-- CONEXIÓN AUTOPATTR A PATTRSTORAGE -->
  <path d="M 255 95 L 300 95" fill="none" stroke="#71717a" stroke-dasharray="3,3" stroke-width="1.2" marker-end="url(#arr-neutral)" />

  <!-- NODO DERECHO: CONTROL DE MORPHING -->
  <g transform="translate(685, 60)">
    <rect width="230" height="78" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="230" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="230" height="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">INTERPOLADOR TEMPORAL</text>
    <text x="10" y="42" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">recall 1 2 4000.</text>
    <text x="10" y="60" fill="#eb6c36" font-size="8.5">Transición suave en 4 segundos</text>
  </g>

  <!-- CONEXIÓN CONTROL A PATTRSTORAGE -->
  <path d="M 685 95 L 640 95" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />

  <!-- FILA INFERIOR: CLIENTES PATTR Y CONTROLES UI -->
  <!-- Cliente 1: Cutoff -->
  <g transform="translate(65, 175)">
    <rect width="230" height="115" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="10" y="22" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">[pattr cutoff @interp 1]</text>
    <text x="10" y="38" fill="#22c55e" font-size="8">Interpolación Lineal Continua</text>
    <line x1="10" y1="46" x2="220" y2="46" stroke="#27272a" stroke-width="0.8" />
    
    <rect x="25" y="56" width="180" height="42" rx="3" fill="#121318" stroke="#3f3f46" stroke-width="0.8" />
    <text x="35" y="74" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="9">[live.dial] Script: dial_cutoff</text>
    <text x="35" y="90" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="8.5">Valor Actual: 1420 Hz</text>
  </g>

  <!-- Cliente 2: Resonancia -->
  <g transform="translate(355, 175)">
    <rect width="230" height="115" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="10" y="22" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">[pattr resonance @interp 1]</text>
    <text x="10" y="38" fill="#22c55e" font-size="8">Interpolación Lineal Continua</text>
    <line x1="10" y1="46" x2="220" y2="46" stroke="#27272a" stroke-width="0.8" />
    
    <rect x="25" y="56" width="180" height="42" rx="3" fill="#121318" stroke="#3f3f46" stroke-width="0.8" />
    <text x="35" y="74" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="9">[live.dial] Script: dial_q</text>
    <text x="35" y="90" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="8.5">Valor Actual: 0.68</text>
  </g>

  <!-- Cliente 3: Selector Forma de Onda (Discreto) -->
  <g transform="translate(645, 175)">
    <rect width="230" height="115" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="10" y="22" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">[pattr waveform @interp 0]</text>
    <text x="10" y="38" fill="#ef4444" font-size="8">Sin Interpolación (Discreto)</text>
    <line x1="10" y1="46" x2="220" y2="46" stroke="#27272a" stroke-width="0.8" />
    
    <rect x="25" y="56" width="180" height="42" rx="3" fill="#121318" stroke="#3f3f46" stroke-width="0.8" />
    <text x="35" y="74" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="9">[live.menu] Script: sel_wave</text>
    <text x="35" y="90" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="8.5">Valor: 1 (Sierra)</text>
  </g>

  <!-- CABLES BIDIRECCIONALES DESDE PATTRSTORAGE A CLIENTES -->
  <path d="M 400 138 L 400 155 L 180 155 L 180 175" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />
  <path d="M 470 138 L 470 175" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />
  <path d="M 540 138 L 540 155 L 760 155 L 760 175" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-neutral)" />
</svg>
