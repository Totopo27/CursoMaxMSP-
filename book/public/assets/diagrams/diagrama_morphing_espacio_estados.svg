<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">INTERPOLACIÓN PARAMÉTRICA N-DIMENSIONAL · ESPACIO DE ESTADOS</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 2.1 · TRAYECTORIA DE MORPHING CONTINUO EN R^N (PATTR)</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- CONTENEDOR PRINCIPAL -->
  <g transform="translate(25, 45)">
    <rect width="890" height="260" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="890" height="24" rx="6" fill="#27272a" />
    <rect y="19" width="890" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">ESPACIO EUCLIDIANO DE PARÁMETROS ACÚSTICOS (RESONANCIA VS. CUTOFF)</text>

    <!-- PLANO CARTESIANO 2D (IZQUIERDA) -->
    <g transform="translate(30, 40)">
      <!-- Ejes -->
      <line x1="40" y1="180" x2="380" y2="180" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr-neutral)" />
      <line x1="40" y1="180" x2="40" y2="20" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr-neutral)" />
      <text x="385" y="184" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5">Parámetro 1 (Cutoff fc)</text>
      <text x="35" y="12" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5">Parámetro 2 (Resonancia Q)</text>

      <!-- Rejilla de fondo -->
      <line x1="120" y1="25" x2="120" y2="180" stroke="#27272a" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="200" y1="25" x2="200" y2="180" stroke="#27272a" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="280" y1="25" x2="280" y2="180" stroke="#27272a" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="40" y1="130" x2="360" y2="130" stroke="#27272a" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="40" y1="80" x2="360" y2="80" stroke="#27272a" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Vector Trayectoria Morphing (P1 a P2) -->
      <line x1="100" y1="140" x2="300" y2="50" stroke="#eb6c36" stroke-width="2.5" />
      
      <!-- Preset 1 [P1] -->
      <circle cx="100" cy="140" r="5" fill="#38bdf8" stroke="#f4f4f5" stroke-width="1.5" />
      <text x="90" y="160" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9" font-weight="700">Preset 1 (alpha=0.0)</text>
      <text x="90" y="172" fill="#71717a" font-size="8">[0.2, 0.3]</text>

      <!-- Preset 2 [P2] -->
      <circle cx="300" cy="50" r="5" fill="#eb6c36" stroke="#f4f4f5" stroke-width="1.5" />
      <text x="270" y="38" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9" font-weight="700">Preset 2 (alpha=1.0)</text>
      <text x="270" y="24" fill="#fed7aa" font-size="8">[0.8, 0.9]</text>

      <!-- Estado Intermedio Híbrido (P_inter) -->
      <circle cx="200" cy="95" r="4" fill="#a78bfa" />
      <text x="210" y="100" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">P(alpha=0.5) Timbre Híbrido</text>
    </g>

    <!-- PANEL EXPLICATIVO DERECHO (FOCAL ACCENT) -->
    <g transform="translate(450, 40)">
      <rect width="420" height="195" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
      <rect width="420" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)" />
      <rect y="17" width="420" height="5" fill="rgba(235, 108, 54, 0.18)" />
      <text x="12" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">ECUACIÓN DE INTERPOLACIÓN CONTINUA (LERP)</text>

      <g transform="translate(15, 35)">
        <text x="0" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">P(alpha) = (1 - alpha) * P1 + alpha * P2</text>
        
        <text x="0" y="42" fill="#fed7aa" font-size="9.5">• alpha in [0.0, 1.0]: Variable escalar de interpolación suave.</text>
        <text x="0" y="60" fill="#a1a1aa" font-size="9">• Elimina discontinuidades acústicas (clicks, saltos abruptos).</text>
        <text x="0" y="78" fill="#a1a1aa" font-size="9">• Modulable mediante rampas de tiempo (ej: recall 1 2 4000.).</text>
        <text x="0" y="96" fill="#a1a1aa" font-size="9">• Extensible a espacios baricéntricos con [nodes] y [pattrstorage].</text>
        
        <rect x="0" y="115" width="390" height="30" rx="3" fill="#2a1b14" stroke="#eb6c36" stroke-width="1" />
        <text x="10" y="134" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5">Resultado: Timbre dinámico, orgánico y matemáticamente coherente.</text>
      </g>
    </g>
  </g>
</svg>
