<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">SISTEMA DE INSTRUMENTO HÍBRIDO · PROYECTO 3</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 3.5 · ARQUITECTURA DSP FM-SUSTRACTIVO CON TAPE DELAY</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- CONTROL SUPERIOR: MIDI / KSLIDER -->
  <g transform="translate(370, 38)">
    <rect width="200" height="38" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="100" y="23" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" text-anchor="middle">MIDI / kslider Note ($1 $2)</text>
  </g>

  <!-- CONECTORES HACIA C:M RATIO (FREQ FC) Y ADSR PRINCIPAL -->
  <path d="M 420 76 L 420 95 L 250 95 L 250 105" stroke="#71717a" stroke-width="1.3" fill="none" marker-end="url(#arr-neutral)" />
  <path d="M 520 76 L 520 95 L 750 95 L 750 105" stroke="#71717a" stroke-width="1.3" fill="none" marker-end="url(#arr-neutral)" />
  <text x="320" y="90" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8">Freq fc (mtof)</text>
  <text x="640" y="90" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8">Gate / Velocity</text>

  <!-- FILA 1: C:M RATIO MATH (IZQ) & ADSR PRINCIPAL (DER) -->
  <g transform="translate(150, 107)">
    <rect width="200" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="10" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">CÁLCULO DE FRECUENCIAS</text>
    <text x="10" y="32" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10" font-weight="600">C:M Ratio Math (fc, fm)</text>
  </g>

  <g transform="translate(650, 107)">
    <rect width="200" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="10" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">ENV AMPLITUD (VCA)</text>
    <text x="10" y="32" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10" font-weight="600">[adsr~] Anti-clic master</text>
  </g>

  <!-- MOTOR FM: MODULADOR (CYCLE~) + FM INDEX -->
  <g transform="translate(100, 170)">
    <rect width="300" height="60" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
    <text x="10" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">MODULADOR DE FRECUENCIA</text>
    <text x="10" y="34" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">[cycle~ fm] ──► [*~ I(t)] (FM Index)</text>
    <text x="10" y="50" fill="#fed7aa" font-size="8.5">Envolvente tímbrica dinámica independiente</text>
  </g>

  <!-- PORTADORA (CARRIER CYCLE~) - FOCAL ACCENT -->
  <g transform="translate(430, 170)">
    <rect width="200" height="60" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="200" height="18" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="13" width="200" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="10" y="13" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">PORTADORA (CARRIER)</text>
    <text x="10" y="36" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">[cycle~ fc]</text>
    <text x="10" y="52" fill="#fed7aa" font-size="8.5">Modulación de fase d(t)</text>
  </g>

  <!-- CONECTORES FM A PORTADORA -->
  <path d="M 250 149 L 250 170" stroke="#71717a" stroke-width="1.2" fill="none" marker-end="url(#arr-neutral)" />
  <path d="M 400 200 L 430 200" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arr-accent)" />

  <!-- ETAPA SUSTRACTIVA Y ESPACIAL INFERIOR -->
  <!-- FILTRO LORES~ -->
  <g transform="translate(45, 250)">
    <rect width="250" height="65" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="10" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">FILTRO SUSTRACTIVO</text>
    <text x="10" y="36" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">[lores~] Resonante 2-polos</text>
    <text x="10" y="52" fill="#71717a" font-size="8.5">Corte modulado por LFO de control</text>
  </g>

  <!-- VCA & HEADROOM -->
  <g transform="translate(325, 250)">
    <rect width="250" height="65" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="10" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">VCA & HEADROOM PROTEGIDO</text>
    <text x="10" y="36" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">[*~] VCA x [*~ 0.35]</text>
    <text x="10" y="52" fill="#71717a" font-size="8.5">Atenuación nominal a -9 dB (Anti-clipping)</text>
  </g>

  <!-- TAPE DELAY ESTÉREO CON DOPPLER -->
  <g transform="translate(605, 250)">
    <rect width="290" height="65" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
    <text x="10" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">PROCESADOR TEMPORAL ESPACIAL</text>
    <text x="10" y="36" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">Tape Delay [tapin~ / tapout~]</text>
    <text x="10" y="52" fill="#fed7aa" font-size="8.5">LFO Doppler + Feedback con damping ──► ezdac~</text>
  </g>

  <!-- CONECTORES ENTRE ETAPAS INFERIORES -->
  <path d="M 530 230 L 530 240 L 170 240 L 170 250" stroke="#71717a" stroke-width="1.2" fill="none" marker-end="url(#arr-neutral)" />
  <path d="M 295 282 L 325 282" stroke="#71717a" stroke-width="1.2" fill="none" marker-end="url(#arr-neutral)" />
  <path d="M 575 282 L 605 282" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arr-accent)" />
  <!-- Conexión de ADSR a VCA -->
  <path d="M 750 149 L 750 200 L 450 200 L 450 250" stroke="#71717a" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arr-neutral)" />
</svg>
