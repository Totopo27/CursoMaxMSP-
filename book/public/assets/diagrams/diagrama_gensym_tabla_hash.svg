<svg viewBox="0 0 940 230" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-sym" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">TEORÍA DE SÍMBOLOS EN C · INTERNING Y TABLA HASH GLOBAL CON GENSYM()</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 1.2B · COMPARACIONES EN TIEMPO CONSTANTE O(1)</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- BLOQUE 1: ENTRADA DE TEXTO -->
  <g transform="translate(30, 60)">
    <rect width="190" height="90" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="15" y="24" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">TEXTO / STRING ENTRADA</text>
    <rect x="15" y="38" width="160" height="34" rx="3" fill="#222226" stroke="#52525b" stroke-width="1"/>
    <text x="95" y="59" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">"mi_variable"</text>
    <text x="95" y="110" fill="#71717a" font-size="8" text-anchor="middle">Longitud N caracteres arbitrarios</text>
  </g>

  <!-- FLECHA A FUNCION HASH -->
  <line x1="220" y1="105" x2="280" y2="105" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#arr-sym)"/>
  <text x="250" y="96" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">gensym()</text>

  <!-- BLOQUE 2: ALGORITMO HASH -->
  <g transform="translate(290, 60)">
    <rect width="210" height="90" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.4"/>
    <text x="15" y="24" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">MOTOR DE HASHING (C SDK)</text>
    <rect x="15" y="38" width="180" height="34" rx="3" fill="#2a1b14" stroke="#eb6c36" stroke-width="1"/>
    <text x="105" y="59" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" text-anchor="middle">Hash Function & Lookup</text>
    <text x="105" y="110" fill="#fed7aa" font-size="8" text-anchor="middle">Interning inmutable en RAM</text>
  </g>

  <!-- FLECHA A TABLA HASH -->
  <line x1="500" y1="105" x2="560" y2="105" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#arr-sym)"/>
  <text x="530" y="96" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">Index</text>

  <!-- BLOQUE 3: ESTRUCTURA T_SYMBOL -->
  <g transform="translate(570, 48)">
    <rect width="340" height="150" rx="5" fill="#18181b" stroke="#38bdf8" stroke-width="1.3"/>
    <rect width="340" height="22" rx="5" fill="#222226"/>
    <rect y="17" width="340" height="5" fill="#222226"/>
    <text x="15" y="15" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">PUNTERO A ESTRUCTURA T_SYMBOL (TABLA GLOBAL)</text>

    <g transform="translate(15, 32)">
      <rect width="310" height="30" rx="3" fill="#1c1613" stroke="#eb6c36" stroke-width="1"/>
      <text x="10" y="19" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9" font-weight="700">PUNTERO C: 0x7FFF12A0 (Inmutable)</text>
    </g>

    <g transform="translate(15, 68)">
      <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8">• s_name: char* "mi_variable"</text>
      <text x="10" y="30" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8">• s_thing: void* (puntero a objeto asociado si aplica)</text>
      <text x="10" y="45" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8">✓ Comparación ptrA == ptrB: 1 solo ciclo de reloj CPU</text>
    </g>
  </g>
</svg>