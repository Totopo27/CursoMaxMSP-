<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">MODULACIÓN DE AMPLITUD Y PRODUCTO · DSP</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 3.2 · RING MODULATION (BIPOLAR) VS. AMPLITUDE MOD (UNIPOLAR)</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- PANEL IZQUIERDO: RING MODULATION (RM / BIPOLAR) - FOCAL ACCENT -->
  <g transform="translate(25, 45)">
    <rect width="430" height="260" rx="6" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="430" height="24" rx="6" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="19" width="430" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="12" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">1. RING MODULATION (RM / BIPOLAR SIN DC OFFSET)</text>

    <!-- ESPECTRO GRÁFICO RM -->
    <g transform="translate(16, 36)">
      <rect width="398" height="95" rx="4" fill="#2a1b14" stroke="#eb6c36" stroke-width="1" />
      <line x1="20" y1="75" x2="380" y2="75" stroke="#71717a" stroke-width="1" />
      
      <!-- Portadora original desaparecida (linea de trazos) -->
      <line x1="200" y1="75" x2="200" y2="25" stroke="#71717a" stroke-width="1.5" stroke-dasharray="3 3" />
      <text x="200" y="20" fill="#71717a" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">fc (440 Hz) SUPRIMIDA</text>

      <!-- Banda lateral inferior (fc - fm = 340 Hz) -->
      <line x1="120" y1="75" x2="120" y2="25" stroke="#eb6c36" stroke-width="2.2" />
      <circle cx="120" cy="25" r="3" fill="#eb6c36" />
      <text x="120" y="88" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">fc - fm (340 Hz)</text>

      <!-- Banda lateral superior (fc + fm = 540 Hz) -->
      <line x1="280" y1="75" x2="280" y2="25" stroke="#eb6c36" stroke-width="2.2" />
      <circle cx="280" cy="25" r="3" fill="#eb6c36" />
      <text x="280" y="88" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">fc + fm (540 Hz)</text>
    </g>

    <!-- PROPIEDADES RM -->
    <g transform="translate(16, 145)">
      <text x="0" y="16" fill="#f4f4f5" font-size="10.5" font-weight="600">Multiplicación Bipolar Directa: Carrier * Modulator</text>
      <text x="0" y="32" fill="#fed7aa" font-size="9">• Moduladora oscila entre -1.0 y +1.0 (media = 0.0).</text>
      <text x="0" y="48" fill="#fed7aa" font-size="9">• ¡La frecuencia fundamental desaparece completamente!</text>
      <text x="0" y="64" fill="#a1a1aa" font-size="9">• Salida: Únicamente suma y diferencia de frecuencias.</text>
      <text x="0" y="82" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5">Timbre: Metálico, acampanado, robótico y no armónico</text>
    </g>
  </g>

  <!-- PANEL DERECHO: AMPLITUDE MODULATION (AM / UNIPOLAR) -->
  <g transform="translate(485, 45)">
    <rect width="430" height="260" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="430" height="24" rx="6" fill="#27272a" />
    <rect y="19" width="430" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">2. AMPLITUDE MODULATION (AM / UNIPOLAR CON OFFSET DC)</text>

    <!-- ESPECTRO GRÁFICO AM -->
    <g transform="translate(16, 36)">
      <rect width="398" height="95" rx="4" fill="#141417" stroke="#27272a" stroke-width="1" />
      <line x1="20" y1="75" x2="380" y2="75" stroke="#3f3f46" stroke-width="1" />
      
      <!-- Portadora original presente -->
      <line x1="200" y1="75" x2="200" y2="20" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="200" cy="20" r="3" fill="#38bdf8" />
      <text x="200" y="88" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">fc (440 Hz) PRESENTE</text>

      <!-- Banda lateral inferior (fc - fm = 340 Hz) -->
      <line x1="120" y1="75" x2="120" y2="38" stroke="#a1a1aa" stroke-width="1.8" />
      <circle cx="120" cy="38" r="2.5" fill="#a1a1aa" />
      <text x="120" y="88" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">fc - fm</text>

      <!-- Banda lateral superior (fc + fm = 540 Hz) -->
      <line x1="280" y1="75" x2="280" y2="38" stroke="#a1a1aa" stroke-width="1.8" />
      <circle cx="280" cy="38" r="2.5" fill="#a1a1aa" />
      <text x="280" y="88" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">fc + fm</text>
    </g>

    <!-- PROPIEDADES AM -->
    <g transform="translate(16, 145)">
      <text x="0" y="16" fill="#f4f4f5" font-size="10.5" font-weight="600">Multiplicación Unipolar: Carrier * (1.0 + Modulator)</text>
      <text x="0" y="32" fill="#a1a1aa" font-size="9">• Moduladora unipolar: oscila entre 0.0 y 1.0 (con DC Offset).</text>
      <text x="0" y="48" fill="#a1a1aa" font-size="9">• La frecuencia fundamental portadora (fc) PERMANECE intacta.</text>
      <text x="0" y="64" fill="#a1a1aa" font-size="9">• Salida: La portadora central + 2 bandas laterales secundarias.</text>
      <text x="0" y="82" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8.5">Timbre: Trémolo rítmico (LFO) o engrosamiento armónico cálido</text>
    </g>
  </g>
</svg>
