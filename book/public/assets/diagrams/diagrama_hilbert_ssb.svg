<svg viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">SEÑAL ANALÍTICA EN CUADRATURA · TRANSFORMADA DE HILBERT</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 3.2B · SINGLE-SIDEBAND (SSB) FREQUENCY SHIFTER</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <g transform="translate(25, 45)">
    <rect width="890" height="245" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />

    <!-- ENTRADA [ audio in ] -->
    <g transform="translate(20, 95)">
      <rect width="105" height="42" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1" />
      <text x="52" y="26" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">[ audio in ]</text>
    </g>

    <path d="M 125 116 L 165 116" stroke="#71717a" stroke-width="1.8" marker-end="url(#arr-neutral)" />

    <!-- OBJETO [ hilbert~ ] -->
    <g transform="translate(170, 75)">
      <rect width="130" height="82" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
      <rect width="130" height="20" rx="5" fill="rgba(235, 108, 54, 0.18)" />
      <rect y="15" width="130" height="5" fill="rgba(235, 108, 54, 0.18)" />
      <text x="10" y="14" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">FILTRO 90° PHASE</text>
      <text x="65" y="44" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">[ hilbert~ ]</text>
      <text x="25" y="70" fill="#a1a1aa" font-size="8">Real 0°</text>
      <text x="95" y="70" fill="#a1a1aa" font-size="8">Imag -90°</text>
    </g>

    <!-- RAMA REAL 0° (SUPERIOR) -->
    <path d="M 200 157 L 200 190 L 360 190" stroke="#71717a" stroke-width="1.6" fill="none" marker-end="url(#arr-neutral)" />
    <!-- RAMA IMAG -90° (INFERIOR) -->
    <!-- Corregir trazado: Outlet izquierdo (Real) es x=205, Outlet derecho (Imag) es x=265 -->
    <!-- Rama Real superior hacia arriba -->
    <path d="M 205 75 L 205 55 L 360 55" stroke="#71717a" stroke-width="1.6" fill="none" marker-end="url(#arr-neutral)" />
    <text x="280" y="48" fill="#71717a" font-family="ui-monospace, monospace" font-size="8.5">Real x(t) [0°]</text>

    <!-- Rama Imag hacia abajo -->
    <path d="M 265 157 L 265 175 L 360 175" stroke="#71717a" stroke-width="1.6" fill="none" marker-end="url(#arr-neutral)" />
    <text x="280" y="168" fill="#71717a" font-family="ui-monospace, monospace" font-size="8.5">Imag H{x(t)} [-90°]</text>

    <!-- MULTIPLICADOR REAL [*~] (ARRIBA) -->
    <g transform="translate(365, 36)">
      <rect width="65" height="38" rx="4" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="32" y="24" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">[*~]</text>
    </g>

    <!-- MULTIPLICADOR IMAG [*~] (ABAJO) -->
    <g transform="translate(365, 156)">
      <rect width="65" height="38" rx="4" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="32" y="24" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">[*~]</text>
    </g>

    <!-- OSCILADORES MODULADORES EN CUADRATURA -->
    <g transform="translate(340, 95)">
      <rect width="115" height="25" rx="3" fill="#18181b" stroke="#eb6c36" stroke-width="1" />
      <text x="57" y="17" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">cycle~ fc (cos)</text>
    </g>
    <path d="M 397 95 L 397 78" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arr-accent)" />

    <g transform="translate(340, 124)">
      <rect width="115" height="25" rx="3" fill="#18181b" stroke="#eb6c36" stroke-width="1" />
      <text x="57" y="17" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">cycle~ fc 0.25 (sin)</text>
    </g>
    <path d="M 397 149 L 397 154" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arr-accent)" />

    <!-- CONEXIONES DESDE MULTIPLICADORES A SUMADOR Y RESTADOR -->
    <path d="M 430 55 L 530 55" stroke="#71717a" stroke-width="1.6" />
    <path d="M 430 175 L 530 175" stroke="#71717a" stroke-width="1.6" />

    <!-- NODO RESTA [-~] (SUPERIOR: BANDA SUPERIOR) -->
    <g transform="translate(540, 40)">
      <rect width="70" height="38" rx="4" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
      <text x="35" y="24" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">[-~]</text>
    </g>
    <!-- Conectar entradas a [-~] -->
    <path d="M 530 55 L 538 55" stroke="#71717a" stroke-width="1.6" marker-end="url(#arr-neutral)" />
    <path d="M 490 175 L 490 70 L 538 70" stroke="#71717a" stroke-width="1.4" fill="none" marker-end="url(#arr-neutral)" />

    <!-- NODO SUMA [+~] (INFERIOR: BANDA INFERIOR) -->
    <g transform="translate(540, 155)">
      <rect width="70" height="38" rx="4" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
      <text x="35" y="24" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">[+~]</text>
    </g>
    <path d="M 530 175 L 538 175" stroke="#71717a" stroke-width="1.6" marker-end="url(#arr-neutral)" />
    <path d="M 470 55 L 470 162 L 538 162" stroke="#71717a" stroke-width="1.4" fill="none" marker-end="url(#arr-neutral)" />

    <!-- SALIDAS -->
    <path d="M 610 59 L 660 59" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#arr-accent)" />
    <g transform="translate(665, 40)">
      <rect width="205" height="38" rx="4" fill="#222226" stroke="#eb6c36" stroke-width="1.2" />
      <text x="12" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">BANDA LATERAL SUPERIOR (USB)</text>
      <text x="12" y="30" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5">f_shift = fs + fc (Cancelación inf.)</text>
    </g>

    <path d="M 610 174 L 660 174" stroke="#71717a" stroke-width="1.8" marker-end="url(#arr-neutral)" />
    <g transform="translate(665, 155)">
      <rect width="205" height="38" rx="4" fill="#222226" stroke="#52525b" stroke-width="1.2" />
      <text x="12" y="16" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">BANDA LATERAL INFERIOR (LSB)</text>
      <text x="12" y="30" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5">f_shift = |fc - fs| (Cancelación sup.)</text>
    </g>

    <!-- EXPLICACIÓN INFERIOR -->
    <g transform="translate(20, 215)">
      <text x="0" y="15" fill="#a1a1aa" font-size="8.5">Interferencia destructiva trigonométrica: <tspan fill="#f4f4f5" font-family="ui-monospace, monospace">cos(A)cos(B) - sin(A)sin(B) = cos(A+B)</tspan></text>
      <text x="510" y="15" fill="#eb6c36" font-size="8.5" font-weight="600">Desplaza armónicos aditivamente sin alterar el espaciado espectral</text>
    </g>
  </g>
</svg>