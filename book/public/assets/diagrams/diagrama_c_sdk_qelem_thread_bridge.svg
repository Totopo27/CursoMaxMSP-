<svg viewBox="0 0 940 280" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">ARQUITECTURA DE MULTI-THREADING · THREAD SAFETY EN CYCLING '74 SDK</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 6.3B · COMUNICACIÓN SEGURA AUDIO THREAD A GUI MEDIANTE T_QELEM</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <g transform="translate(25, 45)">
    <rect width="890" height="215" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />

    <!-- ETAPA 1: AUDIO THREAD (TIEMPO REAL ESTRICTO) -->
    <g transform="translate(25, 30)">
      <rect width="250" height="150" rx="5" fill="#141417" stroke="#3f3f46" stroke-width="1.2" />
      <rect width="250" height="22" rx="5" fill="#27272a" />
      <text x="12" y="15" fill="#ef4444" font-family="ui-monospace, monospace" font-size="8" font-weight="700">HILO DE AUDIO (TIEMPO REAL HARD)</text>

      <text x="12" y="44" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">perform64() Callback</text>
      <text x="12" y="62" fill="#a1a1aa" font-size="8.5">• Procesa bloques de 64 muestras</text>
      <text x="12" y="76" fill="#a1a1aa" font-size="8.5">• Detecta nivel pico: <tspan fill="#fca5a5">x-&gt;peak_value</tspan></text>

      <g transform="translate(12, 92)">
        <rect width="226" height="42" rx="4" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
        <text x="10" y="18" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9" font-weight="700">qelem_set(x-&gt;qelem_gui);</text>
        <text x="10" y="32" fill="#a7f3d0" font-size="8">Llamada atómica libre de lock (&lt;10 ns)</text>
      </g>
    </g>

    <!-- FLECHA PUENTE CENTRAL CON COLAPSO DE EVENTOS -->
    <path d="M 285 115 L 345 115" stroke="#eb6c36" stroke-width="2" marker-end="url(#arr-accent)" />

    <!-- ETAPA 2: SUBSISTEMA QELEM / DESPACHO DE COLAS -->
    <g transform="translate(350, 30)">
      <rect width="230" height="150" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
      <rect width="230" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)" />
      <text x="12" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">MECANISMO T_QELEM BRIDGE</text>

      <text x="12" y="48" fill="#fed7aa" font-weight="600" font-size="10">Event Coalescing (Colapso)</text>
      <text x="12" y="66" fill="#f4f4f5" font-size="8.5">Si perform64 llama 1000 veces/s,</text>
      <text x="12" y="80" fill="#f4f4f5" font-size="8.5">qelem descarta llamadas intermedias</text>
      <text x="12" y="94" fill="#f4f4f5" font-size="8.5">y sincroniza solo al ciclo del frame.</text>

      <g transform="translate(12, 110)">
        <rect width="206" height="28" rx="3" fill="#121318" stroke="#27272a" stroke-width="1" />
        <text x="10" y="18" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8">Aísla el Audio Thread de caídas</text>
      </g>
    </g>

    <!-- FLECHA HACIA MAIN THREAD -->
    <path d="M 590 115 L 650 115" stroke="#71717a" stroke-width="1.8" marker-end="url(#arr-neutral)" />

    <!-- ETAPA 3: EVENT LOOP DE MAX (MAIN / GUI THREAD) -->
    <g transform="translate(655, 30)">
      <rect width="210" height="150" rx="5" fill="#141417" stroke="#3f3f46" stroke-width="1.2" />
      <rect width="210" height="22" rx="5" fill="#27272a" />
      <text x="12" y="15" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="8" font-weight="700">MAIN THREAD (EVENT LOOP GUI)</text>

      <text x="12" y="44" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">qelem_callback(x)</text>
      <text x="12" y="62" fill="#a1a1aa" font-size="8.5">Se ejecuta en reposo del hilo GUI</text>

      <g transform="translate(12, 85)">
        <rect width="186" height="50" rx="4" fill="#222226" stroke="#52525b" stroke-width="1" />
        <text x="8" y="18" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="8.5">outlet_float(x-&gt;out, peak);</text>
        <text x="8" y="34" fill="#a1a1aa" font-size="8">Actualiza faders, sliders o [meter~]</text>
        <text x="8" y="44" fill="#22c55e" font-size="7.5">0 drops en audio · GUI fluida</text>
      </g>
    </g>
  </g>
</svg>