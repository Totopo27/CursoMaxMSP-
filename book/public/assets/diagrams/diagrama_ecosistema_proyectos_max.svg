<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#181922"/>
    </linearGradient>

    <linearGradient id="box-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1f2b"/>
      <stop offset="100%" stop-color="#161722"/>
    </linearGradient>

    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eb6c36"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="620" fill="url(#bg-grad)" rx="16"/>
  <rect x="1" y="1" width="1098" height="618" fill="none" stroke="#27272a" stroke-width="1.5" rx="15"/>

  <!-- Grid lines background pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1100" y2="100"/>
    <line x1="0" y1="200" x2="1100" y2="200"/>
    <line x1="0" y1="300" x2="1100" y2="300"/>
    <line x1="0" y1="400" x2="1100" y2="400"/>
    <line x1="0" y1="500" x2="1100" y2="500"/>
    <line x1="220" y1="0" x2="220" y2="620"/>
    <line x1="550" y1="0" x2="550" y2="620"/>
    <line x1="880" y1="0" x2="880" y2="620"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="168" height="24" rx="12" fill="#eb6c36" fill-opacity="0.15"/>
    <text x="14" y="16" fill="#eb6c36" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.2">TAXONOMÍA DE SISTEMAS</text>
    <text x="0" y="52" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="800">Ecosistema Creativo y Proyectos Paradigmáticos en Max/MSP</text>
    <text x="0" y="74" fill="#9ca3af" font-family="'Inter', system-ui, sans-serif" font-size="13">De la abstracción matemática de conservatorio al escenario mundial y la interacción física en tiempo real</text>
  </g>

  <!-- Core Hub in Center Bottom -->
  <g transform="translate(420, 270)">
    <circle cx="130" cy="80" r="68" fill="#14151f" stroke="#eb6c36" stroke-width="2.5" filter="url(#subtle-shadow)"/>
    <circle cx="130" cy="80" r="54" fill="none" stroke="#27272a" stroke-dasharray="4,4"/>
    <text x="130" y="73" fill="#eb6c36" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="middle">MAX ENGINE</text>
    <text x="130" y="91" fill="#9ca3af" font-family="'Inter', system-ui, sans-serif" font-size="10" text-anchor="middle">Núcleo C / C++</text>
    <text x="130" y="103" fill="#6b7280" font-family="'Inter', system-ui, sans-serif" font-size="9" text-anchor="middle">Dataflow &amp; Audio DSP</text>
  </g>

  <!-- Connecting Lines from Hub to 4 Pillars -->
  <g stroke-width="2" opacity="0.65">
    <!-- To Pillar 1 (Top Left) -->
    <path d="M 440 310 L 320 250" fill="none" stroke="#f59e0b" stroke-dasharray="6,4"/>
    <!-- To Pillar 2 (Bottom Left) -->
    <path d="M 440 380 L 320 440" fill="none" stroke="#38bdf8" stroke-dasharray="6,4"/>
    <!-- To Pillar 3 (Top Right) -->
    <path d="M 660 310 L 780 250" fill="none" stroke="#10b981" stroke-dasharray="6,4"/>
    <!-- To Pillar 4 (Bottom Right) -->
    <path d="M 660 380 L 780 440" fill="none" stroke="#a855f7" stroke-dasharray="6,4"/>
  </g>

  <!-- Pillar 1: Composición Algorítmica y Simbólica (Top Left) -->
  <g transform="translate(60, 150)" filter="url(#subtle-shadow)">
    <rect width="320" height="190" rx="12" fill="url(#box-grad-1)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="4" rx="2" fill="url(#orange-grad)"/>
    
    <text x="18" y="28" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">01. CAPA SIMBÓLICA &amp; ALGORÍTMICA</text>
    <text x="18" y="48" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700">Composición Estocástica y Reglas</text>
    
    <g transform="translate(18, 62)">
      <rect x="0" y="0" width="284" height="48" rx="6" fill="#12131a" stroke="#27272a"/>
      <text x="10" y="18" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">AMI · Francisco Colasanto</text>
      <text x="10" y="34" fill="#9ca3af" font-family="'Inter', system-ui, sans-serif" font-size="10">Matrices de Markov, dict/coll y datos simbólicos</text>
    </g>

    <g transform="translate(18, 118)">
      <rect x="0" y="0" width="284" height="48" rx="6" fill="#12131a" stroke="#27272a"/>
      <text x="10" y="18" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">The "System" · Autechre</text>
      <text x="10" y="34" fill="#9ca3af" font-family="'Inter', system-ui, sans-serif" font-size="10">Autómatas celulares y máquinas de estados vivas</text>
    </g>
  </g>

  <!-- Pillar 2: Ergonomía Gestual y Hardware (Bottom Left) -->
  <g transform="translate(60, 360)" filter="url(#subtle-shadow)">
    <rect width="320" height="190" rx="12" fill="url(#box-grad-1)" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="4" rx="2" fill="url(#cyan-grad)"/>
    
    <text x="18" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">02. CAPA GESTUAL &amp; ERGONOMÍA</text>
    <text x="18" y="48" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700">Grabación Continua e Interacción</text>
    
    <g transform="translate(18, 62)">
      <rect x="0" y="0" width="284" height="48" rx="6" fill="#12131a" stroke="#27272a"/>
      <text x="10" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">handwoven_max &amp; Bullion</text>
      <text x="10" y="34" fill="#9ca3af" font-family="'Inter', system-ui, sans-serif" font-size="10">param.osc · Grabación gestual multi-paramétrica</text>
    </g>

    <g transform="translate(18, 118)">
      <rect x="0" y="0" width="284" height="48" rx="6" fill="#12131a" stroke="#27272a"/>
      <text x="10" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">TMH Quicky · Tom Hall</text>
      <text x="10" y="34" fill="#9ca3af" font-family="'Inter', system-ui, sans-serif" font-size="10">Abstracciones de productividad y flujo sin fricción</text>
    </g>
  </g>

  <!-- Pillar 3: Machine Learning y DSP de Producción (Top Right) -->
  <g transform="translate(720, 150)" filter="url(#subtle-shadow)">
    <rect width="320" height="190" rx="12" fill="url(#box-grad-1)" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="4" rx="2" fill="url(#emerald-grad)"/>
    
    <text x="18" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">03. DSP DE PRODUCCIÓN &amp; ML</text>
    <text x="18" y="48" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700">Baja Latencia y Calidad de Estudio</text>
    
    <g transform="translate(18, 62)">
      <rect x="0" y="0" width="284" height="48" rx="6" fill="#12131a" stroke="#27272a"/>
      <text x="10" y="18" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Data-Knot · Rodrigo Constanzo</text>
      <text x="10" y="34" fill="#9ca3af" font-family="'Inter', system-ui, sans-serif" font-size="10">FluCoMa, descriptores tímbricos y ML ultra-rápido</text>
    </g>

    <g transform="translate(18, 118)">
      <rect x="0" y="0" width="284" height="48" rx="6" fill="#12131a" stroke="#27272a"/>
      <text x="10" y="18" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ABL Modules &amp; Gen~</text>
      <text x="10" y="34" fill="#9ca3af" font-family="'Inter', system-ui, sans-serif" font-size="10">Efectos Ableton Live nativos y gen~ de bajo nivel</text>
    </g>
  </g>

  <!-- Pillar 4: Gráficos Vectoriales y Sistemas En Vivo (Bottom Right) -->
  <g transform="translate(720, 360)" filter="url(#subtle-shadow)">
    <rect width="320" height="190" rx="12" fill="url(#box-grad-1)" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="4" rx="2" fill="url(#purple-grad)"/>
    
    <text x="18" y="28" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">04. SISTEMAS EN VIVO &amp; GRÁFICOS</text>
    <text x="18" y="48" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700">Alta Disponibilidad e Interfaces JSUI</text>
    
    <g transform="translate(18, 62)">
      <rect x="0" y="0" width="284" height="48" rx="6" fill="#12131a" stroke="#27272a"/>
      <text x="10" y="18" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">JSUI mgraphics &amp; Jitter Recipes</text>
      <text x="10" y="34" fill="#9ca3af" font-family="'Inter', system-ui, sans-serif" font-size="10">Andrew Benson: matrices visuales y renderizado 2D/3D</text>
    </g>

    <g transform="translate(18, 118)">
      <rect x="0" y="0" width="284" height="48" rx="6" fill="#12131a" stroke="#27272a"/>
      <text x="10" y="18" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Radiohead &amp; Robert Henke</text>
      <text x="10" y="34" fill="#9ca3af" font-family="'Inter', system-ui, sans-serif" font-size="10">Jonny Greenwood (Idioteque) y Granulator / Monolake</text>
    </g>
  </g>

  <!-- Bottom Metadata Footer -->
  <g transform="translate(60, 580)">
    <text x="0" y="0" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10">CURSO UNIVERSITARIO DE MAX/MSP · APÉNDICE G: ECOSISTEMA CREATIVO Y CASOS DE ESTUDIO</text>
    <text x="980" y="0" fill="#4b5563" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">FIG G.1</text>
  </g>
</svg>
