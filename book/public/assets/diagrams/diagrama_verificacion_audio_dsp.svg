<svg viewBox="0 0 940 240" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-dsp" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">CIRCUITO ELEMENTAL DE PRUEBA DSP · GENERACIÓN Y SALIDA ESTÉREO</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 0.11 · CADENA DE VERIFICACIÓN DEL MOTOR DE AUDIO</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- CONTENEDOR CENTRAL DEL GRAFO MSP -->
  <g transform="translate(120, 45)">
    <!-- ETAPA 1: GENERADOR SINE WAVE [cycle~ 440] -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="4" fill="#222226" stroke="#52525b" stroke-width="1.3"/>
      <circle cx="20" cy="0" r="3" fill="#a1a1aa"/>
      <circle cx="190" cy="0" r="3" fill="#71717a"/>
      <circle cx="20" cy="42" r="3" fill="#f59e0b"/>
      <circle cx="190" cy="42" r="3" fill="#f59e0b"/>
      <text x="105" y="25" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">cycle~ 440</text>
    </g>
    <!-- Card explicativa -->
    <rect x="230" y="4" width="460" height="34" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="242" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">OSCILADOR SINUSOIDAL PURO (WAVETABLE 512 MUESTRAS)</text>
    <text x="242" y="31" fill="#a1a1aa" font-size="8">Genera f0 = 440.0 Hz en coma flotante nativa (Audio Thread, rango bipolar [-1.0, +1.0]).</text>

    <!-- Cable Señal DSP 1 -->
    <line x1="20" y1="42" x2="20" y2="78" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="42" x2="20" y2="78" stroke="#121318" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ETAPA 2: ATENUADOR MASTER [*~ 0.2] -->
    <g transform="translate(0, 78)">
      <rect width="210" height="42" rx="4" fill="#1c1613" stroke="#eb6c36" stroke-width="1.4"/>
      <circle cx="20" cy="0" r="3" fill="#f59e0b"/>
      <circle cx="190" cy="0" r="3" fill="#f59e0b"/>
      <circle cx="20" cy="42" r="3" fill="#f59e0b"/>
      <text x="105" y="25" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">*~ 0.2</text>
    </g>
    <!-- Card explicativa -->
    <rect x="230" y="82" width="460" height="34" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="242" y="98" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">FACTOR DE ESCALAMIENTO Y PROTECCIÓN (-14 dB)</text>
    <text x="242" y="109" fill="#fed7aa" font-size="8">Atenúa la amplitud a 0.2 pico para evitar recorte (clipping digital 0 dBFS) en los altavoces.</text>

    <!-- Bifurcación Estéreo Cables Señal DSP -->
    <!-- Canal L -->
    <line x1="20" y1="120" x2="20" y2="150" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="120" x2="20" y2="150" stroke="#121318" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- Canal R (Bifurcación Ortogonal) -->
    <path d="M 20 128 L 190 128 L 190 150" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 20 128 L 190 128 L 190 150" fill="none" stroke="#121318" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ETAPA 3: CONVERSOR DAC ESTÉREO [ezdac~] -->
    <g transform="translate(0, 150)">
      <rect width="210" height="42" rx="4" fill="#222226" stroke="#38bdf8" stroke-width="1.4"/>
      <circle cx="20" cy="0" r="3" fill="#f59e0b"/>
      <circle cx="190" cy="0" r="3" fill="#f59e0b"/>
      <text x="105" y="25" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">ezdac~ (Audio On/Off)</text>
    </g>
    <!-- Card explicativa -->
    <rect x="230" y="154" width="460" height="34" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="242" y="170" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">CONVERSOR DIGITAL-ANALÓGICO (INTERFAZ HARDWARE)</text>
    <text x="242" y="181" fill="#a1a1aa" font-size="8">Inlets L y R: Despacha vectores de 64 muestras directamente al buffer I/O de la placa de audio.</text>
  </g>
</svg>