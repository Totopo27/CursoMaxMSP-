<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">SÍNTESIS POR MODULACIÓN DE FRECUENCIA · JOHN CHOWNING (STANFORD)</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 3.4 · RELACIONES ARMÓNICAS (RATIO C:M) Y ESTRUCTURA TÍMBRICA</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- CONTENEDOR 4 TARJETAS -->
  <!-- TARJETA 1: RELACIÓN 1:1 (SERIE COMPLETA) - FOCAL ACCENT -->
  <g transform="translate(25, 45)">
    <rect width="210" height="260" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="210" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="17" width="210" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="10" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">1. RELACIÓN 1 : 1</text>
    <text x="10" y="42" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">Carrier = Modulator</text>
    <text x="10" y="58" fill="#fed7aa" font-size="9">Ej: 440 Hz : 440 Hz</text>

    <!-- ESPECTRO GRÁFICO (SERIE COMPLETA) -->
    <g transform="translate(10, 75)">
      <rect width="190" height="95" rx="3" fill="#2a1b14" stroke="#eb6c36" stroke-width="1" />
      <line x1="15" y1="80" x2="175" y2="80" stroke="#71717a" stroke-width="1" />
      <!-- Lineas 1, 2, 3, 4 -->
      <line x1="30" y1="80" x2="30" y2="22" stroke="#eb6c36" stroke-width="2" />
      <line x1="65" y1="80" x2="65" y2="35" stroke="#eb6c36" stroke-width="2" />
      <line x1="100" y1="80" x2="100" y2="48" stroke="#eb6c36" stroke-width="2" />
      <line x1="135" y1="80" x2="135" y2="60" stroke="#eb6c36" stroke-width="2" />
      <line x1="165" y1="80" x2="165" y2="70" stroke="#eb6c36" stroke-width="2" />
      <text x="30" y="92" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="7.5" text-anchor="middle">f0</text>
      <text x="65" y="92" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="7.5" text-anchor="middle">2f0</text>
      <text x="100" y="92" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="7.5" text-anchor="middle">3f0</text>
      <text x="135" y="92" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="7.5" text-anchor="middle">4f0</text>
    </g>

    <text x="10" y="190" fill="#f4f4f5" font-size="9" font-weight="600">Serie Armónica Completa:</text>
    <text x="10" y="206" fill="#fed7aa" font-size="8.5">• Parciales: 440, 880, 1320, 1760 Hz.</text>
    <text x="10" y="222" fill="#fed7aa" font-size="8.5">• Espectro denso similar a diente de sierra.</text>
    <text x="10" y="242" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="7.5">Timbre: Metales brillantes, cuerdas</text>
  </g>

  <!-- TARJETA 2: RELACIÓN 1:2 (SOLO IMPARES) -->
  <g transform="translate(250, 45)">
    <rect width="210" height="260" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="210" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="210" height="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">2. RELACIÓN 1 : 2</text>
    <text x="10" y="42" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">Modulator Doble Freq</text>
    <text x="10" y="58" fill="#a1a1aa" font-size="9">Ej: 440 Hz : 880 Hz</text>

    <!-- ESPECTRO GRÁFICO (SOLO IMPARES) -->
    <g transform="translate(10, 75)">
      <rect width="190" height="95" rx="3" fill="#141417" stroke="#27272a" stroke-width="1" />
      <line x1="15" y1="80" x2="175" y2="80" stroke="#3f3f46" stroke-width="1" />
      <!-- Lineas 1, 3, 5, 7 -->
      <line x1="30" y1="80" x2="30" y2="22" stroke="#38bdf8" stroke-width="2" />
      <line x1="75" y1="80" x2="75" y2="42" stroke="#38bdf8" stroke-width="2" />
      <line x1="120" y1="80" x2="120" y2="58" stroke="#38bdf8" stroke-width="2" />
      <line x1="165" y1="80" x2="165" y2="70" stroke="#38bdf8" stroke-width="2" />
      <text x="30" y="92" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="7.5" text-anchor="middle">f0</text>
      <text x="75" y="92" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="7.5" text-anchor="middle">3f0</text>
      <text x="120" y="92" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="7.5" text-anchor="middle">5f0</text>
      <text x="165" y="92" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="7.5" text-anchor="middle">7f0</text>
    </g>

    <text x="10" y="190" fill="#e4e4e7" font-size="9" font-weight="600">Solo Armónicos Impares:</text>
    <text x="10" y="206" fill="#a1a1aa" font-size="8.5">• Parciales: 440, 1320, 2200, 3080 Hz.</text>
    <text x="10" y="222" fill="#a1a1aa" font-size="8.5">• Omite armónicos pares automáticamente.</text>
    <text x="10" y="242" fill="#71717a" font-family="ui-monospace, monospace" font-size="7.5">Timbre: Clarinete, maderas huecas, flauta</text>
  </g>

  <!-- TARJETA 3: FRACCIONARIAS (FORMANTES Y SUB-ARMONICOS) -->
  <g transform="translate(475, 45)">
    <rect width="210" height="260" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="210" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="210" height="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">3. FRACCIONARIAS</text>
    <text x="10" y="42" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">Ratios 1 : 3.5 / 2 : 3</text>
    <text x="10" y="58" fill="#a1a1aa" font-size="9">Cocientes racionales n/m</text>

    <!-- ESPECTRO GRÁFICO (FORMANTES) -->
    <g transform="translate(10, 75)">
      <rect width="190" height="95" rx="3" fill="#141417" stroke="#27272a" stroke-width="1" />
      <line x1="15" y1="80" x2="175" y2="80" stroke="#3f3f46" stroke-width="1" />
      <!-- Lineas espaciadas fraccionarias -->
      <line x1="25" y1="80" x2="25" y2="45" stroke="#a78bfa" stroke-width="1.8" />
      <line x1="50" y1="80" x2="50" y2="30" stroke="#a78bfa" stroke-width="1.8" />
      <line x1="85" y1="80" x2="85" y2="20" stroke="#a78bfa" stroke-width="2.2" />
      <line x1="120" y1="80" x2="120" y2="38" stroke="#a78bfa" stroke-width="1.8" />
      <line x1="155" y1="80" x2="155" y2="55" stroke="#a78bfa" stroke-width="1.8" />
      <text x="85" y="92" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="7.5" text-anchor="middle">Pico Formante</text>
    </g>

    <text x="10" y="190" fill="#e4e4e7" font-size="9" font-weight="600">Sub-armónicos y Formantes:</text>
    <text x="10" y="206" fill="#a1a1aa" font-size="8.5">• Fundamental percibida en MCD(fc, fm).</text>
    <text x="10" y="222" fill="#a1a1aa" font-size="8.5">• Regiones de resonancia tímbrica vocal.</text>
    <text x="10" y="242" fill="#71717a" font-family="ui-monospace, monospace" font-size="7.5">Timbre: Vocales corales humanas, fagot</text>
  </g>

  <!-- TARJETA 4: IRRACIONALES (CAMPANAS Y GONGS) -->
  <g transform="translate(700, 45)">
    <rect width="215" height="260" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="215" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="215" height="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">4. IRRACIONALES</text>
    <text x="10" y="42" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">Ratios sqrt(2) / pi / e</text>
    <text x="10" y="58" fill="#a1a1aa" font-size="9">Ej: 1 : 1.414 / 1 : 2.718</text>

    <!-- ESPECTRO GRÁFICO (INARMÓNICO DISPERSO) -->
    <g transform="translate(10, 75)">
      <rect width="195" height="95" rx="3" fill="#141417" stroke="#27272a" stroke-width="1" />
      <line x1="15" y1="80" x2="180" y2="80" stroke="#3f3f46" stroke-width="1" />
      <!-- Lineas dispersas -->
      <line x1="28" y1="80" x2="28" y2="35" stroke="#f59e0b" stroke-width="1.8" />
      <line x1="62" y1="80" x2="62" y2="25" stroke="#f59e0b" stroke-width="1.8" />
      <line x1="91" y1="80" x2="91" y2="50" stroke="#f59e0b" stroke-width="1.8" />
      <line x1="133" y1="80" x2="133" y2="30" stroke="#f59e0b" stroke-width="1.8" />
      <line x1="168" y1="80" x2="168" y2="40" stroke="#f59e0b" stroke-width="1.8" />
      <text x="97" y="92" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="7.5" text-anchor="middle">Parciales No Múltiplos</text>
    </g>

    <text x="10" y="190" fill="#e4e4e7" font-size="9" font-weight="600">Inarmonicidad Total:</text>
    <text x="10" y="206" fill="#a1a1aa" font-size="8.5">• Parciales sin razón de números enteros.</text>
    <text x="10" y="222" fill="#a1a1aa" font-size="8.5">• Ausencia de fundamental fija definida.</text>
    <text x="10" y="242" fill="#71717a" font-family="ui-monospace, monospace" font-size="7.5">Uso: Campanas tubulares, gongs, platillos</text>
  </g>
</svg>
