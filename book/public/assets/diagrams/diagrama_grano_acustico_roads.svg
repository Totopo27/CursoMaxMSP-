<svg viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">SÍNTESIS GRANULAR · CURTIS ROADS (MICROSONIC MUSIC)</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 3.9B · ANATOMÍA DEL GRANO ACÚSTICO &amp; VENTANA TEMPORAL</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <g transform="translate(25, 45)">
    <rect width="890" height="245" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />

    <!-- DIAGRAMA VISUAL DEL GRANO -->
    <!-- Eje X temporal y Eje Y de amplitud -->
    <g transform="translate(45, 20)">
      <!-- Regla superior de duración Δt -->
      <line x1="120" y1="20" x2="520" y2="20" stroke="#eb6c36" stroke-width="1.5" />
      <line x1="120" y1="14" x2="120" y2="26" stroke="#eb6c36" stroke-width="1.5" />
      <line x1="520" y1="14" x2="520" y2="26" stroke="#eb6c36" stroke-width="1.5" />
      <text x="320" y="14" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">DURACIÓN DEL GRANO (Δt ≈ 10 a 50 ms)</text>

      <!-- Eje Y -->
      <line x1="80" y1="40" x2="80" y2="170" stroke="#3f3f46" stroke-width="1.2" />
      <text x="70" y="44" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="end">1.0</text>
      <text x="70" y="105" fill="#71717a" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="end">0.5</text>
      <text x="70" y="170" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="end">0.0</text>

      <!-- Eje X (Línea base) -->
      <line x1="80" y1="170" x2="560" y2="170" stroke="#3f3f46" stroke-width="1.2" />

      <!-- Curva de Ventana Hanning / Gauss (Superpuesta) -->
      <path d="M 120 170 C 180 170, 220 40, 320 40 C 420 40, 460 170, 520 170" fill="rgba(235, 108, 54, 0.12)" stroke="#eb6c36" stroke-width="2.5" />
      <text x="320" y="60" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="middle">VENTANA HANNING / GAUSS w(t)</text>

      <!-- Forma de Onda de Audio Interna (Multiplicada) -->
      <path d="M 120 170 
               Q 140 165, 150 155 Q 160 145, 170 160 Q 180 175, 190 140
               Q 200 105, 215 150 Q 230 195, 245 110 Q 260 25, 275 140
               Q 290 255, 305 70 Q 320 -15, 335 150 Q 350 315, 365 90
               Q 380 -50, 395 140 Q 410 230, 425 120 Q 440 30, 455 155
               Q 470 180, 485 160 Q 500 140, 520 170" 
            fill="none" stroke="#67e8f9" stroke-width="1.5" opacity="0.85" />
      <text x="320" y="115" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">AUDIO INTERNO (buffer~)</text>
    </g>

    <!-- PANEL DERECHO: PARÁMETROS CRÍTICOS Y TOPOLOGÍA MAX -->
    <g transform="translate(615, 25)">
      <rect width="250" height="200" rx="5" fill="#141417" stroke="#27272a" stroke-width="1" />
      <text x="14" y="22" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9" font-weight="700">PARÁMETROS DEL MICRO-SONIDO</text>
      
      <g transform="translate(14, 38)">
        <text x="0" y="14" fill="#f4f4f5" font-weight="600" font-size="9">1. Duración (Δt):</text>
        <text x="0" y="27" fill="#a1a1aa" font-size="8">&lt; 10 ms = Click · &gt; 100 ms = Nota/Palabra</text>

        <text x="0" y="52" fill="#f4f4f5" font-weight="600" font-size="9">2. Envolvente Anti-click:</text>
        <text x="0" y="65" fill="#a1a1aa" font-size="8">Lectura con [wave~ mi_ventana] a cero</text>

        <text x="0" y="90" fill="#f4f4f5" font-weight="600" font-size="9">3. Puntero RAM (Buffer Offset):</text>
        <text x="0" y="103" fill="#a1a1aa" font-size="8">Time-stretching infinito sin alterar pitch</text>

        <text x="0" y="128" fill="#f4f4f5" font-weight="600" font-size="9">4. Tasa de Reproducción (Rate):</text>
        <text x="0" y="141" fill="#a1a1aa" font-size="8">Transposición tonal independiente</text>
      </g>
    </g>
  </g>
</svg>