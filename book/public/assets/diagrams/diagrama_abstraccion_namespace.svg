<svg viewBox="0 0 940 320" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">MODULARIZACIÓN Y ENCAPSULACIÓN · MAX/MSP</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 4.0 · SUBPARCHE [P] VS. ABSTRACCIÓN Y NAMESPACE #0</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- NODO SUPERIOR: PATCH PRINCIPAL -->
  <g transform="translate(370, 42)">
    <rect width="200" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="100" y="24" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">[ Patch Principal ]</text>
  </g>

  <!-- CONNECTORS FROM ROOT TO 2 BRANCHES -->
  <path d="M 420 84 L 420 115 L 240 115 L 240 135" stroke="#71717a" stroke-width="1.3" fill="none" marker-end="url(#arr-neutral)" />
  <path d="M 520 84 L 520 115 L 700 115 L 700 135" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arr-accent)" />

  <!-- RAMA IZQUIERDA: SUBPARCHE [P] (EMBEBIDO) -->
  <g transform="translate(25, 135)">
    <rect width="430" height="165" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="430" height="24" rx="6" fill="#27272a" />
    <rect y="19" width="430" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">SUBPARCHE LOCAL: [P SUBMODULO]</text>

    <!-- BOX INFO -->
    <g transform="translate(16, 36)">
      <text x="0" y="16" fill="#f4f4f5" font-size="11" font-weight="600">Encapsulación Visual Embebida</text>
      <text x="0" y="34" fill="#a1a1aa" font-size="9">• Archivo: Contenido dentro del mismo JSON del patcher padre.</text>
      <text x="0" y="50" fill="#a1a1aa" font-size="9">• No es reutilizable dinámicamente: Copiar/pegar duplica código.</text>
      <text x="0" y="66" fill="#a1a1aa" font-size="9">• No soporta argumentos posicionales #1, #2.</text>
    </g>

    <g transform="translate(16, 115)">
      <rect width="398" height="34" rx="4" fill="#141417" stroke="#27272a" stroke-width="1" />
      <text x="10" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">ESPACIO DE NOMBRES (#0)</text>
      <text x="10" y="27" fill="#71717a" font-size="8">Comparte el mismo ID #0 del padre: Posible colisión de sends/receives</text>
    </g>
  </g>

  <!-- RAMA DERECHA: ABSTRACCIÓN REUTILIZABLE (FOCAL ACCENT) -->
  <g transform="translate(485, 135)">
    <rect width="430" height="165" rx="6" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="430" height="24" rx="6" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="19" width="430" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="12" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">ABSTRACCIÓN MODULAR: [MI_ABSTRACCION 440.]</text>

    <!-- BOX INFO -->
    <g transform="translate(16, 36)">
      <text x="0" y="16" fill="#f4f4f5" font-size="11" font-weight="600">Instancia Modular por Referencia</text>
      <text x="0" y="34" fill="#fed7aa" font-size="9">• Archivo: Archivo .maxpat externo independiente en disco.</text>
      <text x="0" y="50" fill="#a1a1aa" font-size="9">• Modificar el archivo en disco actualiza TODAS las instancias vivas.</text>
      <text x="0" y="66" fill="#a1a1aa" font-size="9">• Sustitución léxica de argumentos: #1 = 440., #2, etc.</text>
    </g>

    <g transform="translate(16, 115)">
      <rect width="398" height="34" rx="4" fill="#2a1b14" stroke="#eb6c36" stroke-width="1" />
      <text x="10" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">AISLAMIENTO TOTAL DE NAMESPACE (#0)</text>
      <text x="10" y="27" fill="#fed7aa" font-size="8">Genera un UID único irrepetible (ej: #0 = 1042): Enrutamiento privado inmune</text>
    </g>
  </g>
</svg>
