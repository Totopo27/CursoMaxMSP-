<svg viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">TAXONOMÍA DE DOCUMENTOS Y ENCAPSULACIÓN</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 0.4 · NIVELES DE MODULARIZACIÓN</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- NODO 1: PATCHER RAÍZ (.maxpat) -->
  <g transform="translate(25, 45)">
    <rect width="205" height="115" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="205" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="205" height="5" fill="#27272a" />
    <text x="12" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">01 · DOCUMENTO BASE</text>
    <text x="12" y="44" fill="#f4f4f5" font-size="12" font-weight="600">Patcher Raíz</text>
    <text x="12" y="62" fill="#71717a" font-family="ui-monospace, monospace" font-size="8.5">formato: .maxpat (JSON)</text>
    <text x="12" y="80" fill="#a1a1aa" font-size="9.5">Topología de cajas y cables</text>
    <text x="12" y="96" fill="#71717a" font-size="9">Unidad fundamental en disco</text>
  </g>

  <!-- NODO 2: SUBPATCHER [p] -->
  <g transform="translate(255, 45)">
    <rect width="205" height="115" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="205" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="205" height="5" fill="#27272a" />
    <text x="12" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">02 · ENCAPSULACIÓN INTERNA</text>
    <text x="12" y="44" fill="#f4f4f5" font-size="12" font-weight="600">Subpatcher</text>
    <text x="12" y="62" fill="#71717a" font-family="ui-monospace, monospace" font-size="8.5">objeto: [p nombre]</text>
    <text x="12" y="80" fill="#a1a1aa" font-size="9.5">Higiene visual en el lienzo</text>
    <text x="12" y="96" fill="#71717a" font-size="9">Incrustado en el archivo padre</text>
  </g>

  <!-- NODO 3: ABSTRACCIÓN (FOCAL ACENTO) -->
  <g transform="translate(485, 45)">
    <rect width="205" height="115" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="205" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="17" width="205" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="12" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">03 · MÓDULO REUTILIZABLE</text>
    <text x="12" y="44" fill="#f4f4f5" font-size="12" font-weight="600">Abstracción</text>
    <text x="12" y="62" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5">archivo independiente en disco</text>
    <text x="12" y="80" fill="#fed7aa" font-size="9.5">Argumentos (#1) y scope (#0)</text>
    <text x="12" y="96" fill="#fed7aa" font-size="9">Multi-instanciación desacoplada</text>
  </g>

  <!-- NODO 4: PROYECTO (.maxproj) -->
  <g transform="translate(715, 45)">
    <rect width="200" height="115" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="200" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="200" height="5" fill="#27272a" />
    <text x="12" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">04 · SISTEMA INTEGRADO</text>
    <text x="12" y="44" fill="#f4f4f5" font-size="12" font-weight="600">Proyecto</text>
    <text x="12" y="62" fill="#71717a" font-family="ui-monospace, monospace" font-size="8.5">formato: .maxproj</text>
    <text x="12" y="80" fill="#a1a1aa" font-size="9.5">Search paths consolidados</text>
    <text x="12" y="96" fill="#71717a" font-size="9">Exportación a Standalone (.exe)</text>
  </g>

  <!-- NODO 5: PACKAGE CANÓNICO (BASE INFERIOR ANCHA) -->
  <g transform="translate(140, 195)">
    <rect width="660" height="90" rx="5" fill="#16171d" stroke="#52525b" stroke-width="1.2" />
    <rect width="660" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="660" height="5" fill="#27272a" />
    <text x="16" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">05 · DISTRIBUCIÓN CANÓNICA GLOBAL (PACKAGE)</text>
    <text x="16" y="44" fill="#f4f4f5" font-size="12" font-weight="600">Ecosistema de Packages (/Max 8/Packages/)</text>
    <text x="16" y="62" fill="#a1a1aa" font-size="9.5">Estructura canónica de carpetas: docs/ · externals/ · help/ · init/ · media/ · patchers/</text>
    <text x="16" y="78" fill="#71717a" font-family="ui-monospace, monospace" font-size="8.5">Instalación y versionado en 1 clic mediante Package Manager oficial</text>
    <rect x="535" y="32" width="105" height="20" rx="3" fill="#27272a" stroke="#eb6c36" stroke-width="0.8" />
    <text x="587" y="45" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">Package Manager</text>
  </g>

  <!-- LÍNEAS DE CONEXIÓN ORTOGONALES -->
  <path d="M 127 160 L 127 175 L 470 175 L 470 195" fill="none" stroke="#71717a" stroke-width="1" />
  <path d="M 357 160 L 357 175" fill="none" stroke="#71717a" stroke-width="1" />
  <path d="M 587 160 L 587 175" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />
  <path d="M 815 160 L 815 175 L 470 175" fill="none" stroke="#71717a" stroke-width="1" />
</svg>
