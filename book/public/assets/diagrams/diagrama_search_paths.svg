<svg viewBox="0 0 940 370" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-success" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arr-error" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">ÁRBOL DE RESOLUCIÓN DE RUTAS DE BÚSQUEDA</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 0.5 · SEARCH PATHS PRECEDENCE</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- INICIO: SOLICITUD DE OBJETO O ARCHIVO -->
  <g transform="translate(30, 48)">
    <rect width="250" height="42" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1" />
    <text x="12" y="19" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8">SOLICITUD DE CARGA</text>
    <text x="12" y="32" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">[mi_objeto] / buffer~ drum.wav</text>
  </g>

  <!-- CONECTOR INICIAL -->
  <path d="M 280 69 L 330 69" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-neutral)" />

  <!-- NIVELES DE BÚSQUEDA JERÁRQUICA (CASCADA) -->
  <!-- Nivel 1: Carpeta local -->
  <g transform="translate(330, 48)">
    <rect width="320" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="14" y="18" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8">NIVEL 01 · PRIORIDAD MÁXIMA</text>
    <text x="14" y="32" fill="#f4f4f5" font-size="10.5" font-weight="600">1. ¿Está en la carpeta local del Patcher?</text>
  </g>

  <!-- Nivel 2: Proyecto .maxproj -->
  <g transform="translate(330, 110)">
    <rect width="320" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="14" y="18" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8">NIVEL 02 · PROYECTO ACTIVO</text>
    <text x="14" y="32" fill="#f4f4f5" font-size="10.5" font-weight="600">2. ¿Está en subcarpetas de .maxproj?</text>
  </g>

  <!-- Nivel 3: Documents/Max/Library -->
  <g transform="translate(330, 172)">
    <rect width="320" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="14" y="18" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8">NIVEL 03 · LIBRERÍA DE USUARIO</text>
    <text x="14" y="32" fill="#f4f4f5" font-size="10.5" font-weight="600">3. ¿Está en /Max 8/Library/?</text>
  </g>

  <!-- Nivel 4: Documents/Max/Packages -->
  <g transform="translate(330, 234)">
    <rect width="320" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="14" y="18" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8">NIVEL 04 · PACKAGES INSTALADOS</text>
    <text x="14" y="32" fill="#f4f4f5" font-size="10.5" font-weight="600">4. ¿Está en /Max 8/Packages/?</text>
  </g>

  <!-- Nivel 5: File Preferences personalizadas -->
  <g transform="translate(330, 296)">
    <rect width="320" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="14" y="18" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8">NIVEL 05 · RUTAS MANUALES</text>
    <text x="14" y="32" fill="#f4f4f5" font-size="10.5" font-weight="600">5. ¿Ruta en Options > File Preferences?</text>
  </g>

  <!-- CONECTORES VERTICALES "NO" ENTRE NIVELES -->
  <path d="M 490 90 L 490 110" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-neutral)" />
  <path d="M 490 152 L 490 172" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-neutral)" />
  <path d="M 490 214 L 490 234" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-neutral)" />
  <path d="M 490 276 L 490 296" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-neutral)" />

  <!-- ÉXITO: CARGA INMEDIATA (RAMA DERECHA VERDE) -->
  <g transform="translate(730, 145)">
    <rect width="180" height="60" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
    <text x="16" y="24" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">RESOLUCIÓN EXITOSA</text>
    <text x="16" y="44" fill="#f4f4f5" font-size="11" font-weight="600">Carga en Memoria</text>
  </g>

  <!-- LÍNEAS "SÍ" HACIA ÉXITO -->
  <path d="M 650 69 L 710 69 L 710 175 L 730 175" fill="none" stroke="#10b981" stroke-width="1.2" marker-end="url(#arr-success)" />
  <path d="M 650 131 L 710 131" fill="none" stroke="#10b981" stroke-width="1.2" />
  <path d="M 650 193 L 730 193" fill="none" stroke="#10b981" stroke-width="1.2" />
  <path d="M 650 255 L 710 255 L 710 175" fill="none" stroke="#10b981" stroke-width="1.2" />
  <path d="M 650 317 L 710 317 L 710 175" fill="none" stroke="#10b981" stroke-width="1.2" />

  <!-- FALLO: ERROR FATAL (RAMA INFERIOR ROJA) -->
  <g transform="translate(30, 296)">
    <rect width="250" height="42" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1.2" />
    <text x="12" y="18" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="8">EXCEPCIÓN CRÍTICA</text>
    <text x="12" y="32" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" font-weight="600">Error: 'no such object'</text>
  </g>
  <!-- CONECTOR DESDE NIVEL 5 HACIA ERROR -->
  <path d="M 330 317 L 280 317" fill="none" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-error)" />
  <text x="305" y="311" fill="#ef4444" font-family="ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">NO</text>
</svg>
