<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">DEEP LEARNING EN EL AUDIO THREAD · IRCAM Y LIBTORCH</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG E.2 · ARQUITECTURA DE AUTOENCODER VARIACIONAL (RAVE / NN~)</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- CONTENEDOR PRINCIPAL NN~ -->
  <g transform="translate(25, 45)">
    <rect width="890" height="260" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="890" height="24" rx="6" fill="#27272a" />
    <rect y="19" width="890" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">MOTOR DE INFERENCIA EN TIEMPO REAL: OBJETO [NN~ MODELO.TS] (LIBTORCH C++ BACKEND)</text>

    <!-- ENTRADA DE AUDIO EN TIEMPO REAL -->
    <g transform="translate(20, 50)">
      <rect width="180" height="60" rx="4" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="10" y="18" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">AUDIO INPUT (48 KHZ)</text>
      <text x="10" y="34" fill="#f4f4f5" font-size="10" font-weight="600">Mic / Guitarra / Voz</text>
      <text x="10" y="48" fill="#71717a" font-size="8">perform64() vector</text>
    </g>

    <!-- CONECTOR A ENCODER -->
    <path d="M 200 80 L 240 80" stroke="#38bdf8" stroke-width="1.4" fill="none" marker-end="url(#arr-neutral)" />

    <!-- ENCODER: RED CONVOLUCIONAL -->
    <g transform="translate(245, 42)">
      <rect width="185" height="150" rx="5" fill="#141417" stroke="#3f3f46" stroke-width="1.2" />
      <text x="10" y="18" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">1. ENCODER NEURONAL</text>
      <text x="10" y="38" fill="#f4f4f5" font-size="10.5" font-weight="600">Compresión Multiescala</text>
      <text x="10" y="56" fill="#a1a1aa" font-size="8.5">• Capas convolucionales 1D.</text>
      <text x="10" y="72" fill="#a1a1aa" font-size="8.5">• Normalización por bandas.</text>
      <text x="10" y="88" fill="#a1a1aa" font-size="8.5">• Proyección a espacio latente.</text>
      <text x="10" y="112" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8">Latencia interna: &lt; 5 ms</text>
      <text x="10" y="128" fill="#71717a" font-size="8">Factor compresión: ~2000x</text>
    </g>

    <!-- CONECTOR A ESPACIO LATENTE -->
    <path d="M 430 117 L 460 117" stroke="#eb6c36" stroke-width="1.5" fill="none" marker-end="url(#arr-accent)" />

    <!-- ESPACIO LATENTE (Z-VECTOR) - FOCAL ACCENT -->
    <g transform="translate(465, 42)">
      <rect width="165" height="150" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
      <rect width="165" height="20" rx="5" fill="rgba(235, 108, 54, 0.18)" />
      <rect y="15" width="165" height="5" fill="rgba(235, 108, 54, 0.18)" />
      <text x="10" y="14" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">ESPACIO LATENTE (Z)</text>

      <text x="10" y="38" fill="#f4f4f5" font-size="10.5" font-weight="600">Vector z (16 Dims)</text>
      <text x="10" y="56" fill="#fed7aa" font-size="8.5">• z1, z2, ..., z16.</text>
      <text x="10" y="72" fill="#fed7aa" font-size="8.5">• Modulación en Max.</text>
      <text x="10" y="88" fill="#fed7aa" font-size="8.5">• Operaciones con sliders.</text>
      <text x="10" y="112" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8">Intervención algorítmica</text>
      <text x="10" y="128" fill="#fed7aa" font-size="8">Morphing latente</text>
    </g>

    <!-- CONECTOR A DECODER -->
    <path d="M 630 117 L 660 117" stroke="#eb6c36" stroke-width="1.5" fill="none" marker-end="url(#arr-accent)" />

    <!-- DECODER: RESÍNTESIS NEURONAL -->
    <g transform="translate(665, 42)">
      <rect width="205" height="150" rx="5" fill="#141417" stroke="#3f3f46" stroke-width="1.2" />
      <text x="10" y="18" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">2. DECODER NEURONAL</text>
      <text x="10" y="38" fill="#f4f4f5" font-size="10.5" font-weight="600">Resíntesis Generativa</text>
      <text x="10" y="56" fill="#a1a1aa" font-size="8.5">• Convolución transpuesta.</text>
      <text x="10" y="72" fill="#a1a1aa" font-size="8.5">• Reconstrucción acústica.</text>
      <text x="10" y="88" fill="#a1a1aa" font-size="8.5">• Transferencia tímbrica.</text>
      <text x="10" y="112" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8">Audio OUT: Salida analógica</text>
      <text x="10" y="128" fill="#71717a" font-size="8">Timbre híbrido generado</text>
    </g>

    <!-- FOOTER RESUMEN -->
    <g transform="translate(20, 205)">
      <rect width="850" height="42" rx="4" fill="#141417" stroke="#27272a" stroke-width="1" />
      <text x="12" y="18" fill="#f4f4f5" font-size="9.5" font-weight="600">Transferencia de Estilo en Vivo (IRCAM RAVE):</text>
      <text x="12" y="32" fill="#a1a1aa" font-size="8.5">El intérprete modula en tiempo real la voz o instrumento manteniendo tono y dinámica, mientras la red neuronal sintetiza un timbre acústico completamente diferente.</text>
    </g>
  </g>
</svg>
