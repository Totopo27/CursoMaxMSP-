<svg viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">ARQUITECTURA DECLARATIVA MIN-DEVKIT EN C++17</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">APÉNDICE D · C++17 TEMPLATES, RAII &amp; TYPE SAFETY</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- NODO 1: CLASE BASE (ACCENT FOCAL) -->
  <g transform="translate(25, 45)">
    <rect width="250" height="185" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="250" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="17" width="250" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="10" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">CLASE BASE TEMPLATIZADA (C++17)</text>
    <text x="10" y="44" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">c74::min::object&lt;MiClase&gt;</text>
    <text x="10" y="60" fill="#fed7aa" font-size="8.5">Herencia estática mediante CRTP</text>

    <rect x="10" y="74" width="230" height="90" rx="3" fill="#121318" stroke="#eb6c36" stroke-width="0.8" />
    <text x="16" y="92" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5">MIN_EXTERNAL(MiClase);</text>
    <text x="16" y="108" fill="#a1a1aa" font-size="8">• Gestión de memoria RAII</text>
    <text x="16" y="122" fill="#a1a1aa" font-size="8">• std::unique_ptr automático</text>
    <text x="16" y="136" fill="#a1a1aa" font-size="8">• Cero fugas de memoria (memory leaks)</text>
    <text x="16" y="152" fill="#22c55e" font-family="ui-monospace, monospace" font-size="7.5">Auto-registro de la clase en Max</text>
  </g>

  <!-- LÍNEAS DE DISTRIBUCIÓN -->
  <path d="M 275 90 L 315 90" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />
  <path d="M 275 137 L 315 137" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />
  <path d="M 275 180 L 315 180" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />

  <!-- NODO 2: MIEMBROS DECLARATIVOS FUERTEMENTE TIPADOS -->
  <g transform="translate(315, 45)">
    <rect width="320" height="185" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="320" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="320" height="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">COMPONENTES DECLARATIVOS ESTÁTICOS</text>

    <!-- Inlets -->
    <rect x="10" y="30" width="300" height="34" rx="3" fill="#121318" stroke="#3f3f46" stroke-width="0.8" />
    <text x="16" y="44" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8">inlet&lt;&gt; in1 { this, "(bang) Disparo" };</text>
    <text x="16" y="56" fill="#71717a" font-size="7.5">Tipado estricto en tiempo de compilación</text>

    <!-- Outlets -->
    <rect x="10" y="68" width="300" height="34" rx="3" fill="#121318" stroke="#3f3f46" stroke-width="0.8" />
    <text x="16" y="82" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8">outlet&lt;&gt; out1 { this, "(list) Salida" };</text>
    <text x="16" y="94" fill="#71717a" font-size="7.5">Documentación y tooltips integrados</text>

    <!-- Attributes -->
    <rect x="10" y="106" width="300" height="34" rx="3" fill="#121318" stroke="#3f3f46" stroke-width="0.8" />
    <text x="16" y="120" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8">attribute&lt;double&gt; gain { this, "gain", 1.0 };</text>
    <text x="16" y="132" fill="#71717a" font-size="7.5">Sincronizado automáticamente con Inspector y Pattr</text>

    <!-- Messages -->
    <rect x="10" y="144" width="300" height="34" rx="3" fill="#121318" stroke="#3f3f46" stroke-width="0.8" />
    <text x="16" y="158" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="8">message&lt;&gt; bang { this, "bang", ... };</text>
    <text x="16" y="170" fill="#71717a" font-size="7.5">Enlace a expresión lambda sin casteo a (method)</text>
  </g>

  <path d="M 635 137 L 665 137" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arr-accent)" />

  <!-- NODO 3: EXPRESIONES LAMBDA Y EJECUCIÓN -->
  <g transform="translate(665, 45)">
    <rect width="250" height="185" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="250" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="250" height="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">LÓGICA CONCURRENT-SAFE</text>
    <text x="10" y="44" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Expresiones Lambda [&amp;]</text>
    <text x="10" y="60" fill="#a1a1aa" font-size="8.5">Captura local de estado seguro</text>

    <rect x="10" y="74" width="230" height="90" rx="3" fill="#121318" stroke="#27272a" stroke-width="0.8" />
    <text x="14" y="92" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8">MIN_FUNCTION {</text>
    <text x="24" y="108" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8">out1.send(args[0] * gain);</text>
    <text x="24" y="124" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8">return {};</text>
    <text x="14" y="140" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8">};</text>
    <text x="14" y="156" fill="#71717a" font-size="7.5">Type safety validada por el compilador</text>
  </g>

  <!-- PANEL INFERIOR -->
  <g transform="translate(25, 240)">
    <rect width="890" height="54" rx="4" fill="#151518" stroke="#27272a" stroke-width="1" />
    <text x="20" y="22" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">COMPARATIVA HISTÓRICA: C99 CLÁSICO VS C++17 MODERNO:</text>
    <text x="320" y="22" fill="#d4d4d8" font-size="8.5">En el SDK de C tradicional, un error tipográfico en class_addmethod() genera un crash en tiempo de ejecución.</text>
    <text x="20" y="40" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">En Min-DevKit, cualquier inconsistencia de tipos entre inlets, argumentos y lambdas produce un error en tiempo de compilación.</text>
  </g>
</svg>
