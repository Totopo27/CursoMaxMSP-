<svg viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">SÍNTESIS POR GUÍA DE ONDA ACÚSTICA (WAVEGUIDE) EN GENEXPR</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 5.2 · KARPLUS-STRONG EXTENDIDO &amp; BUCLE NO LINEAL</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- EXCITADOR -->
  <g transform="translate(25, 60)">
    <rect width="180" height="95" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="180" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="180" height="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">EXCITACIÓN ACÚSTICA</text>
    <text x="10" y="44" fill="#f4f4f5" font-size="11" font-weight="600">Impulso / Pluck / Bow</text>
    <text x="10" y="62" fill="#a1a1aa" font-size="8.5">Disparo transitorio breve</text>
    <text x="10" y="78" fill="#71717a" font-family="ui-monospace, monospace" font-size="7.5">Ruido rosa + Envolvente Dirac</text>
  </g>

  <!-- SUMADOR EN EL PUENTE -->
  <circle cx="240" cy="107" r="14" fill="#27272a" stroke="#eb6c36" stroke-width="1.2" />
  <text x="240" y="112" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">+</text>

  <path d="M 205 107 L 226 107" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />

  <!-- NÚCLEO GUÍA DE ONDA GEN~ (ACCENT FOCAL) -->
  <g transform="translate(285, 45)">
    <rect width="470" height="190" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="470" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="17" width="470" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="10" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">NÚCLEO RESONADOR GENEXPR (BUCLE DE RETARDO FRACCIONAL)</text>

    <!-- Rama Superior: Onda Viajera Derecha (+) -->
    <rect x="15" y="35" width="190" height="42" rx="3" fill="#121318" stroke="#eb6c36" stroke-width="0.9" />
    <text x="22" y="52" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">Delay Superior: Onda (+)</text>
    <text x="22" y="66" fill="#fed7aa" font-size="8">delay(samplerate, D/2) fraccional</text>

    <!-- Dispersión y Pérdidas -->
    <rect x="235" y="35" width="220" height="42" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.9" />
    <text x="242" y="52" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">Filtro Allpass + Lowpass</text>
    <text x="242" y="66" fill="#a1a1aa" font-size="8">Rigidez inarmónica + Pérdidas agudos</text>

    <!-- Reflexión Derecha -->
    <path d="M 205 56 L 235 56" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />
    <path d="M 455 56 L 460 56 L 460 145 L 435 145" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />

    <!-- Rama Inferior: Onda Viajera Izquierda (-) -->
    <rect x="245" y="125" width="190" height="42" rx="3" fill="#121318" stroke="#eb6c36" stroke-width="0.9" />
    <text x="252" y="142" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">Delay Inferior: Onda (-)</text>
    <text x="252" y="156" fill="#fed7aa" font-size="8">delay(samplerate, D/2) fraccional</text>

    <!-- Saturación Tanh y Reflexión Izquierda -->
    <rect x="25" y="125" width="190" height="42" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.9" />
    <text x="32" y="142" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">Saturación tanh() + Inversión</text>
    <text x="32" y="156" fill="#a1a1aa" font-size="8">Amortiguamiento no lineal (-R1)</text>

    <!-- Conexión inferior de vuelta al sumador -->
    <path d="M 245 145 L 215 145" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />
    <path d="M 25 145 L 5 145 L 5 80 L -31 80" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />
  </g>

  <!-- Conexión de entrada desde sumador a Delay Superior -->
  <path d="M 254 107 L 270 107 L 270 80 L 300 80" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />

  <!-- SALIDA AUDIO -->
  <g transform="translate(780, 85)">
    <rect width="135" height="70" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="12" y="24" fill="#f4f4f5" font-size="11" font-weight="600">Salida Audio</text>
    <text x="12" y="42" fill="#22c55e" font-family="ui-monospace, monospace" font-size="9">Pick-up Posicional</text>
    <text x="12" y="56" fill="#71717a" font-family="ui-monospace, monospace" font-size="7.5">Hacia [ezdac~] L/R</text>
  </g>

  <path d="M 490 101 L 490 120 L 780 120" fill="none" stroke="#22c55e" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-neutral)" />

  <!-- PANEL INFERIOR -->
  <g transform="translate(25, 250)">
    <rect width="890" height="44" rx="4" fill="#151518" stroke="#27272a" stroke-width="1" />
    <text x="20" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">FÍSICA COMPUTACIONAL EN GENEXPR:</text>
    <text x="240" y="20" fill="#d4d4d8" font-size="8.5">La retroalimentación se calcula con resolución de muestra exacta (z^-1) sin retrasos de bloque vectorial MSP.</text>
    <text x="20" y="34" fill="#71717a" font-family="ui-monospace, monospace" font-size="7.5">Permite simular la cuerda pulsada, arco con fricción de Coulomb o membranas circulares con absoluta estabilidad numérica.</text>
  </g>
</svg>
