<svg viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">ESTRUCTURA DE MEMORIA MATRICIAL EN JITTER</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">APÉNDICE A · PLANES, TYPES &amp; TEXTURAS GPU GLSL</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- NODO 1: OBJETO JITTER -->
  <g transform="translate(25, 45)">
    <rect width="180" height="185" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="180" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="180" height="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">OBJETO MATRICIAL</text>
    <text x="10" y="44" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">[jit.matrix]</text>
    <text x="10" y="60" fill="#a1a1aa" font-size="8.5">Instanciador en memoria</text>
    
    <rect x="10" y="74" width="160" height="95" rx="3" fill="#121318" stroke="#27272a" stroke-width="0.8" />
    <text x="16" y="94" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5">4 char 1920 1080</text>
    <text x="16" y="112" fill="#71717a" font-size="8">• 4 Planos (ARGB)</text>
    <text x="16" y="126" fill="#71717a" font-size="8">• char (8-bit uint)</text>
    <text x="16" y="140" fill="#71717a" font-size="8">• 1920x1080 celdas</text>
    <text x="16" y="158" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="7.5">Memoria contigua en C</text>
  </g>

  <path d="M 205 137 L 235 137" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arr-accent)" />

  <!-- NODO 2: LOS TRES PILARES DE LA MATRIZ (ACCENT FOCAL) -->
  <g transform="translate(235, 45)">
    <rect width="450" height="185" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="450" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="17" width="450" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="10" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">ESTRUCTURA DE BUFFER CONTIGUO (C C99 / SDK T_JIT_MATRIX)</text>

    <!-- 1. Planos -->
    <rect x="12" y="32" width="426" height="42" rx="3" fill="#121318" stroke="#eb6c36" stroke-width="0.8" />
    <text x="20" y="48" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">1. Planos (Planes):</text>
    <text x="135" y="48" fill="#fed7aa" font-size="8">1 Plano (Escalar/Altura) · 3 Planos (XYZ/RGB) · 4 Planos (ARGB Video / WXYZ Cuaternión)</text>
    <text x="20" y="64" fill="#71717a" font-size="7.5">Canales de datos intercalados en memoria o paralelos según el formato pixel.</text>

    <!-- 2. Tipos de dato -->
    <rect x="12" y="80" width="426" height="42" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <text x="20" y="96" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">2. Tipo de Dato (Type):</text>
    <text x="145" y="96" fill="#a1a1aa" font-size="8">char (uint8: 0-255) · long (int32) · float32 (Punto flotante IEEE) · float64</text>
    <text x="20" y="112" fill="#71717a" font-size="7.5">Determina el stride de memoria por celda en bytes (1, 4 u 8 bytes).</text>

    <!-- 3. Dimensiones -->
    <rect x="12" y="128" width="426" height="42" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
    <text x="20" y="144" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">3. Dimensiones (Dim):</text>
    <text x="145" y="144" fill="#a1a1aa" font-size="8">Ancho X, Alto Y, Profundidad Z, Tiempo W... (N-Dimensional)</text>
    <text x="20" y="160" fill="#71717a" font-size="7.5">Longitud total = (dimcount[0] * dimcount[1] * ... * dimcount[N-1]) * planecount * typesize.</text>
  </g>

  <path d="M 685 137 L 715 137" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arr-accent)" />

  <!-- NODO 3: DESTINO Y PIPELINE GPU -->
  <g transform="translate(715, 45)">
    <rect width="200" height="185" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="200" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="200" height="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">PIPELINE FINAL</text>
    
    <text x="10" y="44" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">[jit.gl.texture]</text>
    <text x="10" y="60" fill="#22c55e" font-size="8.5">Transferencia a VRAM GPU</text>

    <rect x="10" y="74" width="180" height="95" rx="3" fill="#121318" stroke="#27272a" stroke-width="0.8" />
    <text x="14" y="92" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8">VRAM Texture 2D / 3D</text>
    <text x="14" y="110" fill="#a1a1aa" font-size="8">• Procesamiento GLSL</text>
    <text x="14" y="124" fill="#a1a1aa" font-size="8">• jit.gl.pix / jit.gl.mesh</text>
    <text x="14" y="138" fill="#a1a1aa" font-size="8">• 60 / 120 FPS sin CPU load</text>
    <text x="14" y="156" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="7.5">Render a pantalla o Spout</text>
  </g>

  <!-- PANEL INFERIOR -->
  <g transform="translate(25, 240)">
    <rect width="890" height="54" rx="4" fill="#151518" stroke="#27272a" stroke-width="1" />
    <text x="20" y="22" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">OPTIMIZACIÓN CRÍTICA EN JITTER:</text>
    <text x="225" y="22" fill="#d4d4d8" font-size="8.5">Nunca manipules matrices en CPU mediante bucles de Max para video de alta definición (1080p/4K).</text>
    <text x="20" y="40" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">Cargá la matriz a [jit.gl.texture] inmediatamente y procesala en shaders GLSL o [jit.gl.pix] aprovechando los miles de núcleos de tu GPU.</text>
  </g>
</svg>
