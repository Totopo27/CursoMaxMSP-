<svg viewBox="0 0 940 260" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">MANIPULACIÓN DE LISTAS · ANTIPATRÓN GRÁFICO VS. OPERACIONES VECTORIALES [ZL]</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 1.2C · MEMORIA CONTIGUA VS. SOBRECARGA VISUAL</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- PANEL SUPERIOR: ANTIPATRÓN INEFICIENTE -->
  <g transform="translate(25, 45)">
    <rect width="890" height="90" rx="5" fill="#18181b" stroke="#ef4444" stroke-width="1.2"/>
    <rect width="890" height="20" rx="5" fill="#2a1717"/>
    <rect y="16" width="890" height="4" fill="#2a1717"/>
    <text x="12" y="14" fill="#ef4444" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">ANTIPATRÓN: DESEMPAQUETADO Y RE-EMPAQUETADO POR CABLES GRÁFICOS (DEGRADACIÓN CACHÉ)</text>

    <g transform="translate(20, 32)">
      <!-- Lista entrada -->
      <rect width="110" height="32" rx="3" fill="#222226" stroke="#52525b" stroke-width="1"/>
      <text x="55" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">[ lista N ]</text>
      <!-- Cable -->
      <line x1="110" y1="16" x2="160" y2="16" stroke="#71717a" stroke-width="1.8"/>
      <!-- unpack -->
      <rect x="160" y="0" width="130" height="32" rx="3" fill="#222226" stroke="#ef4444" stroke-width="1.2"/>
      <text x="225" y="20" fill="#ef4444" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">unpack 0 0 0 ...</text>
      <!-- Cables multiples -->
      <line x1="290" y1="8" x2="430" y2="8" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="290" y1="16" x2="430" y2="16" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="290" y1="24" x2="430" y2="24" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="360" y="28" fill="#ef4444" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" text-anchor="middle">N patchcords sueltos</text>
      <!-- pack -->
      <rect x="430" y="0" width="130" height="32" rx="3" fill="#222226" stroke="#ef4444" stroke-width="1.2"/>
      <text x="495" y="20" fill="#ef4444" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">pack 0 0 0 ...</text>
      <!-- Explicacion -->
      <text x="580" y="14" fill="#a1a1aa" font-size="8.5">• N llamadas a funciones en C por cables visuales.</text>
      <text x="580" y="27" fill="#ef4444" font-size="8.5">• Destruye la contigüidad espacial del vector en la memoria caché L1/L2.</text>
    </g>
  </g>

  <!-- PANEL INFERIOR: APROXIMACIÓN VECTORIAL LIMPIA CON [ZL] -->
  <g transform="translate(25, 148)">
    <rect width="890" height="95" rx="5" fill="#18181b" stroke="#22c55e" stroke-width="1.2"/>
    <rect width="890" height="20" rx="5" fill="#142417"/>
    <rect y="16" width="890" height="4" fill="#142417"/>
    <text x="12" y="14" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">ARQUITECTURA ÓPTIMA: OPERACIÓN VECTORIAL EN MEMORIA C CONTIGUA CON [ZL]</text>

    <g transform="translate(20, 32)">
      <!-- Lista entrada -->
      <rect width="110" height="36" rx="3" fill="#222226" stroke="#52525b" stroke-width="1"/>
      <text x="55" y="22" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">[ lista N ]</text>
      <!-- Cable -->
      <line x1="110" y1="18" x2="160" y2="18" stroke="#22c55e" stroke-width="2"/>
      <!-- Objeto zl -->
      <rect x="160" y="0" width="220" height="36" rx="3" fill="#1c1613" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="270" y="22" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">zl.slice 1 / zl.rot / zl.sort</text>
      <!-- Cable salida -->
      <line x1="380" y1="18" x2="430" y2="18" stroke="#22c55e" stroke-width="2"/>
      <!-- Salida -->
      <rect x="430" y="0" width="120" height="36" rx="3" fill="#222226" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="490" y="22" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">[ Resultado ]</text>
      <!-- Explicacion -->
      <text x="575" y="16" fill="#a1a1aa" font-size="8.5">• Opera directamente sobre t_atom argv[] en memoria RAM nativa.</text>
      <text x="575" y="30" fill="#22c55e" font-size="8.5">• 1 solo ciclo de llamada sin desempaquetar visualmente los átomos.</text>
    </g>
  </g>
</svg>