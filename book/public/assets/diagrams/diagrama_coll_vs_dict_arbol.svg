<svg viewBox="0 0 940 250" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">ESTRUCTURAS DE PERSISTENCIA · REGISTROS PLANOS [COLL] VS. JERARQUÍA [DICT] (JSON)</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 2.0B · ORGANIZACIÓN BIDIMENSIONAL Y RUTAS DOT-NOTATION</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- PANEL IZQUIERDO: OBJETO [COLL] (BASE DE DATOS CLÁSICA) -->
  <g transform="translate(25, 45)">
    <rect width="425" height="185" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1.2"/>
    <rect width="425" height="22" rx="5" fill="#27272a"/>
    <rect y="17" width="425" height="5" fill="#27272a"/>
    <text x="12" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">[COLL] TABLA BIDIMENSIONAL PLANA (CLAVE ──► REGISTRO)</text>

    <!-- TABLA DE REGISTROS -->
    <g transform="translate(15, 32)">
      <!-- Fila 1 -->
      <rect width="395" height="26" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <text x="10" y="17" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">1,</text>
      <text x="35" y="17" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5">60 100 250;</text>
      <text x="170" y="17" fill="#71717a" font-size="8">// Clave 1: Nota 60, Vel 100, Dur 250ms</text>
      <!-- Fila 2 -->
      <rect y="32" width="395" height="26" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <text x="10" y="49" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">2,</text>
      <text x="35" y="49" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5">64 90 500;</text>
      <text x="170" y="49" fill="#71717a" font-size="8">// Clave 2: Nota 64, Vel 90, Dur 500ms</text>
      <!-- Fila 3 -->
      <rect y="64" width="395" height="26" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <text x="10" y="81" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">intro,</text>
      <text x="50" y="81" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5">120 4 4;</text>
      <text x="170" y="81" fill="#71717a" font-size="8">// Clave simbólica: 120 BPM, Compás 4/4</text>
    </g>
    <text x="15" y="145" fill="#a1a1aa" font-size="8">• Búsqueda por índice entero o símbolo en un solo paso.</text>
    <text x="15" y="158" fill="#a1a1aa" font-size="8">• Ideal para secuencias monofónicas lineales y tablas de afinación microtonal.</text>
  </g>

  <!-- PANEL DERECHO: OBJETO [DICT] (ÁRBOL JERÁRQUICO JSON) -->
  <g transform="translate(485, 45)">
    <rect width="430" height="185" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3"/>
    <rect width="430" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)"/>
    <rect y="17" width="430" height="5" fill="rgba(235, 108, 54, 0.18)"/>
    <text x="12" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">[DICT] ÁRBOL JERÁRQUICO Y RUTAS DOT-NOTATION</text>

    <!-- CÓDIGO Y RUTAS -->
    <g transform="translate(15, 32)">
      <rect width="400" height="48" rx="3" fill="#2a1b14" stroke="#eb6c36" stroke-width="1"/>
      <text x="10" y="16" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">CONSULTA DIRECTA SIN RECORRER EL GRAFO:</text>
      <text x="10" y="32" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8.5">get filter::cutoff</text>
      <text x="170" y="32" fill="#a1a1aa" font-size="8">──► Devuelve 1850.5 en tiempo O(1)</text>
      <text x="10" y="44" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8.5">set filter::resonance 0.85</text>
      <text x="170" y="44" fill="#a1a1aa" font-size="8">──► Modifica la rama sin alterar el preset</text>
    </g>

    <g transform="translate(15, 88)">
      <rect width="400" height="50" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="10" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8">{ "preset": "Pad", "filter": { "cutoff": 1850.5, "res": 0.85 } }</text>
      <text x="10" y="32" fill="#a1a1aa" font-size="8">• Diccionarios anidados con serialización directa a disco (.json).</text>
      <text x="10" y="44" fill="#fed7aa" font-size="8">• Paso por referencia en C: viaja el nombre registrado, no el JSON completo.</text>
    </g>
  </g>
</svg>