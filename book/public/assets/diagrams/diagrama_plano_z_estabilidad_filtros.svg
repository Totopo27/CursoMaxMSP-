<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">ESTABILIDAD ASINTÓTICA EN FILTRADO DIGITAL · EL PLANO COMPLEJO Z</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 3.7 · CÍRCULO UNITARIO (|Z| = 1), POLOS Y CEROS</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- CONTENEDOR PRINCIPAL -->
  <g transform="translate(25, 45)">
    <rect width="890" height="260" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="890" height="24" rx="6" fill="#27272a" />
    <rect y="19" width="890" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">MAPEO EN EL PLANO Z · CONDICIÓN BIBO (BOUNDED-INPUT BOUNDED-OUTPUT)</text>

    <!-- PLANO Z COMPLEJO (IZQUIERDA) -->
    <g transform="translate(40, 36)">
      <!-- Ejes Real e Imaginario -->
      <line x1="20" y1="105" x2="320" y2="105" stroke="#52525b" stroke-width="1.2" marker-end="url(#arr-neutral)" />
      <line x1="170" y1="200" x2="170" y2="10" stroke="#52525b" stroke-width="1.2" marker-end="url(#arr-neutral)" />
      <text x="325" y="108" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5">Re(z)</text>
      <text x="175" y="12" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5">Im(z)</text>

      <!-- Círculo Unitario |z| = 1 -->
      <circle cx="170" cy="105" r="70" fill="rgba(235, 108, 54, 0.05)" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3" />
      <text x="245" y="120" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8">|z| = 1.0</text>
      <text x="175" y="42" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8">+1.0j</text>
      <text x="175" y="185" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8">-1.0j</text>

      <!-- Polo Estable (dentro del círculo) - FOCAL -->
      <line x1="195" y1="75" x2="215" y2="95" stroke="#22c55e" stroke-width="2.5" />
      <line x1="215" y1="75" x2="195" y2="95" stroke="#22c55e" stroke-width="2.5" />
      <text x="220" y="85" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8" font-weight="700">Polo pk (|p| &lt; 1)</text>
      <text x="220" y="96" fill="#fed7aa" font-size="7.5">Estable y resonante</text>

      <!-- Polo Inestable (fuera del círculo) -->
      <line x1="250" y1="30" x2="270" y2="50" stroke="#ef4444" stroke-width="2.5" />
      <line x1="270" y1="30" x2="250" y2="50" stroke="#ef4444" stroke-width="2.5" />
      <text x="275" y="38" fill="#ef4444" font-family="ui-monospace, monospace" font-size="8" font-weight="700">Polo (|p| &gt; 1)</text>
      <text x="275" y="50" fill="#fca5a5" font-size="7.5">¡EXPLOSIÓN A +INF / NAN!</text>

      <!-- Cero del Filtro (Círculo pequeño) -->
      <circle cx="100" cy="105" r="4" fill="none" stroke="#a78bfa" stroke-width="2" />
      <text x="75" y="125" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="8">Cero zk (Muesca/Notch)</text>
    </g>

    <!-- PANEL DERECHO: CONDICIONES DE ESTABILIDAD Y COMPORTAMIENTO (FOCAL ACCENT) -->
    <g transform="translate(420, 36)">
      <rect width="450" height="195" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
      <rect width="450" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)" />
      <rect y="17" width="450" height="5" fill="rgba(235, 108, 54, 0.18)" />
      <text x="12" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">CRITERIOS MATEMÁTICOS DE INGENIERÍA</text>

      <g transform="translate(15, 32)">
        <text x="0" y="16" fill="#f4f4f5" font-size="10.5" font-weight="600">Tres Regímenes Operativos según la Magnitud del Polo |p|:</text>
        
        <text x="0" y="38" fill="#22c55e" font-family="ui-monospace, monospace" font-size="9" font-weight="700">1. |pk| &lt; 1.0 (Interior del Círculo):</text>
        <text x="0" y="52" fill="#a1a1aa" font-size="8.5">Filtro IIR estable. Cuanto más cerca del borde, mayor es la resonancia (Q).</text>

        <text x="0" y="74" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9" font-weight="700">2. |pk| = 1.0 (Sobre el Círculo Unitario):</text>
        <text x="0" y="88" fill="#a1a1aa" font-size="8.5">Auto-oscilación sinusoidal perfecta no amortiguada (Límite crítico).</text>

        <text x="0" y="110" fill="#ef4444" font-family="ui-monospace, monospace" font-size="9" font-weight="700">3. |pk| &gt; 1.0 (Exterior del Círculo):</text>
        <text x="0" y="124" fill="#fca5a5" font-size="8.5">Inestabilidad BIBO exponencial: Amplitud satura registros de 64 bits a NaN.</text>

        <rect x="0" y="138" width="420" height="26" rx="3" fill="#2a1b14" stroke="#eb6c36" stroke-width="1" />
        <text x="10" y="155" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="8">Max/MSP: [filtergraph~] restringe automáticamente los polos dentro del círculo.</text>
      </g>
    </g>
  </g>
</svg>
