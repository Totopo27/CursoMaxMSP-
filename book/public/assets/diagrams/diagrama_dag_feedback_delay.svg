<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">TEORÍA DE GRAFOS · MILLER PUCKETTE Y TODD WINKLER</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 1.1C · GRAFO DIRIGIDO ACÍCLICO (DAG) VS. BUCLE EN T = 0</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- PANEL IZQUIERDO: BUCLE INFINITO EN T = 0 (STACK OVERFLOW) -->
  <g transform="translate(25, 45)">
    <rect width="430" height="260" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="430" height="24" rx="6" fill="#27272a" />
    <rect y="19" width="430" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#ef4444" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">1. EL PROBLEMA DEL BUCLE CERRADO EN T = 0</text>

    <!-- DIAGRAMA DE RETROALIMENTACIÓN SIN RETARDO -->
    <g transform="translate(110, 45)">
      <rect width="180" height="50" rx="4" fill="#2a1414" stroke="#ef4444" stroke-width="1.3" />
      <text x="90" y="30" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">[ + 1 ]</text>
    </g>

    <!-- BUCLE RECURSIVO INFINITO -->
    <path d="M 200 95 L 200 130 L 70 130 L 70 70 L 110 70" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arr-red)" />
    <text x="135" y="122" fill="#ef4444" font-family="ui-monospace, monospace" font-size="8">Llamada recursiva directa t = 0</text>

    <!-- NOTA DE COLAPSO -->
    <g transform="translate(20, 150)">
      <rect width="390" height="90" rx="4" fill="#141417" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3" />
      <text x="10" y="18" fill="#ef4444" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">¡STACK OVERFLOW INMEDIATO EN &lt; 1 MS!</text>
      <text x="10" y="34" fill="#f4f4f5" font-size="9">La función en C outlet_int() llama a plussz_int() del mismo objeto</text>
      <text x="10" y="48" fill="#f4f4f5" font-size="9">sin que avance el tiempo del Scheduler. La pila de llamadas se agota</text>
      <text x="10" y="62" fill="#fed7aa" font-size="8.5">y el proceso de Max se congela de forma fatal.</text>
    </g>
  </g>

  <!-- PANEL DERECHO: DESACOPLE TEMPORAL (DAG DETERMINISTA) - FOCAL ACCENT -->
  <g transform="translate(485, 45)">
    <rect width="430" height="260" rx="6" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="430" height="24" rx="6" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="19" width="430" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="12" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">2. SOLUCIÓN ARQUITECTÓNICA DE WINKLER (DAG ESTABLE)</text>

    <!-- DIAGRAMA CON DESACOPLADOR DELAY / PIPE -->
    <g transform="translate(40, 45)">
      <rect width="130" height="42" rx="4" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="65" y="26" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">[ + 1 ]</text>
    </g>

    <g transform="translate(230, 45)">
      <rect width="150" height="42" rx="4" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
      <text x="75" y="26" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">[delay 10] / [pipe]</text>
    </g>

    <!-- CONECTORES CON DESACOPLE -->
    <path d="M 170 66 L 230 66" stroke="#71717a" stroke-width="1.3" fill="none" marker-end="url(#arr-neutral)" />
    <path d="M 305 87 L 305 125 L 105 125 L 105 87" stroke="#eb6c36" stroke-width="1.5" fill="none" marker-end="url(#arr-accent)" />
    <text x="205" y="118" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">Evento en nuevo tick (t &gt; 0)</text>

    <!-- NOTA DE ESTABILIDAD -->
    <g transform="translate(20, 150)">
      <rect width="390" height="90" rx="4" fill="#18181b" stroke="#eb6c36" stroke-width="1" />
      <text x="10" y="18" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">DESACOPLE TEMPORAL DETERMINISTA</text>
      <text x="10" y="34" fill="#f4f4f5" font-size="9">Al intercalar [delay] o una compuerta [gate], la retroalimentación se</text>
      <text x="10" y="48" fill="#f4f4f5" font-size="9">agenda en una cola de eventos futura del Scheduler Thread.</text>
      <text x="10" y="62" fill="#fed7aa" font-size="8.5">El call stack actual retorna a 0 bytes y el sistema opera indefinidamente.</text>
    </g>
  </g>
</svg>
