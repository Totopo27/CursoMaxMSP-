<svg viewBox="0 0 940 320" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">INTERFAZ DE CONTROL Y ENRUTAMIENTO · OBJETO [TRANSPORT]</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 0.7 · CONTROL Y CONSULTA DE ESTADO EN TIEMPO REAL</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- FUENTES DE CONTROL SUPERIORES -->
  <!-- Control 1: toggle / metro -->
  <g transform="translate(180, 42)">
    <rect width="180" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="10" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">DISPARO DE SONDEO (POLL)</text>
    <text x="10" y="32" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10" font-weight="600">[toggle] ──► [metro 20]</text>
  </g>

  <!-- Control 2: flonum / tempo -->
  <g transform="translate(580, 42)">
    <rect width="180" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="10" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">CONTROL DE TEMPO (BPM)</text>
    <text x="10" y="32" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10" font-weight="600">[flonum 120.] ──► [tempo $1]</text>
  </g>

  <!-- CONNECTORS FROM TOP TO [TRANSPORT] -->
  <path d="M 270 84 L 270 120 L 410 120" stroke="#71717a" stroke-width="1.2" fill="none" marker-end="url(#arr-neutral)" />
  <path d="M 670 84 L 670 120 L 530 120" stroke="#71717a" stroke-width="1.2" fill="none" marker-end="url(#arr-neutral)" />

  <!-- NODO CENTRAL: OBJETO [TRANSPORT] (FOCAL) -->
  <g transform="translate(370, 105)">
    <rect width="200" height="65" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="200" height="20" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="15" width="200" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="10" y="14" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">OBJETO DE CONTROL TEMPORAL</text>
    <text x="10" y="40" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="600">[transport]</text>
    <text x="10" y="55" fill="#fed7aa" font-size="8.5">Consultor y modulador de reloj global</text>
  </g>

  <!-- CONNECTORS FROM [TRANSPORT] TO 3 OUTLETS -->
  <!-- Outlet 1: Bars.Beats.Ticks -->
  <path d="M 400 170 L 400 200 L 160 200 L 160 218" stroke="#eb6c36" stroke-width="1.5" fill="none" marker-end="url(#arr-accent)" />
  <!-- Outlet 2: BPM -->
  <path d="M 470 170 L 470 218" stroke="#71717a" stroke-width="1.2" fill="none" marker-end="url(#arr-neutral)" />
  <!-- Outlet 3: Time Signature -->
  <path d="M 540 170 L 540 200 L 780 200 L 780 218" stroke="#71717a" stroke-width="1.2" fill="none" marker-end="url(#arr-neutral)" />

  <!-- TRES PANELES DE SALIDA (OUTLETS) -->
  <!-- Panel 1: Posición métrica (Focal) -->
  <g transform="translate(50, 220)">
    <rect width="220" height="85" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
    <rect width="220" height="18" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="13" width="220" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="10" y="13" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">OUTLET 1 · POSICIÓN TEMPORAL</text>
    <text x="10" y="38" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">compás.negra.tick</text>
    <text x="10" y="56" fill="#fed7aa" font-size="9">Ej: 1. 1. 0 hasta 128. 4. 479</text>
    <text x="10" y="72" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5">480 ticks = 1 negra inmutable</text>
  </g>

  <!-- Panel 2: BPM -->
  <g transform="translate(360, 220)">
    <rect width="220" height="85" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="220" height="18" rx="5" fill="#27272a" />
    <rect y="13" width="220" height="5" fill="#27272a" />
    <text x="10" y="13" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">OUTLET 2 · VELOCIDAD RÍTMICA</text>
    <text x="10" y="38" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">Tempo Actual (BPM)</text>
    <text x="10" y="56" fill="#a1a1aa" font-size="9">Valor numérico flotante en tiempo real</text>
    <text x="10" y="72" fill="#71717a" font-family="ui-monospace, monospace" font-size="8.5">Re-cálculo sin clicks en DSP</text>
  </g>

  <!-- Panel 3: Time Signature -->
  <g transform="translate(670, 220)">
    <rect width="220" height="85" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="220" height="18" rx="5" fill="#27272a" />
    <rect y="13" width="220" height="5" fill="#27272a" />
    <text x="10" y="13" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">OUTLET 3 · MÉTRICA COMPÁS</text>
    <text x="10" y="38" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">timesig (Num / Den)</text>
    <text x="10" y="56" fill="#a1a1aa" font-size="9">Ej: 4 4, 3 4, 7 8, 5 8</text>
    <text x="10" y="72" fill="#71717a" font-family="ui-monospace, monospace" font-size="8.5">Re-alineación de acentos métricos</text>
  </g>
</svg>
