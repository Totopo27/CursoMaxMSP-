<svg viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">LOS TRES PARADIGMAS DE ESPACIALIZACIÓN 3D Y AUDIO INMERSIVO</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">APÉNDICE F · VBAP, HOA AMBISONICS &amp; BINAURAL HRTF (SPAT5)</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- NODO CENTRAL SUPERIOR: FUENTE ACÚSTICA MULTICANAL -->
  <g transform="translate(325, 42)">
    <rect width="290" height="60" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="290" height="20" rx="5" fill="#27272a" />
    <text x="10" y="14" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">FUENTE DE ENTRADA</text>
    <text x="10" y="38" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">Fuente Acústica (X, Y, Z / Azimut, Elevación)</text>
    <text x="10" y="52" fill="#71717a" font-size="8">Señal monoaural o multicanal con coordenadas espaciales</text>
  </g>

  <!-- LÍNEAS DE DISTRIBUCIÓN DESDE LA FUENTE -->
  <path d="M 370 102 L 370 120 L 155 120 L 155 135" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-neutral)" />
  <path d="M 470 102 L 470 135" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arr-accent)" />
  <path d="M 570 102 L 570 120 L 785 120 L 785 135" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-neutral)" />

  <!-- 3 PARADIGMAS -->
  <!-- 1. VBAP (Geométrico discreto) -->
  <g transform="translate(25, 135)">
    <rect width="260" height="98" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="260" height="22" rx="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">1. PANNING GEOMÉTRICO</text>
    
    <text x="10" y="44" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">VBAP (Pulkki)</text>
    <text x="10" y="60" fill="#a1a1aa" font-size="8.5">Vector Base Amplitude Panning</text>

    <rect x="10" y="68" width="240" height="22" rx="2" fill="#121318" stroke="#27272a" stroke-width="0.8" />
    <text x="16" y="82" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">Arreglo fijo: 5.1 / 7.1.4 / Domo 32ch</text>
  </g>

  <!-- 2. HOA AMBISONICS (Campo continuo - ACCENT FOCAL) -->
  <g transform="translate(325, 135)">
    <rect width="290" height="98" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="290" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="10" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">2. CAMPO CONTINUO (INDEPENDIENTE)</text>
    
    <text x="10" y="44" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Ambisonics HOA (B-Format)</text>
    <text x="10" y="60" fill="#fed7aa" font-size="8.5">Armónicos Esféricos (W, X, Y, Z, R, S...)</text>

    <rect x="10" y="68" width="270" height="22" rx="2" fill="#121318" stroke="#eb6c36" stroke-width="0.8" />
    <text x="16" y="82" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8">Decodificador adaptativo a cualquier sala</text>
  </g>

  <!-- 3. BINAURAL HRTF (Psicoacústica auricular) -->
  <g transform="translate(655, 135)">
    <rect width="260" height="98" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="260" height="22" rx="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">3. PSICOACÚSTICA AURICULAR</text>
    
    <text x="10" y="44" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">Binaural HRTF (IRCAM)</text>
    <text x="10" y="60" fill="#a1a1aa" font-size="8.5">Head-Related Transfer Functions</text>

    <rect x="10" y="68" width="240" height="22" rx="2" fill="#121318" stroke="#27272a" stroke-width="0.8" />
    <text x="16" y="82" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8">Salida estéreo 3D para auriculares</text>
  </g>

  <!-- PANEL INFERIOR -->
  <g transform="translate(25, 248)">
    <rect width="890" height="50" rx="4" fill="#151518" stroke="#27272a" stroke-width="1" />
    <text x="20" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">LA VENTAJA DE SPAT5 EN MAX/MSP:</text>
    <text x="200" y="20" fill="#d4d4d8" font-size="8.5">Desacopla la composición de la reproducción. Componés en coordenadas esféricas 3D continuas;</text>
    <text x="20" y="36" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">luego el objeto spat5.decoder~ adapta la escena instantáneamente al auditorio físico o a auriculares con filtros HRTF de convolución SOFA.</text>
  </g>
</svg>
