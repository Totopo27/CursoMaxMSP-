<svg viewBox="0 0 940 320" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">ARQUITECTURA DE ENRUTAMIENTO · ACOPLAMIENTO DE MENSAJES</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 2.3 · PUNTO A PUNTO VS. PUBLISH / SUBSCRIBE</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- PANEL IZQUIERDO: CABLE DIRECTO (PUNTO A PUNTO) -->
  <g transform="translate(25, 45)">
    <rect width="430" height="250" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="430" height="24" rx="6" fill="#27272a" />
    <rect y="19" width="430" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">CABLE DIRECTO · ACOPLAMIENTO FUERTE (TIGHT COUPLING)</text>

    <!-- ORIGEN -->
    <g transform="translate(20, 45)">
      <rect width="130" height="50" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1" />
      <text x="10" y="18" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="9" font-weight="700">[ Origen ]</text>
      <text x="10" y="34" fill="#a1a1aa" font-size="8.5">Emisor local</text>
    </g>

    <!-- CABLE CONECTOR -->
    <path d="M 150 70 L 268 70" stroke="#71717a" stroke-width="1.4" fill="none" marker-end="url(#arr-neutral)" />
    <text x="210" y="62" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">patchcord</text>

    <!-- DESTINO -->
    <g transform="translate(275, 45)">
      <rect width="130" height="50" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1" />
      <text x="10" y="18" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="9" font-weight="700">[ Destino ]</text>
      <text x="10" y="34" fill="#a1a1aa" font-size="8.5">Receptor local</text>
    </g>

    <!-- CARACTERÍSTICAS TÉCNICAS -->
    <g transform="translate(20, 115)">
      <rect width="390" height="115" rx="4" fill="#141417" stroke="#27272a" stroke-width="1" />
      <text x="12" y="20" fill="#f4f4f5" font-size="10" font-weight="600">Determinismo Espacial Estricto</text>
      <text x="12" y="38" fill="#a1a1aa" font-size="9">• Orden de ejecución garantizado por orden espacial (Right-to-Left).</text>
      <text x="12" y="54" fill="#a1a1aa" font-size="9">• Cero posibilidad de colisiones de nombres o variables duplicadas.</text>
      <text x="12" y="70" fill="#a1a1aa" font-size="9">• Desventaja: Genera "spaghetti code" al escalar a cientos de objetos.</text>
      <text x="12" y="92" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">Localidad en el mismo patcher únicamente</text>
    </g>
  </g>

  <!-- PANEL DERECHO: DIFUSIÓN REMOTA PUB/SUB (SEND/RECEIVE) - FOCAL ACCENT -->
  <g transform="translate(485, 45)">
    <rect width="430" height="250" rx="6" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="430" height="24" rx="6" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="19" width="430" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="12" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">DIFUSIÓN REMOTA · DESACOPLAMIENTO DÉBIL (PUB / SUB)</text>

    <!-- EMISOR [SEND] -->
    <g transform="translate(20, 65)">
      <rect width="140" height="48" rx="4" fill="#2a1b14" stroke="#eb6c36" stroke-width="1.2" />
      <text x="10" y="18" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">[send canal_A]</text>
      <text x="10" y="34" fill="#fed7aa" font-size="8.5">Publicador global</text>
    </g>

    <!-- CONECTORES ORTOGONALES A 2 RECEPTORES -->
    <path d="M 160 89 L 205 89 L 205 56 L 240 56" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arr-accent)" />
    <path d="M 160 89 L 205 89 L 205 122 L 240 122" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arr-accent)" />

    <!-- RECEPTOR 1 -->
    <g transform="translate(245, 36)">
      <rect width="165" height="40" rx="4" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="10" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" font-weight="600">[receive canal_A]</text>
      <text x="10" y="30" fill="#a1a1aa" font-size="8">Consumidor 1 (Subpatch)</text>
    </g>

    <!-- RECEPTOR 2 -->
    <g transform="translate(245, 102)">
      <rect width="165" height="40" rx="4" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="10" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" font-weight="600">[receive canal_A]</text>
      <text x="10" y="30" fill="#a1a1aa" font-size="8">Consumidor 2 (Abstracción)</text>
    </g>

    <!-- NOTA DE ADVERTENCIA ARQUITECTÓNICA -->
    <g transform="translate(20, 160)">
      <rect width="390" height="72" rx="4" fill="#18181b" stroke="#eb6c36" stroke-width="1" stroke-dasharray="3 3" />
      <text x="10" y="18" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">¡PELIGRO DE NO-DETERMINISMO TEMPORAL!</text>
      <text x="10" y="34" fill="#f4f4f5" font-size="9">Si existen múltiples [receive canal_A], el orden relativo de llegada es</text>
      <text x="10" y="48" fill="#fed7aa" font-size="9">arbitrario e impredecible (orden de instanciación en memoria).</text>
      <text x="10" y="62" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">Solución profesional: Usar forward o pattrstorage para orden estricto</text>
    </g>
  </g>
</svg>
