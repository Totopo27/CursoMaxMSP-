<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">SISTEMA INTEGRAL DE SÍNTESIS Y MORPHING · PROYECTO 2</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 2.4 · MOTOR DE INTERPOLACIÓN CONTINUA (PATTRSTORAGE)</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- SUBSISTEMA SUPERIOR: CONTROL Y COMANDOS TEMPORALES -->
  <!-- Pad 2D [nodes] -->
  <g transform="translate(25, 45)">
    <rect width="210" height="60" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="10" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">PAD 2D DE INTERPOLACIÓN</text>
    <text x="10" y="34" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">[nodes] ──► recall multi</text>
    <text x="10" y="48" fill="#71717a" font-size="8">Ponderación baricéntrica continua</text>
  </g>

  <!-- Comandos Temporales -->
  <g transform="translate(255, 45)">
    <rect width="210" height="60" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="10" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">COMANDOS TEMPORALES</text>
    <text x="10" y="34" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">recall 1 2 4000.</text>
    <text x="10" y="48" fill="#71717a" font-size="8">Transición suave en 4 segundos</text>
  </g>

  <!-- ARCHIVOS JSON -->
  <g transform="translate(485, 45)">
    <rect width="180" height="60" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <text x="10" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">PERSISTENCIA EN DISCO</text>
    <text x="10" y="34" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">write / read banco.json</text>
    <text x="10" y="48" fill="#71717a" font-size="8">Serialización estructurada</text>
  </g>

  <!-- NODO CENTRAL FOCAL: [PATTRSTORAGE] -->
  <g transform="translate(685, 45)">
    <rect width="230" height="60" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="230" height="18" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="13" width="230" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="10" y="13" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">GESTOR CENTRAL DE ESTADOS</text>
    <text x="10" y="36" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">[pattrstorage]</text>
    <text x="10" y="50" fill="#fed7aa" font-size="8.5">Interpolación N-dimensional viva</text>
  </g>

  <!-- CONECTORES A PATTRSTORAGE -->
  <path d="M 235 75 L 255 75" stroke="#71717a" stroke-width="1.2" fill="none" marker-end="url(#arr-neutral)" />
  <path d="M 465 75 L 485 75" stroke="#71717a" stroke-width="1.2" fill="none" marker-end="url(#arr-neutral)" />
  <path d="M 665 75 L 685 75" stroke="#eb6c36" stroke-width="1.3" fill="none" marker-end="url(#arr-accent)" />

  <!-- CONNECTOR DOWN TO AUTOPATTR -->
  <path d="M 800 105 L 800 135 L 500 135" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arr-accent)" />

  <!-- CLIENTE VINCULADOR: [AUTOPATTR] -->
  <g transform="translate(300, 120)">
    <rect width="200" height="32" rx="4" fill="#2a1b14" stroke="#eb6c36" stroke-width="1.2" />
    <text x="100" y="20" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">[autopattr] (Enlace Obex)</text>
  </g>

  <!-- BUS DE 4 VARIABLES (VARNAME) -->
  <path d="M 400 152 L 400 170" stroke="#eb6c36" stroke-width="1.3" fill="none" />
  <path d="M 120 170 L 820 170" stroke="#eb6c36" stroke-width="1.2" fill="none" />

  <path d="M 120 170 L 120 188" stroke="#eb6c36" stroke-width="1.2" fill="none" marker-end="url(#arr-accent)" />
  <path d="M 350 170 L 350 188" stroke="#eb6c36" stroke-width="1.2" fill="none" marker-end="url(#arr-accent)" />
  <path d="M 590 170 L 590 188" stroke="#eb6c36" stroke-width="1.2" fill="none" marker-end="url(#arr-accent)" />
  <path d="M 820 170 L 820 188" stroke="#eb6c36" stroke-width="1.2" fill="none" marker-end="url(#arr-accent)" />

  <!-- 4 PARAMETROS EXPUESTOS -->
  <g transform="translate(40, 190)">
    <rect width="160" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="8" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" font-weight="600">varname cutoff</text>
    <text x="8" y="32" fill="#71717a" font-size="8">Frecuencia de corte</text>
  </g>

  <g transform="translate(270, 190)">
    <rect width="160" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="8" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" font-weight="600">varname res</text>
    <text x="8" y="32" fill="#71717a" font-size="8">Resonancia de filtro</text>
  </g>

  <g transform="translate(510, 190)">
    <rect width="160" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="8" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" font-weight="600">varname mod</text>
    <text x="8" y="32" fill="#71717a" font-size="8">Índice Modulación FM</text>
  </g>

  <g transform="translate(740, 190)">
    <rect width="160" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="8" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" font-weight="600">varname amp</text>
    <text x="8" y="32" fill="#71717a" font-size="8">Nivel de Ganancia</text>
  </g>

  <!-- MOTOR ACÚSTICO Y SALIDA DAC FINAL -->
  <g transform="translate(180, 248)">
    <rect width="580" height="65" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
    <text x="15" y="18" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">MOTOR ACÚSTICO MULTI-MODO & SALIDA DAC (FLEXASIO)</text>
    <text x="15" y="36" fill="#f4f4f5" font-size="10" font-weight="600">cycle~ (Carrier) + cycle~ (Mod FM) ──► lores~ ──► line~ ──► *~ 0.5 ──► ezdac~</text>
    <text x="15" y="52" fill="#fed7aa" font-size="8.5">Bus global_panic para silenciado de emergencia · Cero artefactos de click en interpolación</text>
  </g>
</svg>
