<svg viewBox="0 0 940 370" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">TOPOLOGÍA PERIMETRAL DEL PATCHER</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 0.2 · DISTRIBUCIÓN DE HERRAMIENTAS</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- Marco Exterior de la Ventana -->
  <rect x="20" y="42" width="900" height="310" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />

  <!-- BARRA SUPERIOR -->
  <rect x="20" y="42" width="900" height="36" rx="6" fill="#27272a" />
  <rect x="20" y="70" width="900" height="8" fill="#27272a" />
  <line x1="20" y1="78" x2="920" y2="78" stroke="#3f3f46" stroke-width="1" />
  <text x="36" y="64" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">TOP TOOLBAR</text>
  <text x="145" y="64" fill="#a1a1aa" font-size="9.5">Paleta de Creación Rápida: [ N ] Objeto · [ M ] Mensaje · [ C ] Comentario · [ B ] Bang · [ T ] Toggle · [ I / F ] Números</text>

  <!-- BARRA LATERAL IZQUIERDA -->
  <rect x="20" y="78" width="165" height="236" fill="#202024" />
  <line x1="185" y1="78" x2="185" y2="314" stroke="#3f3f46" stroke-width="1" />
  <text x="32" y="100" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">LEFT TOOLBAR</text>
  <g transform="translate(32, 120)">
    <circle cx="5" cy="5" r="2.5" fill="#71717a" />
    <text x="15" y="8" fill="#d4d4d8" font-size="9.5">Explorador de Archivos</text>
  </g>
  <g transform="translate(32, 148)">
    <circle cx="5" cy="5" r="2.5" fill="#71717a" />
    <text x="15" y="8" fill="#d4d4d8" font-size="9.5">Package Manager</text>
  </g>
  <g transform="translate(32, 176)">
    <circle cx="5" cy="5" r="2.5" fill="#71717a" />
    <text x="15" y="8" fill="#d4d4d8" font-size="9.5">Snippets de Código</text>
  </g>
  <g transform="translate(32, 204)">
    <circle cx="5" cy="5" r="2.5" fill="#71717a" />
    <text x="15" y="8" fill="#d4d4d8" font-size="9.5">Plugins de Audio VST</text>
  </g>

  <!-- LIENZO CENTRAL -->
  <rect x="205" y="92" width="510" height="208" rx="5" fill="#121316" stroke="#27272a" stroke-width="1.2" />
  <text x="460" y="150" fill="#27272a" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.1em">PATCHER CANVAS</text>
  <text x="460" y="172" fill="#52525b" font-size="10.5" text-anchor="middle">Área interactiva de programación visual</text>
  <rect x="405" y="200" width="110" height="28" rx="3" fill="#18181b" stroke="#eb6c36" stroke-width="1.2" />
  <circle cx="417" cy="214" r="2.5" fill="#eb6c36" />
  <text x="460" y="218" fill="#ffedd5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" text-anchor="middle">cycle~ 440</text>

  <!-- BARRA LATERAL DERECHA -->
  <rect x="735" y="78" width="185" height="236" fill="#202024" />
  <line x1="735" y1="78" x2="735" y2="314" stroke="#3f3f46" stroke-width="1" />
  <text x="750" y="100" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">RIGHT TOOLBAR</text>
  <g transform="translate(750, 115)">
    <rect x="0" y="0" width="145" height="24" rx="3" fill="#27272a" stroke="#eb6c36" stroke-width="1" />
    <text x="10" y="15" fill="#f4f4f5" font-size="9.5" font-weight="600">Inspector (Ctrl + I)</text>
  </g>
  <g transform="translate(750, 155)">
    <text x="4" y="10" fill="#d4d4d8" font-size="9.5">Referencia de Objeto</text>
    <text x="4" y="23" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">Atributos y mensajes</text>
  </g>
  <g transform="translate(750, 195)">
    <text x="4" y="10" fill="#d4d4d8" font-size="9.5">Ayuda Integrada</text>
    <text x="4" y="23" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">Manuales y tutoriales</text>
  </g>

  <!-- BARRA INFERIOR -->
  <rect x="20" y="314" width="900" height="38" rx="6" fill="#27272a" />
  <rect x="20" y="314" width="900" height="6" fill="#27272a" />
  <line x1="20" y1="314" x2="920" y2="314" stroke="#3f3f46" stroke-width="1" />
  <text x="36" y="337" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">BOTTOM TOOLBAR</text>
  <text x="165" y="337" fill="#a1a1aa" font-size="9.5">Candado (Lock) · Modo Presentación · Zoom · Audio DSP On/Off · Monitor de CPU</text>
  <rect x="815" y="323" width="75" height="20" rx="3" fill="#18181b" stroke="#52525b" stroke-width="0.8" />
  <circle cx="826" cy="333" r="3" fill="#10b981" />
  <text x="836" y="337" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">DSP ON</text>
</svg>
