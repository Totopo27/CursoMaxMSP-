<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- HEADER EDITORIAL -->
  <text x="30" y="24" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="0.08em">TOPOLOGÍA PERIMETRAL DEL PATCHER</text>
  <text x="830" y="24" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="end">FIG 0.2 · DISTRIBUCIÓN DE HERRAMIENTAS</text>
  <line x1="30" y1="32" x2="830" y2="32" stroke="#27272a" stroke-width="1"/>

  <!-- Marco Exterior de la Ventana -->
  <rect x="15" y="45" width="830" height="320" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />

  <!-- BARRA SUPERIOR -->
  <rect x="15" y="45" width="830" height="40" rx="8" fill="#27272a" />
  <rect x="15" y="75" width="830" height="10" fill="#27272a" />
  <line x1="15" y1="85" x2="845" y2="85" stroke="#3f3f46" stroke-width="1" />
  <text x="35" y="69" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">TOP TOOLBAR</text>
  <text x="160" y="69" fill="#a1a1aa" font-size="11">Paleta de Creación Rápida: [ N ] Objeto · [ M ] Mensaje · [ C ] Comentario · [ B ] Bang · [ T ] Toggle</text>

  <!-- BARRA LATERAL IZQUIERDA -->
  <rect x="15" y="85" width="160" height="235" fill="#202024" />
  <line x1="175" y1="85" x2="175" y2="320" stroke="#3f3f46" stroke-width="1" />
  <text x="30" y="110" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="10" font-weight="700">LEFT TOOLBAR</text>
  <g transform="translate(30, 130)">
    <circle cx="6" cy="6" r="3" fill="#71717a" />
    <text x="18" y="10" fill="#d4d4d8" font-size="11">Explorador de Archivos</text>
  </g>
  <g transform="translate(30, 160)">
    <circle cx="6" cy="6" r="3" fill="#71717a" />
    <text x="18" y="10" fill="#d4d4d8" font-size="11">Package Manager</text>
  </g>
  <g transform="translate(30, 190)">
    <circle cx="6" cy="6" r="3" fill="#71717a" />
    <text x="18" y="10" fill="#d4d4d8" font-size="11">Snippets de Código</text>
  </g>
  <g transform="translate(30, 220)">
    <circle cx="6" cy="6" r="3" fill="#71717a" />
    <text x="18" y="10" fill="#d4d4d8" font-size="11">Plugins de Audio VST</text>
  </g>

  <!-- LIENZO CENTRAL -->
  <rect x="195" y="100" width="460" height="205" rx="6" fill="#121316" stroke="#27272a" stroke-width="1.5" />
  <text x="425" y="165" fill="#27272a" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0.1em">PATCHER CANVAS</text>
  <text x="425" y="190" fill="#52525b" font-size="12" text-anchor="middle">Área interactiva de programación visual</text>
  <rect x="365" y="215" width="120" height="32" rx="4" fill="#18181b" stroke="#eb6c36" stroke-width="1.5" />
  <circle cx="377" cy="231" r="3" fill="#eb6c36" />
  <text x="425" y="236" fill="#ffedd5" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">cycle~ 440</text>

  <!-- BARRA LATERAL DERECHA -->
  <rect x="675" y="85" width="170" height="235" fill="#202024" />
  <line x1="675" y1="85" x2="675" y2="320" stroke="#3f3f46" stroke-width="1" />
  <text x="695" y="110" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="10" font-weight="700">RIGHT TOOLBAR</text>
  <g transform="translate(695, 125)">
    <rect x="0" y="0" width="135" height="26" rx="4" fill="#27272a" stroke="#eb6c36" stroke-width="1" />
    <text x="12" y="17" fill="#f4f4f5" font-size="11" font-weight="600">Inspector (Ctrl+I)</text>
  </g>
  <g transform="translate(695, 165)">
    <text x="6" y="12" fill="#d4d4d8" font-size="11">Referencia de Objeto</text>
    <text x="6" y="26" fill="#71717a" font-family="ui-monospace, monospace" font-size="9">Atributos y mensajes</text>
  </g>
  <g transform="translate(695, 205)">
    <text x="6" y="12" fill="#d4d4d8" font-size="11">Ayuda Integrada</text>
    <text x="6" y="26" fill="#71717a" font-family="ui-monospace, monospace" font-size="9">Manuales oficiales</text>
  </g>

  <!-- BARRA INFERIOR -->
  <rect x="15" y="320" width="830" height="45" rx="8" fill="#27272a" />
  <rect x="15" y="320" width="830" height="10" fill="#27272a" />
  <line x1="15" y1="320" x2="845" y2="320" stroke="#3f3f46" stroke-width="1" />
  <text x="35" y="347" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">BOTTOM TOOLBAR</text>
  <text x="175" y="347" fill="#a1a1aa" font-size="11">Candado (Lock) · Modo Presentación · Zoom · Audio DSP On/Off · Indicador CPU</text>
  <rect x="740" y="331" width="85" height="24" rx="4" fill="#18181b" stroke="#52525b" stroke-width="1" />
  <circle cx="754" cy="343" r="4" fill="#10b981" />
  <text x="765" y="347" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="10" font-weight="700">DSP ON</text>
</svg>
