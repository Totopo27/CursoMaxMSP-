<svg viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">MULTIPROCESAMIENTO SIMÉTRICO (SMP) Y PARALELISMO MULTINÚCLEO</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 4.1 · POLY~ @PARALLEL 1 &amp; THREAD POOL HARDWARE</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- NODO SUPERIOR: GESTOR DE POLIFONÍA (ACCENT FOCAL) -->
  <g transform="translate(250, 42)">
    <rect width="440" height="74" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="440" height="24" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="19" width="440" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="12" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="0.06em">DESPACHADOR SMP · INSTANCIA POLIFÓNICA</text>
    
    <text x="12" y="46" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="700">[poly~ sintetizador_pesado 16 @parallel 1 @threadcount 4]</text>
    <text x="12" y="62" fill="#fed7aa" font-size="9">Particiona las 16 voces del motor DSP en 4 subprocesos de hardware concurrentes.</text>
  </g>

  <!-- LÍNEAS DE DISTRIBUCIÓN DESDE POLY~ HACIA LOS CORES -->
  <path d="M 320 116 L 320 135 L 135 135 L 135 150" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />
  <path d="M 420 116 L 420 150" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />
  <path d="M 520 116 L 520 150" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />
  <path d="M 620 116 L 620 135 L 805 135 L 805 150" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />

  <!-- 4 NÚCLEOS DE HARDWARE EN PARALELO -->
  <g transform="translate(25, 150)">
    <!-- Core 0 -->
    <rect x="0" y="0" width="210" height="88" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <rect x="0" y="0" width="210" height="20" rx="4" fill="#27272a" />
    <text x="10" y="14" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">CORE 0 · THREAD 0</text>
    <text x="10" y="38" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">Voces 1, 2, 3, 4</text>
    <text x="10" y="54" fill="#71717a" font-size="8">Carga DSP: ~25%</text>
    <rect x="10" y="62" width="190" height="14" rx="2" fill="#121318" />
    <rect x="10" y="62" width="47" height="14" rx="2" fill="#22c55e" />
    <text x="15" y="73" fill="#ffffff" font-family="ui-monospace, monospace" font-size="7">25% Carga</text>

    <!-- Core 1 -->
    <rect x="226" y="0" width="210" height="88" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <rect x="226" y="0" width="210" height="20" rx="4" fill="#27272a" />
    <text x="236" y="14" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">CORE 1 · THREAD 1</text>
    <text x="236" y="38" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">Voces 5, 6, 7, 8</text>
    <text x="236" y="54" fill="#71717a" font-size="8">Carga DSP: ~25%</text>
    <rect x="236" y="62" width="190" height="14" rx="2" fill="#121318" />
    <rect x="236" y="62" width="47" height="14" rx="2" fill="#22c55e" />
    <text x="241" y="73" fill="#ffffff" font-family="ui-monospace, monospace" font-size="7">25% Carga</text>

    <!-- Core 2 -->
    <rect x="453" y="0" width="210" height="88" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <rect x="453" y="0" width="210" height="20" rx="4" fill="#27272a" />
    <text x="463" y="14" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">CORE 2 · THREAD 2</text>
    <text x="463" y="38" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">Voces 9, 10, 11, 12</text>
    <text x="463" y="54" fill="#71717a" font-size="8">Carga DSP: ~25%</text>
    <rect x="463" y="62" width="190" height="14" rx="2" fill="#121318" />
    <rect x="463" y="62" width="47" height="14" rx="2" fill="#22c55e" />
    <text x="468" y="73" fill="#ffffff" font-family="ui-monospace, monospace" font-size="7">25% Carga</text>

    <!-- Core 3 -->
    <rect x="680" y="0" width="210" height="88" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <rect x="680" y="0" width="210" height="20" rx="4" fill="#27272a" />
    <text x="690" y="14" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">CORE 3 · THREAD 3</text>
    <text x="690" y="38" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">Voces 13, 14, 15, 16</text>
    <text x="690" y="54" fill="#71717a" font-size="8">Carga DSP: ~25%</text>
    <rect x="690" y="62" width="190" height="14" rx="2" fill="#121318" />
    <rect x="690" y="62" width="47" height="14" rx="2" fill="#22c55e" />
    <text x="695" y="73" fill="#ffffff" font-family="ui-monospace, monospace" font-size="7">25% Carga</text>
  </g>

  <!-- PANEL INFERIOR: SÍNTESIS VECTORIAL Y LEY DE AMDAHL -->
  <g transform="translate(25, 248)">
    <rect width="890" height="52" rx="4" fill="#151518" stroke="#27272a" stroke-width="1" />
    <text x="20" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">BARRERA DE SINCRONIZACIÓN Y SUMA MASTER:</text>
    <text x="320" y="20" fill="#d4d4d8" font-size="8.5">El hilo maestro espera a que los 4 hilos concluyan su vector antes de sumar las señales al DAC.</text>
    <text x="20" y="38" fill="#71717a" font-family="ui-monospace, monospace" font-size="8">Ley de Amdahl: La aceleración máxima está limitada por la sección serial no paralelizable (mezcla estéreo y context switching).</text>
  </g>
</svg>
