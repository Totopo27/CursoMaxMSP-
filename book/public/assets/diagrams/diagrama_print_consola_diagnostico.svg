<svg viewBox="0 0 940 230" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neu" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">DIAGNÓSTICO EN TIEMPO REAL · EL OBJETO [PRINT] Y MAX CONSOLE</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 0.9B · INSPECCIÓN DE CABLES DE CONTROL</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- PANEL 1: CÓMPUTO EN EL LIENZO (MAX PATCHER) -->
  <g transform="translate(25, 45)">
    <rect width="400" height="160" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <rect width="400" height="22" rx="5" fill="#27272a"/>
    <rect y="17" width="400" height="5" fill="#27272a"/>
    <text x="12" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">LIENZO DE EDICIÓN (PATCHER WINDOW)</text>

    <!-- Caja Operacion [+ 15] -->
    <g transform="translate(40, 38)">
      <rect width="120" height="28" rx="3" fill="#222226" stroke="#52525b" stroke-width="1.2"/>
      <circle cx="15" cy="0" r="2.5" fill="#a1a1aa"/>
      <circle cx="105" cy="0" r="2.5" fill="#71717a"/>
      <circle cx="15" cy="28" r="2.5" fill="#a1a1aa"/>
      <text x="60" y="18" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">+ 15</text>
      <text x="135" y="18" fill="#71717a" font-size="8">Suma aritmética de control</text>
    </g>

    <!-- Cable Patchcord -->
    <line x1="55" y1="66" x2="55" y2="105" stroke="#71717a" stroke-width="1.8"/>
    <text x="65" y="88" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Dato: 42</text>

    <!-- Caja [print resultado_suma] -->
    <g transform="translate(40, 105)">
      <rect width="200" height="30" rx="3" fill="#1c1613" stroke="#eb6c36" stroke-width="1.4"/>
      <circle cx="15" cy="0" r="2.5" fill="#eb6c36"/>
      <text x="100" y="19" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" text-anchor="middle">print resultado_suma</text>
    </g>
    <text x="250" y="124" fill="#a1a1aa" font-size="8">Objeto de depuración no invasivo</text>
  </g>

  <!-- FLECHA CONEXION ENTRE PATCHER Y CONSOLA -->
  <line x1="435" y1="125" x2="485" y2="125" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <text x="460" y="115" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" text-anchor="middle">POST()</text>

  <!-- PANEL 2: SALIDA EN MAX CONSOLE -->
  <g transform="translate(495, 45)">
    <rect width="420" height="160" rx="5" fill="#141417" stroke="#3f3f46" stroke-width="1.2"/>
    <rect width="420" height="22" rx="5" fill="#222226"/>
    <rect y="17" width="420" height="5" fill="#222226"/>
    <circle cx="15" cy="11" r="3.5" fill="#ef4444"/>
    <circle cx="27" cy="11" r="3.5" fill="#eab308"/>
    <circle cx="39" cy="11" r="3.5" fill="#22c55e"/>
    <text x="55" y="15" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">MAX CONSOLE (CTRL + M)</text>

    <!-- LINEA DE LOG -->
    <g transform="translate(15, 40)">
      <rect width="390" height="32" rx="3" fill="#1c1613" stroke="#eb6c36" stroke-width="1"/>
      <text x="10" y="20" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5">[14:02:18]</text>
      <text x="75" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9" font-weight="700">resultado_suma:</text>
      <text x="180" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">42</text>
      <text x="220" y="20" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8">(int)</text>
    </g>

    <!-- NOTAS TECNICAS -->
    <g transform="translate(15, 85)">
      <rect width="390" height="60" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="12" y="18" fill="#a1a1aa" font-size="8">• La etiqueta identifica inequívocamente la procedencia del mensaje.</text>
      <text x="12" y="34" fill="#a1a1aa" font-size="8">• El valor se imprime en el hilo principal sin interferir con el Scheduler musical.</text>
      <text x="12" y="50" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="7.5">• C SDK Equivalente: post("resultado_suma: %ld\n", n);</text>
    </g>
  </g>
</svg>