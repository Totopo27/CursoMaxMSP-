<svg viewBox="0 0 940 250" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">JERARQUÍA DE MEMORIA Y PERSISTENCIA EN COMPUTACIÓN MUSICAL</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 2.0 · LOS TRES NIVELES DE MEMORIA (TABLE, COLL, DICT)</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- NIVEL 1: TABLE -->
  <g transform="translate(25, 42)">
    <rect width="280" height="150" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="280" height="22" rx="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">1. MEMORIA DE ÍNDICES DIRECTOS [TABLE]</text>
    
    <text x="12" y="44" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">Arreglos Indexados O(1)</text>
    <text x="12" y="60" fill="#22c55e" font-size="8.5">Mapeo Entero ──► Entero</text>

    <rect x="12" y="70" width="256" height="56" rx="3" fill="#121318" stroke="#27272a" stroke-width="0.8" />
    <text x="18" y="88" fill="#a1a1aa" font-size="8">• Tablas de ondas (Wavetables)</text>
    <text x="18" y="102" fill="#a1a1aa" font-size="8">• Curvas de velocidad y mapeo de sensores</text>
    <text x="18" y="116" fill="#71717a" font-family="ui-monospace, monospace" font-size="7.5">Acceso instantáneo en un ciclo de reloj</text>
  </g>

  <!-- NIVEL 2: COLL -->
  <g transform="translate(330, 42)">
    <rect width="280" height="150" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="280" height="22" rx="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">2. MEMORIA ASOCIATIVA Y SÍMBOLOS [COLL]</text>
    
    <text x="12" y="44" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="600">Colecciones Heterogéneas</text>
    <text x="12" y="60" fill="#fed7aa" font-size="8.5">Clave (Int/Símbolo) ──► Lista de Átomos</text>

    <rect x="12" y="70" width="256" height="56" rx="3" fill="#121318" stroke="#27272a" stroke-width="0.8" />
    <text x="18" y="88" fill="#a1a1aa" font-size="8">• Secuencias polifónicas con timestamp</text>
    <text x="18" y="102" fill="#a1a1aa" font-size="8">• Diccionarios CSV planos y eventos MIDI</text>
    <text x="18" y="116" fill="#71717a" font-family="ui-monospace, monospace" font-size="7.5">Modos de búsqueda secuencial y por clave</text>
  </g>

  <!-- NIVEL 3: DICT (ACCENT FOCAL) -->
  <g transform="translate(635, 42)">
    <rect width="280" height="150" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="280" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="10" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">3. ÁRBOLES JERÁRQUICOS JSON [DICT]</text>
    
    <text x="12" y="44" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Estructuras Anidadas JSON</text>
    <text x="12" y="60" fill="#eb6c36" font-size="8.5">Árboles Key-Value y Arrays Multidimensionales</text>

    <rect x="12" y="70" width="256" height="56" rx="3" fill="#121318" stroke="#eb6c36" stroke-width="0.8" />
    <text x="18" y="88" fill="#d4d4d8" font-size="8">• Estado global de sintetizadores y presets</text>
    <text x="18" y="102" fill="#d4d4d8" font-size="8">• REST APIs, Max for Live, serialización C</text>
    <text x="18" y="116" fill="#22c55e" font-family="ui-monospace, monospace" font-size="7.5">Paso por referencia: 8 bytes en RAM</text>
  </g>

  <!-- PANEL INFERIOR -->
  <g transform="translate(25, 202)">
    <rect width="890" height="36" rx="4" fill="#151518" stroke="#27272a" stroke-width="1" />
    <text x="18" y="22" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">PRINCIPIO ARQUITECTÓNICO:</text>
    <text x="210" y="22" fill="#a1a1aa" font-size="8.5">Elegí [table] para curvas de transferencia matemáticas O(1), [coll] para listas musicales cronológicas y [dict] para el estado global del sistema.</text>
  </g>
</svg>
