<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22c55e"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="22" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">MAX FOR LIVE (M4L): SISTEMA DE PARÁMETROS LIVE UI Y BINDING CON EL DAW</text>
  <text x="915" y="22" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG H.1 · PARAMETER MODE ENABLED, DAW AUTOMATION &amp; DSP THREAD</text>
  <line x1="25" y1="30" x2="915" y2="30" stroke="#27272a" stroke-width="1"/>

  <!-- OBJETO MAESTRO SUPERIOR: LIVE.DIAL -->
  <g transform="translate(320, 48)">
    <rect width="300" height="110" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="300" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="17" width="300" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="12" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">OBJETO LIVE UI: [live.dial]</text>
    
    <text x="14" y="42" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">live.dial @_parameter_range 20. 20000.</text>
    <text x="14" y="60" fill="#fed7aa" font-size="9">• Type: Float | Unit Style: Hertz (Hz)</text>
    <text x="14" y="76" fill="#fed7aa" font-size="9">• Exponent: 3.5 (Curva Psicoacústica Logarítmica)</text>
    <text x="14" y="94" fill="#a1a1aa" font-size="8.5">Parameter Mode Enabled: ON (Integración Nativa)</text>
  </g>

  <!-- LÍNEAS DE BIFURCACIÓN DESDE LIVE.DIAL -->
  <path d="M 470 158 L 470 185 L 205 185 L 205 208" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-blue)" />
  <path d="M 470 158 L 470 185 L 735 185 L 735 208" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)" />

  <!-- NODO RAMA 1: AUTOMATIZACIÓN Y MOTOR DE ABLETON LIVE -->
  <g transform="translate(45, 210)">
    <rect width="370" height="100" rx="5" fill="#18181b" stroke="#38bdf8" stroke-width="1.2" />
    <rect width="370" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="370" height="5" fill="#27272a" />
    <text x="12" y="15" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8" font-weight="700">PIPELINE DEL HOST DAW (ABLETON LIVE)</text>
    
    <text x="14" y="42" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Automatización y Macro Mapping</text>
    <text x="14" y="58" fill="#cbd5e1" font-size="8.5">• Curvas de envolvente en Arrangement y Session Clips</text>
    <text x="14" y="73" fill="#cbd5e1" font-size="8.5">• Mapeo instantáneo a Racks de Macros y MIDI Learn</text>
    <text x="14" y="88" fill="#38bdf8" font-size="8">Protección de la Pila de Undo: no satura el historial</text>
  </g>

  <!-- NODO RAMA 2: AUDIO THREAD Y MOTOR DSP -->
  <g transform="translate(525, 210)">
    <rect width="370" height="100" rx="5" fill="#18181b" stroke="#22c55e" stroke-width="1.2" />
    <rect width="370" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="370" height="5" fill="#27272a" />
    <text x="12" y="15" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8" font-weight="700">PIPELINE DSP DE AUDIO EN TIEMPO REAL</text>
    
    <text x="14" y="42" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Modulación del Motor de Síntesis</text>
    <text x="14" y="58" fill="#bbf7d0" font-size="8.5">• Frecuencia de corte hacia [lores~] / [biquad~] / [svf~]</text>
    <text x="14" y="73" fill="#bbf7d0" font-size="8.5">• Conversión flotante libre de zipper-noise con rampas</text>
    <text x="14" y="88" fill="#22c55e" font-size="8">Cero bloqueo: desacople seguro entre UI y Audio Thread</text>
  </g>
</svg>