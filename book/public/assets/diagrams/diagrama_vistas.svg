    <text x="227" y="58" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">cycle~</text>

    <path d="M 60 64 L 60 88 L 135 88 L 135 98" fill="none" stroke="#71717a" stroke-width="1.2" />
    <path d="M 147 64 L 147 98" fill="none" stroke="#71717a" stroke-width="1.2" />
    <path d="M 227 64 L 227 88 L 165 88 L 165 98" fill="none" stroke="#71717a" stroke-width="1.2" />

