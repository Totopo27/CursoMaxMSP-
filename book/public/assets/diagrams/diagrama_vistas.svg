<svg viewBox="0 0 860 280" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- HEADER EDITORIAL -->
  <text x="30" y="24" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="0.08em">ARQUITECTURA DE VISTAS · PATCHING VS. PRESENTACIÓN</text>
  <text x="830" y="24" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="end">FIG 0.3 · DESACOPLAMIENTO DE LÓGICA Y GUI</text>
  <line x1="30" y1="32" x2="830" y2="32" stroke="#27272a" stroke-width="1"/>

  <!-- PANEL IZQUIERDO: VISTA DE PARCHEO -->
  <g transform="translate(15, 45)">
    <rect width="405" height="220" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <rect width="405" height="30" rx="6" fill="#27272a" />
    <rect y="24" width="405" height="6" fill="#27272a" />
    <text x="16" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">VISTA DE PARCHEO (PATCHING)</text>
    <text x="320" y="20" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="10">Ctrl + E</text>

    <rect x="25" y="48" width="80" height="24" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1" />
    <text x="65" y="64" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">r freq</text>

    <rect x="130" y="48" width="60" height="24" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1" />
    <text x="160" y="64" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">mtof</text>

    <rect x="215" y="48" width="75" height="24" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1" />
    <text x="252" y="64" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">cycle~</text>

    <path d="M 65 72 L 65 98 L 140 98 L 140 110" fill="none" stroke="#71717a" stroke-width="1.5" />
    <path d="M 160 72 L 160 110" fill="none" stroke="#71717a" stroke-width="1.5" />
    <path d="M 252 72 L 252 98 L 180 98 L 180 110" fill="none" stroke="#71717a" stroke-width="1.5" />

    <rect x="120" y="110" width="130" height="26" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1" />
    <text x="185" y="127" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">lores~ 1200 0.8</text>

    <path d="M 185 136 L 185 158" fill="none" stroke="#3b82f6" stroke-width="1.8" />

    <rect x="145" y="158" width="80" height="30" rx="3" fill="#27272a" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="165" cy="173" r="4" fill="#3b82f6" />
    <circle cx="205" cy="173" r="4" fill="#3b82f6" />
    <text x="185" y="177" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">ezdac~</text>

    <text x="202" y="206" fill="#71717a" font-size="11" text-anchor="middle">Cables de señal, control y lógica matemática expuestos</text>
  </g>

  <!-- PANEL DERECHO: VISTA DE PRESENTACIÓN -->
  <g transform="translate(440, 45)">
    <rect width="405" height="220" rx="6" fill="#1c1613" stroke="#eb6c36" stroke-width="1.5" />
    <rect width="405" height="30" rx="6" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="24" width="405" height="6" fill="rgba(235, 108, 54, 0.18)" />
    <text x="16" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="11" font-weight="700">VISTA DE PRESENTACIÓN (GUI)</text>
    <text x="300" y="20" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="10">Ctrl + Alt + E</text>

    <g transform="translate(60, 52)">
      <circle cx="35" cy="35" r="26" fill="#27272a" stroke="#eb6c36" stroke-width="2" />
      <line x1="35" y1="35" x2="51" y2="21" stroke="#ffedd5" stroke-width="2.5" stroke-linecap="round" />
      <text x="35" y="80" fill="#ffedd5" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">CORTE</text>
      <text x="35" y="94" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">1.200 Hz</text>
    </g>

    <g transform="translate(170, 52)">
      <circle cx="35" cy="35" r="26" fill="#27272a" stroke="#eb6c36" stroke-width="2" />
      <line x1="35" y1="35" x2="21" y2="23" stroke="#ffedd5" stroke-width="2.5" stroke-linecap="round" />
      <text x="35" y="80" fill="#ffedd5" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">RESONANCIA</text>
      <text x="35" y="94" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">0.80 Q</text>
    </g>

    <g transform="translate(295, 48)">
      <rect x="0" y="0" width="38" height="100" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1" />
      <rect x="6" y="28" width="26" height="66" rx="2" fill="#10b981" />
      <rect x="6" y="18" width="26" height="8" rx="1" fill="#eb6c36" />
      <text x="19" y="118" fill="#ffedd5" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">MASTER</text>
      <text x="19" y="132" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">-6.0 dB</text>
    </g>

    <text x="202" y="206" fill="#fed7aa" font-size="11" text-anchor="middle">Interfaz de usuario depurada: cero cables a la vista para el intérprete</text>
