<svg viewBox="0 0 940 280" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <!-- HEADER -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">FLUJO DE TRABAJO EN EL LIENZO · OPERACIONES ESENCIALES Y ATAJOS</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 0.2B · ATAJOS DE TECLADO Y CONTROL DE LIENZO</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- GRID DE 4 COLUMNAS DE OPERACIONES -->
  <!-- COL 1: MODOS DE EDICIÓN -->
  <g transform="translate(25, 45)">
    <rect width="205" height="210" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <rect width="205" height="24" rx="5" fill="#27272a"/>
    <rect y="19" width="205" height="5" fill="#27272a"/>
    <text x="12" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">MODOS DE LIENZO</text>

    <!-- Item 1 -->
    <g transform="translate(10, 36)">
      <rect width="185" height="36" rx="3" fill="#1c1613" stroke="#eb6c36" stroke-width="1"/>
      <text x="10" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Alternar Bloqueo / Edición</text>
      <rect x="10" y="20" width="48" height="12" rx="2" fill="#2a1b14"/>
      <text x="34" y="29" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" text-anchor="middle">Ctrl + E</text>
      <text x="64" y="29" fill="#a1a1aa" font-size="7.5">/ Cmd + E</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(10, 78)">
      <rect width="185" height="36" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <text x="10" y="15" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Bloqueo Temporal Rápido</text>
      <rect x="10" y="20" width="105" height="12" rx="2" fill="#27272a"/>
      <text x="62" y="29" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="7" font-weight="700" text-anchor="middle">Ctrl + Clic en objeto</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(10, 120)">
      <rect width="185" height="36" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <text x="10" y="15" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Modo Presentación (UI)</text>
      <rect x="10" y="20" width="75" height="12" rx="2" fill="#27272a"/>
      <text x="47" y="29" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="7" font-weight="700" text-anchor="middle">Ctrl + Alt + E</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(10, 162)">
      <rect width="185" height="36" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <text x="10" y="15" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Añadir a Presentación</text>
      <rect x="10" y="20" width="75" height="12" rx="2" fill="#27272a"/>
      <text x="47" y="29" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="7" font-weight="700" text-anchor="middle">Ctrl + Alt + P</text>
    </g>
  </g>

  <!-- COL 2: INSPECCIÓN Y PROPIEDADES -->
  <g transform="translate(245, 45)">
    <rect width="215" height="210" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <rect width="215" height="24" rx="5" fill="#27272a"/>
    <rect y="19" width="215" height="5" fill="#27272a"/>
    <text x="12" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">INSPECTOR Y AYUDA</text>

    <g transform="translate(10, 36)">
      <rect width="195" height="48" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <text x="10" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Inspector de Propiedades</text>
      <rect x="10" y="24" width="46" height="14" rx="2" fill="#27272a"/>
      <text x="33" y="34" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">Ctrl + I</text>
      <text x="62" y="34" fill="#a1a1aa" font-size="8">Edita atributos y colores</text>
    </g>

    <g transform="translate(10, 92)">
      <rect width="195" height="48" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <text x="10" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Parche de Ayuda Interactivo</text>
      <rect x="10" y="24" width="70" height="14" rx="2" fill="#27272a"/>
      <text x="45" y="34" fill="#22c55e" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" text-anchor="middle">Alt + Clic</text>
      <text x="86" y="34" fill="#a1a1aa" font-size="8">Abre .maxhelp oficial</text>
    </g>

    <g transform="translate(10, 148)">
      <rect width="195" height="48" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <text x="10" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Consola de Max (Diagnóstico)</text>
      <rect x="10" y="24" width="50" height="14" rx="2" fill="#27272a"/>
      <text x="35" y="34" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">Ctrl + M</text>
      <text x="66" y="34" fill="#a1a1aa" font-size="8">Logs de errores y print</text>
    </g>
  </g>

  <!-- COL 3: INSTANCIACIÓN RÁPIDA -->
  <g transform="translate(475, 45)">
    <rect width="215" height="210" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <rect width="215" height="24" rx="5" fill="#27272a"/>
    <rect y="19" width="215" height="5" fill="#27272a"/>
    <text x="12" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">INSTANCIACIÓN DE OBJETOS</text>

    <g transform="translate(10, 36)">
      <rect width="195" height="36" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <rect x="10" y="10" width="18" height="16" rx="2" fill="#2a1b14" stroke="#eb6c36" stroke-width="1"/>
      <text x="19" y="22" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="middle">N</text>
      <text x="36" y="21" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Caja de Objeto [newobj]</text>
    </g>

    <g transform="translate(10, 78)">
      <rect width="195" height="36" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <rect x="10" y="10" width="18" height="16" rx="2" fill="#27272a"/>
      <text x="19" y="22" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="middle">M</text>
      <text x="36" y="21" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Caja de Mensaje [message]</text>
    </g>

    <g transform="translate(10, 120)">
      <rect width="195" height="36" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <rect x="10" y="10" width="18" height="16" rx="2" fill="#27272a"/>
      <text x="19" y="22" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="middle">B</text>
      <text x="36" y="21" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Botón de Disparo [button] (bang)</text>
    </g>

    <g transform="translate(10, 162)">
      <rect width="195" height="36" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <rect x="10" y="10" width="18" height="16" rx="2" fill="#27272a"/>
      <text x="19" y="22" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="middle">I / F</text>
      <text x="36" y="21" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Cajas Numéricas [number] (int/flt)</text>
    </g>
  </g>

  <!-- COL 4: HIGIENE VISUAL Y CABLES -->
  <g transform="translate(705, 45)">
    <rect width="210" height="210" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <rect width="210" height="24" rx="5" fill="#27272a"/>
    <rect y="19" width="210" height="5" fill="#27272a"/>
    <text x="12" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">HIGIENE DE CABLES</text>

    <g transform="translate(10, 36)">
      <rect width="190" height="48" rx="3" fill="#1c1613" stroke="#eb6c36" stroke-width="1"/>
      <text x="10" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Segmentar Conexiones</text>
      <rect x="10" y="24" width="48" height="14" rx="2" fill="#2a1b14"/>
      <text x="34" y="34" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8" font-weight="700" text-anchor="middle">Ctrl + Y</text>
      <text x="64" y="34" fill="#fed7aa" font-size="8">Cables ortogonales a 90°</text>
    </g>

    <g transform="translate(10, 92)">
      <rect width="190" height="48" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <text x="10" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Alinear Horizontalmente</text>
      <rect x="10" y="24" width="85" height="14" rx="2" fill="#27272a"/>
      <text x="52" y="34" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" text-anchor="middle">Ctrl + Shift + H</text>
    </g>

    <g transform="translate(10, 148)">
      <rect width="190" height="48" rx="3" fill="#222226" stroke="#3f3f46" stroke-width="1"/>
      <text x="10" y="16" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">Alinear Verticalmente</text>
      <rect x="10" y="24" width="85" height="14" rx="2" fill="#27272a"/>
      <text x="52" y="34" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" text-anchor="middle">Ctrl + Shift + V</text>
    </g>
  </g>
</svg>