<svg viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22c55e"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">PIPELINE DE PROCESAMIENTO: CAUSAL STREAMING VS. NO CAUSAL (BATCH)</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG E.4 · CONVOLUCIÓN CAUSAL, LATENCIA CERO &amp; AUDIO THREAD</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- PANEL 1: NO CAUSAL (OFFLINE / INVIABLE EN VIVO) -->
  <g transform="translate(25, 45)">
    <rect width="435" height="185" rx="5" fill="#18181b" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.8" />
    <rect width="435" height="22" rx="5" fill="rgba(239, 68, 68, 0.12)" />
    <text x="10" y="15" fill="#ef4444" font-family="ui-monospace, monospace" font-size="8" font-weight="700">1. MODELO NO CAUSAL (OFFLINE / BATCH)</text>
    <text x="325" y="15" fill="#ef4444" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">INVIABLE EN DIRECTO</text>

    <!-- Visual timeline con lookahead -->
    <g transform="translate(15, 36)">
      <!-- Past Box -->
      <rect x="0" y="0" width="115" height="42" rx="3" fill="#121318" stroke="#3f3f46" stroke-width="0.8" />
      <text x="10" y="18" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="7.5">Audio Pasado (t-N)</text>
      <text x="10" y="32" fill="#71717a" font-size="7">Historial en disco/RAM</text>

      <!-- Current Box -->
      <rect x="145" y="0" width="115" height="42" rx="3" fill="#121318" stroke="#ef4444" stroke-width="1" />
      <text x="12" y="18" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">Muestra Actual (t₀)</text>
      <text x="12" y="32" fill="#ef4444" font-size="7">Momento de ejecución</text>

      <!-- Future Box (Lookahead) -->
      <rect x="290" y="0" width="115" height="42" rx="3" fill="#121318" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="3,3" />
      <text x="10" y="18" fill="#f87171" font-family="ui-monospace, monospace" font-size="7.5">Audio Futuro (t+N)</text>
      <text x="10" y="32" fill="#ef4444" font-size="7">Lookahead necesario</text>

      <!-- Flechas de interdependencia bidireccional -->
      <path d="M 115 21 L 145 21" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-neutral)" />
      <path d="M 290 21 L 260 21" fill="none" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-red)" />
    </g>

    <!-- Explicación de cuello de botella -->
    <g transform="translate(15, 95)">
      <rect width="405" height="74" rx="3" fill="#151518" stroke="#27272a" stroke-width="0.8" />
      <text x="10" y="16" fill="#ef4444" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">CUELLO DE BOTELLA ACÚSTICO:</text>
      <text x="10" y="32" fill="#d4d4d8" font-size="7.5">• Requiere acumular buffers de 500 ms a 2 segundos antes de inferir.</text>
      <text x="10" y="46" fill="#d4d4d8" font-size="7.5">• El músico toca una nota y la respuesta suena medio segundo después.</text>
      <text x="10" y="62" fill="#a1a1aa" font-size="7.2">Convolución bidireccional típica de Whisper offline o Demucs tradicional.</text>
    </g>
  </g>

  <!-- PANEL 2: CAUSAL / STREAMING (ESTÁNDAR DE CONCIERTO EN MAX) -->
  <g transform="translate(480, 45)">
    <rect width="435" height="185" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="435" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="10" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">2. MODELO CAUSAL STREAMING (ESTÁNDAR EN MAX)</text>
    <text x="315" y="15" fill="#22c55e" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">LATENCIA ULTRA-BAJA</text>

    <!-- Visual timeline causal unidireccional -->
    <g transform="translate(15, 36)">
      <!-- Past Buffer -->
      <rect x="0" y="0" width="125" height="42" rx="3" fill="#121318" stroke="#27272a" stroke-width="0.8" />
      <text x="10" y="18" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="7.5">Historial Acotado (t-k)</text>
      <text x="10" y="32" fill="#71717a" font-size="7">Buffer circular de 20-50 ms</text>

      <!-- Audio Block I/O -->
      <rect x="155" y="0" width="115" height="42" rx="3" fill="#121318" stroke="#eb6c36" stroke-width="1" />
      <text x="12" y="18" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">Vector I/O (iovs)</text>
      <text x="12" y="32" fill="#eb6c36" font-size="7">64 a 128 muestras</text>

      <!-- Instant Output -->
      <rect x="300" y="0" width="105" height="42" rx="3" fill="#121318" stroke="#22c55e" stroke-width="0.8" />
      <text x="10" y="18" fill="#22c55e" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">Inferencia Inmediata</text>
      <text x="10" y="32" fill="#22c55e" font-size="7">Latencia &lt; 5 ms</text>

      <!-- Flechas unidireccionales de avance -->
      <path d="M 125 21 L 155 21" fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#arr-accent)" />
      <path d="M 270 21 L 300 21" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arr-green)" />
    </g>

    <!-- Explicación de ventaja técnica -->
    <g transform="translate(15, 95)">
      <rect width="405" height="74" rx="3" fill="#151518" stroke="#eb6c36" stroke-width="0.8" />
      <text x="10" y="16" fill="#22c55e" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">INGENIERÍA PARA ESCENARIO (PERFORM64):</text>
      <text x="10" y="32" fill="#d4d4d8" font-size="7.5">• Cero dependencia del futuro: y[t] = f(x[t], x[t-1], ..., h[t-1]).</text>
      <text x="10" y="46" fill="#d4d4d8" font-size="7.5">• Dilated Convolutions &amp; GRUs preservan contexto sin lookahead.</text>
      <text x="10" y="62" fill="#fed7aa" font-size="7.2">Arquitectura implementada en RAVE [nn~], FluCoMa y Silero VAD.</text>
    </g>
  </g>

  <!-- PANEL INFERIOR: FÓRMULA Y MARGEN SEGURO DE RTFX -->
  <g transform="translate(25, 248)">
    <rect width="890" height="50" rx="4" fill="#151518" stroke="#27272a" stroke-width="1" />
    <text x="16" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">REGLA DE ORO DE RTFX EN MAX/MSP:</text>
    <text x="215" y="20" fill="#d4d4d8" font-size="8.5">RTFx = Duración_Audio / Tiempo_Cómputo. Si RTFx ≤ 1.0 = Audio Dropouts destructivos.</text>
    <text x="16" y="36" fill="#22c55e" font-family="ui-monospace, monospace" font-size="7.8">Margen de gira seguro: Mantener RTFx &gt; 2.5× en [dspstate~] para tolerar picos de scheduling y renderizado de interfaz gráfica.</text>
  </g>
</svg>
