<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">COMPILACIÓN Y EJECUCIÓN NATIVA · CADENA JIT DE GEN~</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 5.1 · PIPELINE JIT / LLVM Y RETARDO DE HISTORIAL (Z^-1)</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- PANEL IZQUIERDO: PIPELINE JIT DE COMPILACIÓN -->
  <g transform="translate(25, 45)">
    <rect width="430" height="260" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="430" height="24" rx="6" fill="#27272a" />
    <rect y="19" width="430" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">CADENA DE COMPILACIÓN JIT (JUST-IN-TIME)</text>

    <!-- ETAPAS DEL PIPELINE -->
    <g transform="translate(20, 36)">
      <!-- Step 1 -->
      <rect width="390" height="34" rx="3" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="12" y="21" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">1. Patcher gen~ / Código textual GenExpr</text>

      <!-- Step 2 -->
      <g transform="translate(0, 44)">
        <rect width="390" height="34" rx="3" fill="#222226" stroke="#52525b" stroke-width="1" />
        <text x="12" y="21" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">2. Parser y Árbol de Sintaxis Abstracta (AST)</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 88)">
        <rect width="390" height="34" rx="3" fill="#222226" stroke="#52525b" stroke-width="1" />
        <text x="12" y="21" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">3. Emisión de C++ Intermedio & Compilador LLVM</text>
      </g>

      <!-- Step 4 (Focal) -->
      <g transform="translate(0, 132)">
        <rect width="390" height="42" rx="3" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
        <text x="12" y="18" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">4. Código Máquina Binario x86-64 / ARM64</text>
        <text x="12" y="32" fill="#fed7aa" font-size="8.5">Instrucciones nativas fadd, fmul, SSE/AVX o NEON</text>
      </g>
    </g>

    <!-- Connectors -->
    <path d="M 215 70 L 215 80" stroke="#71717a" stroke-width="1.2" fill="none" marker-end="url(#arr-neutral)" />
    <path d="M 215 114 L 215 124" stroke="#71717a" stroke-width="1.2" fill="none" marker-end="url(#arr-neutral)" />
    <path d="M 215 158 L 215 168" stroke="#eb6c36" stroke-width="1.3" fill="none" marker-end="url(#arr-accent)" />

    <text x="20" y="245" fill="#71717a" font-size="8">Cero overhead de mensajería Obex · Evaluación muestra a muestra</text>
  </g>

  <!-- PANEL DERECHO: OPERADOR HISTORY Y RETARDO Z^-1 - FOCAL ACCENT -->
  <g transform="translate(485, 45)">
    <rect width="430" height="260" rx="6" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="430" height="24" rx="6" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="19" width="430" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="12" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">OPERADOR FUNDAMENTAL: [HISTORY] (RETARDO EXACTO Z^-1)</text>

    <!-- DIAGRAMA INTERNO DE RECURSIÓN -->
    <!-- Input in 1 -->
    <g transform="translate(40, 36)">
      <rect width="90" height="32" rx="3" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="45" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">in 1 (x[n])</text>
    </g>

    <!-- Sumador [+] -->
    <g transform="translate(170, 36)">
      <rect width="40" height="32" rx="3" fill="#2a1b14" stroke="#eb6c36" stroke-width="1.2" />
      <text x="20" y="21" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">[ + ]</text>
    </g>

    <!-- Output out 1 -->
    <g transform="translate(290, 36)">
      <rect width="100" height="32" rx="3" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="50" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">out 1 (y[n])</text>
    </g>

    <!-- Connectors top -->
    <path d="M 130 52 L 170 52" stroke="#71717a" stroke-width="1.3" fill="none" marker-end="url(#arr-neutral)" />
    <path d="M 210 52 L 290 52" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arr-accent)" />

    <!-- Branch down to multiplier [* 0.95] -->
    <path d="M 240 52 L 240 100 L 210 100" stroke="#eb6c36" stroke-width="1.3" fill="none" marker-end="url(#arr-accent)" />

    <g transform="translate(130, 85)">
      <rect width="80" height="30" rx="3" fill="#222226" stroke="#52525b" stroke-width="1" />
      <text x="40" y="19" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">[* 0.95]</text>
    </g>

    <!-- Connector to [history] -->
    <path d="M 170 115 L 170 135" stroke="#eb6c36" stroke-width="1.3" fill="none" marker-end="url(#arr-accent)" />

    <!-- [history] box -->
    <g transform="translate(115, 135)">
      <rect width="110" height="34" rx="4" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
      <text x="55" y="21" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" text-anchor="middle">[history z^-1]</text>
    </g>

    <!-- Feedback loop to [+] -->
    <path d="M 115 152 L 60 152 L 60 85 L 180 85 L 180 68" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arr-accent)" />

    <!-- NOTA TÉCNICA C++ -->
    <g transform="translate(20, 185)">
      <rect width="390" height="58" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="10" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">IMPLEMENTACIÓN C++ EN EL BUCLE PERFORM</text>
      <text x="10" y="32" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="8.5">double y = x + 0.95 * history_1;</text>
      <text x="10" y="46" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="8.5">history_1 = y; // Retardo exacto de 1 muestra (20.8 us)</text>
    </g>
  </g>
</svg>
