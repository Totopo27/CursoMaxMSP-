<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">FRACTURA ONTOLÓGICA EN COMPUTACIÓN MUSICAL · MAX VS. MSP</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 3.0 · REINO DEL CONTROL VS. REINO DEL AUDIO</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- PANEL IZQUIERDO: REINO DEL CONTROL (EVENTOS ASÍNCRONOS / MACRO-TIEMPO) -->
  <g transform="translate(25, 45)">
    <rect width="430" height="260" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="430" height="24" rx="6" fill="#27272a" />
    <rect y="19" width="430" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">1. EL REINO DEL CONTROL (MAX PURO · MACRO-TIEMPO)</text>

    <!-- PROPIEDADES CLAVE -->
    <g transform="translate(16, 36)">
      <text x="0" y="16" fill="#f4f4f5" font-size="11" font-weight="600">Eventos Asíncronos Despachados por Demanda</text>
      <text x="0" y="34" fill="#a1a1aa" font-size="9">• Objetos estándar sin tilde: [metro], [+], [counter], [pack].</text>
      <text x="0" y="50" fill="#a1a1aa" font-size="9">• Cables finos (grises): Transmiten datos SOLO cuando algo cambia.</text>
      <text x="0" y="66" fill="#a1a1aa" font-size="9">• Carga computacional: Si nadie toca, la CPU permanece en reposo (0%).</text>
      <text x="0" y="82" fill="#a1a1aa" font-size="9">• Resolución temporal típica: ~1 milisegundo (1.000 Hz).</text>
    </g>

    <!-- DIAGRAMA VISUAL: TRANSMISIÓN ESPORÁDICA -->
    <g transform="translate(16, 135)">
      <rect width="398" height="100" rx="4" fill="#141417" stroke="#27272a" stroke-width="1" />
      <text x="10" y="18" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">DESPACHO POR MENSAJES (SCHEDULER THREAD)</text>

      <g transform="translate(15, 32)">
        <rect width="90" height="38" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1" />
        <text x="45" y="23" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">[metro 100]</text>
      </g>

      <path d="M 105 51 L 270 51" stroke="#71717a" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#arr-neutral)" />
      <text x="187" y="44" fill="#71717a" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">bang (t=100ms)</text>

      <g transform="translate(280, 32)">
        <rect width="90" height="38" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1" />
        <text x="45" y="23" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">[counter 0 7]</text>
      </g>
      <text x="10" y="88" fill="#71717a" font-size="8">Prioridad temporal: Scheduler Thread / Overdrive activado</text>
    </g>
  </g>

  <!-- PANEL DERECHO: REINO DEL AUDIO / MSP (MICRO-TIEMPO CONTINUO) - FOCAL ACCENT -->
  <g transform="translate(485, 45)">
    <rect width="430" height="260" rx="6" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="430" height="24" rx="6" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="19" width="430" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="12" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">2. EL REINO DEL AUDIO (MSP · MICRO-TIEMPO CONTINUO)</text>

    <!-- PROPIEDADES CLAVE -->
    <g transform="translate(16, 36)">
      <text x="0" y="16" fill="#f4f4f5" font-size="11" font-weight="600">Flujo Síncrono Constante Vectorial</text>
      <text x="0" y="34" fill="#fed7aa" font-size="9">• Objetos con tilde (~): [cycle~], [+~], [lores~], [ezdac~].</text>
      <text x="0" y="50" fill="#a1a1aa" font-size="9">• Cables rayados (amarillo/negro): Corriente continua de muestras.</text>
      <text x="0" y="66" fill="#a1a1aa" font-size="9">• Carga permanente: La CPU computa sin pausa, haya o no sonido audible.</text>
      <text x="0" y="82" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5">• A 48.000 Hz, 1 muestra = 20.83 microsegundos inmutables.</text>
    </g>

    <!-- DIAGRAMA VISUAL: FLUJO VECTORIAL PERFORM64 -->
    <g transform="translate(16, 135)">
      <rect width="398" height="100" rx="4" fill="#2a1b14" stroke="#eb6c36" stroke-width="1" />
      <text x="10" y="18" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">BUCLE VECTORIAL ININTERRUMPIDO (AUDIO THREAD)</text>

      <g transform="translate(15, 32)">
        <rect width="90" height="38" rx="3" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
        <text x="45" y="23" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">[cycle~ 440]</text>
      </g>

      <path d="M 105 51 L 270 51" stroke="#eb6c36" stroke-width="2" fill="none" marker-end="url(#arr-accent)" />
      <text x="187" y="44" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">perform64() 64 smp</text>

      <g transform="translate(280, 32)">
        <rect width="90" height="38" rx="3" fill="#1c1613" stroke="#eb6c36" stroke-width="1.2" />
        <text x="45" y="23" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">[*~ 0.5]</text>
      </g>
      <text x="10" y="88" fill="#eb6c36" font-size="8">Buffer I/O Vector: 256 / 512 muestras · Cero Jitter</text>
    </g>
  </g>
</svg>
