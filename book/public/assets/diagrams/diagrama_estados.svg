<svg viewBox="0 0 940 230" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">MÁQUINA DE ESTADOS DEL LIENZO</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 0.1 · CONTROL DE FLUJO Y VISTAS</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- NODO 1: MODO EDICIÓN -->
  <g transform="translate(25, 42)">
    <rect width="250" height="105" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="250" height="24" rx="5" fill="#27272a" />
    <rect y="19" width="250" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="0.06em">ESTADO 01 · UNLOCKED</text>
    <text x="12" y="50" fill="#f4f4f5" font-size="13" font-weight="600">Modo Edición</text>
    <text x="12" y="70" fill="#a1a1aa" font-size="10.5">Construcción y cableado</text>
    <text x="12" y="88" fill="#71717a" font-family="ui-monospace, monospace" font-size="9">Candado abierto · Puntero libre</text>
    <rect x="175" y="38" width="62" height="18" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1" />
    <text x="206" y="50" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" text-anchor="middle">Ctrl + E</text>
  </g>

  <!-- NODO 2: MODO BLOQUEADO / EJECUCIÓN -->
  <g transform="translate(345, 42)">
    <rect width="250" height="105" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="250" height="24" rx="5" fill="#27272a" />
    <rect y="19" width="250" height="5" fill="#27272a" />
    <text x="12" y="16" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="0.06em">ESTADO 02 · LOCKED</text>
    <text x="12" y="50" fill="#f4f4f5" font-size="13" font-weight="600">Modo Ejecución</text>
    <text x="12" y="70" fill="#a1a1aa" font-size="10.5">Interacción en tiempo real</text>
    <text x="12" y="88" fill="#71717a" font-family="ui-monospace, monospace" font-size="9">Topología fija · Controles activos</text>
    <rect x="175" y="38" width="62" height="18" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1" />
    <text x="206" y="50" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" text-anchor="middle">Ctrl + E</text>
  </g>

  <!-- NODO 3: MODO PRESENTACIÓN -->
  <g transform="translate(665, 42)">
    <rect width="250" height="105" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="250" height="24" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="19" width="250" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="12" y="16" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="0.06em">ESTADO 03 · GUI FINAL</text>
    <text x="12" y="50" fill="#f4f4f5" font-size="13" font-weight="600">Presentación</text>
    <text x="12" y="70" fill="#d4d4d8" font-size="10.5">Panel limpio desacoplado</text>
    <text x="12" y="88" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="9">Cables y cómputo ocultos</text>
    <rect x="165" y="38" width="72" height="18" rx="3" fill="rgba(235, 108, 54, 0.25)" stroke="#eb6c36" stroke-width="1" />
    <text x="201" y="50" fill="#ffedd5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="middle">Ctrl+Alt+E</text>
  </g>

  <!-- CONEXIONES -->
  <path d="M 275 80 L 345 80" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-neutral)" />
  <path d="M 345 115 L 275 115" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-neutral)" />
  <path d="M 595 95 L 665 95" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)" />
  <path d="M 790 147 L 790 195 L 150 195 L 150 147" fill="none" stroke="#eb6c36" stroke-dasharray="3,3" stroke-width="1" marker-end="url(#arr-accent)" />
  <rect x="400" y="186" width="140" height="18" rx="3" fill="#121318" stroke="#3f3f46" stroke-width="0.9" />
  <text x="470" y="198" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" text-anchor="middle">Reanudar edición: Ctrl+Alt+E</text>
  <rect x="295" y="90" width="30" height="15" rx="2" fill="#121318" />
  <text x="310" y="100" fill="#71717a" font-family="ui-monospace, monospace" font-size="7.5" text-anchor="middle">toggle</text>
</svg>
