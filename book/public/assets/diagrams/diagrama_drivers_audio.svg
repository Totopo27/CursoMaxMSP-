<svg viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg" style="background: #121318; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 6px; border: 1px solid #27272a;">
  <defs>
    <marker id="arr-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- HEADER EDITORIAL -->
  <text x="25" y="20" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.08em">SUBSISTEMA DE AUDIO EN WINDOWS · SELECCIÓN Y LATENCIA</text>
  <text x="915" y="20" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="end">FIG 0.7 · DRIVER TOPOLOGY &amp; LATENCY</text>
  <line x1="25" y1="28" x2="915" y2="28" stroke="#27272a" stroke-width="1"/>

  <!-- NODO SUPERIOR: MOTOR DE AUDIO MSP -->
  <g transform="translate(345, 42)">
    <rect width="250" height="42" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1" />
    <text x="12" y="18" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8">MOTOR DE AUDIO MSP</text>
    <text x="12" y="32" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="10" font-weight="700">Audio Status (Options > Audio Status)</text>
  </g>

  <!-- CONECTOR CENTRAL HACIA DISTRIBUCIÓN -->
  <path d="M 470 84 L 470 120" fill="none" stroke="#71717a" stroke-width="1.2" />
  <path d="M 127 120 L 815 120" fill="none" stroke="#71717a" stroke-width="1.2" />

  <!-- 4 RAMAS DE CONTROLADORES -->

  <!-- RAMA 1: ASIO DEDICADO (FOCAL RECOMENDADO) -->
  <path d="M 127 120 L 127 145" fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#arr-accent)" />
  <g transform="translate(25, 145)">
    <rect width="205" height="135" rx="5" fill="#1c1613" stroke="#eb6c36" stroke-width="1.3" />
    <rect width="205" height="22" rx="5" fill="rgba(235, 108, 54, 0.18)" />
    <rect y="17" width="205" height="5" fill="rgba(235, 108, 54, 0.18)" />
    <text x="10" y="15" fill="#eb6c36" font-family="ui-monospace, monospace" font-size="8" font-weight="700">OPCIÓN RECOMENDADA ESTUDIO</text>
    <text x="10" y="44" fill="#f4f4f5" font-size="12" font-weight="600">ASIO Dedicado</text>
    <text x="10" y="62" fill="#fed7aa" font-size="9.5">Interfaz USB/Thunderbolt</text>
    <text x="10" y="78" fill="#71717a" font-size="8.5">Focusrite, MOTU, RME, UAD</text>
    <rect x="10" y="94" width="185" height="26" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="102" y="111" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">Latencia: 3 a 8 ms (Óptima)</text>
  </g>

  <!-- RAMA 2: FL STUDIO ASIO / FLEXASIO -->
  <path d="M 357 120 L 357 145" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-neutral)" />
  <g transform="translate(255, 145)">
    <rect width="205" height="135" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="205" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="205" height="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">TRABAJO MÓVIL SIN INTERFAZ</text>
    <text x="10" y="44" fill="#f4f4f5" font-size="12" font-weight="600">FL Studio ASIO / FlexASIO</text>
    <text x="10" y="62" fill="#a1a1aa" font-size="9.5">Audio compartido con Windows</text>
    <text x="10" y="78" fill="#71717a" font-size="8.5">No bloquea YouTube / Spotify</text>
    <rect x="10" y="94" width="185" height="26" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="102" y="111" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="middle">Latencia: 10 a 20 ms (Buena)</text>
  </g>

  <!-- RAMA 3: ASIO4ALL -->
  <path d="M 587 120 L 587 145" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-neutral)" />
  <g transform="translate(485, 145)">
    <rect width="205" height="135" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
    <rect width="205" height="22" rx="5" fill="#27272a" />
    <rect y="17" width="205" height="5" fill="#27272a" />
    <text x="10" y="15" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="8" font-weight="700">EMULACIÓN WDM HEREDADA</text>
    <text x="10" y="44" fill="#f4f4f5" font-size="12" font-weight="600">ASIO4ALL</text>
    <text x="10" y="62" fill="#a1a1aa" font-size="9.5">Emulación por software</text>
    <text x="10" y="78" fill="#71717a" font-size="8.5">Control exclusivo (monopolio)</text>
    <rect x="10" y="94" width="185" height="26" rx="3" fill="#451a03" stroke="#d97706" stroke-width="1" />
    <text x="102" y="111" fill="#fcd34d" font-family="ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="middle">Latencia: 5 a 12 ms (Inestable)</text>
  </g>

  <!-- RAMA 4: MME / DIRECTSOUND (DESACONSEJADO) -->
  <path d="M 815 120 L 815 145" fill="none" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-neutral)" />
  <g transform="translate(715, 145)">
    <rect width="200" height="135" rx="5" fill="#18181b" stroke="#7f1d1d" stroke-width="1.2" />
    <rect width="200" height="22" rx="5" fill="#450a0a" />
    <rect y="17" width="200" height="5" fill="#450a0a" />
    <text x="10" y="15" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="8" font-weight="700">DESACONSEJADO · EVITAR</text>
    <text x="10" y="44" fill="#f4f4f5" font-size="12" font-weight="600">MME / DirectSound</text>
    <text x="10" y="62" fill="#a1a1aa" font-size="9.5">Drivers nativos de oficina</text>
    <text x="10" y="78" fill="#71717a" font-size="8.5">Inutilizable para síntesis</text>
    <rect x="10" y="94" width="180" height="26" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
    <text x="100" y="111" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">Latencia: 50 a 150 ms (Inútil)</text>
  </g>
</svg>
